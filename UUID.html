<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UUID 生成器</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light dark;
        --bg: #e0e5ec;
        --sh-dark: #a3b1c6;
        --sh-light: #ffffff;
        --text: #3f4a5a;
        --text-soft: #7b8598;
        --accent: #5f6d84;
        --success: #4a9070;
        --radius-lg: 30px;
        --radius-md: 18px;
        --radius-xs: 12px;
        --out-lg: 12px 12px 26px var(--sh-dark), -12px -12px 26px var(--sh-light);
        --out-md: 8px 8px 18px var(--sh-dark), -8px -8px 18px var(--sh-light);
        --out-sm: 5px 5px 12px var(--sh-dark), -5px -5px 12px var(--sh-light);
        --out-xs: 3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light);
        --out-hover: 10px 10px 22px var(--sh-dark), -10px -10px 22px var(--sh-light);
        --in-md: inset 6px 6px 13px var(--sh-dark), inset -6px -6px 13px var(--sh-light);
        --in-sm: inset 4px 4px 9px var(--sh-dark), inset -4px -4px 9px var(--sh-light);
        --in-xs: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
        --t-feedback: 0.18s;
        --t-theme: 0.4s;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-theme: ease;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2c3038;
          --sh-dark: #20232a;
          --sh-light: #383e48;
          --text: #c9cfdb;
          --text-soft: #868e9e;
          --accent: #8fa3c4;
          --success: #5fc094;
        }
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        padding: clamp(20px, 5vw, 56px) clamp(16px, 5vw, 48px);
        padding-bottom: calc(clamp(20px, 5vw, 56px) + env(safe-area-inset-bottom));
        background-color: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        transition:
          background-color var(--t-theme) var(--ease-theme),
          color var(--t-theme) var(--ease-theme);
      }
      .app {
        width: 100%;
        max-width: 680px;
        margin: auto;
        animation: soft-in 0.65s var(--ease) both;
      }
      @keyframes soft-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .title {
        margin: 0 0 clamp(22px, 5vw, 38px);
        font-size: clamp(20px, 5.2vw, 38px);
        font-weight: 600;
        letter-spacing: 0.02em;
        text-align: center;
        color: var(--text);
        transition: color var(--t-theme) var(--ease-theme);
      }
      .panel {
        padding: clamp(22px, 6vw, 46px);
        border-radius: var(--radius-lg);
        background-color: var(--bg);
        box-shadow: var(--out-lg);
        transition:
          box-shadow var(--t-theme) var(--ease-theme),
          background-color var(--t-theme) var(--ease-theme);
      }
      .display {
        display: flex;
        align-items: center;
        gap: clamp(10px, 1.6vw, 20px);
        min-height: clamp(60px, 8vw, 84px);
        padding: clamp(12px, 1.6vw, 22px) clamp(14px, 1.8vw, 24px);
        border-radius: var(--radius-md);
        background-color: var(--bg);
        box-shadow: var(--in-sm);
        transition:
          box-shadow var(--t-theme) var(--ease-theme),
          background-color var(--t-theme) var(--ease-theme);
      }
      .display__text {
        flex: 1;
        min-width: 0;
        font-size: clamp(13px, 1.5vw + 5px, 20px);
        line-height: 1.5;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        word-break: break-all;
        overflow-wrap: anywhere;
        user-select: all;
        -webkit-user-select: all;
        color: var(--text);
        transition: color var(--t-theme) var(--ease-theme);
      }
      .display__text.is-new {
        animation: soft-in 0.45s var(--ease) both;
      }
      .display__copy {
        flex-shrink: 0;
        padding: clamp(9px, 1.2vw, 15px) clamp(13px, 1.6vw, 22px);
        border: 0;
        border-radius: var(--radius-xs);
        background-color: var(--bg);
        color: var(--text-soft);
        font-size: clamp(12.5px, 1.2vw + 5px, 18px);
        font-weight: 600;
        letter-spacing: 0.03em;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        box-shadow: var(--out-xs);
        transition:
          box-shadow var(--t-feedback) var(--ease),
          color var(--t-theme) var(--ease-theme),
          background-color var(--t-theme) var(--ease-theme);
      }
      .display__copy:active {
        box-shadow: var(--in-xs);
      }
      .display__copy.is-copied {
        color: var(--success);
      }
      .btn {
        width: 100%;
        border: 0;
        border-radius: var(--radius-md);
        font-weight: 600;
        letter-spacing: 0.03em;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition:
          box-shadow var(--t-feedback) var(--ease),
          color var(--t-theme) var(--ease-theme),
          background-color var(--t-theme) var(--ease-theme);
      }
      .btn--primary {
        margin-top: clamp(24px, 2.6vw, 32px);
        padding: clamp(18px, 2vw, 24px);
        font-size: clamp(16px, 1.5vw + 7px, 23px);
        background-color: var(--bg);
        color: var(--accent);
        box-shadow: var(--out-md);
      }
      .btn--primary:active {
        box-shadow: var(--in-md);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 6px;
      }
      @media (hover: hover) {
        .btn--primary:hover:not(:active) {
          box-shadow: var(--out-hover);
        }
        .display__copy:hover:not(:active) {
          box-shadow: var(--out-sm);
        }
        .display__copy:hover:not(:active):not(.is-copied) {
          color: var(--accent);
        }
      }
      @media (max-width: 480px) {
        .panel {
          border-radius: 24px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1 class="title">UUID 生成器</h1>
      <section class="panel">
        <div class="display">
          <span class="display__text" id="uuidText" aria-live="polite"></span>
          <button class="display__copy" id="copyBtn" type="button" aria-label="复制 UUID">复制</button>
        </div>
        <button class="btn btn--primary" id="generateBtn" type="button" aria-label="生成新的 UUID">生成</button>
      </section>
    </main>
    <script>
      const UUID = (() => {
        const toHex = (byte) => byte.toString(16).padStart(2, "0");
        const create = () => {
          const bytes = new Uint8Array(16);
          crypto.getRandomValues(bytes);
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          const hex = Array.from(bytes, toHex).join("");
          return [hex.slice(0, 8), hex.slice(8, 12), hex.slice(12, 16), hex.slice(16, 20), hex.slice(20)].join("-");
        };
        return { create };
      })();
      const Clipboard = (() => {
        const fallback = (text) => {
          const field = document.createElement("textarea");
          field.value = text;
          field.setAttribute("readonly", "");
          field.style.cssText = "position:fixed;top:-1000px;left:-1000px;opacity:0;";
          document.body.appendChild(field);
          field.select();
          const ok = document.execCommand("copy");
          field.remove();
          return ok;
        };
        const write = async (text) => {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(text);
              return true;
            } catch (error) {
              return fallback(text);
            }
          }
          return fallback(text);
        };
        return { write };
      })();
      const App = (() => {
        const FEEDBACK_MS = 1500;
        const IDLE_LABEL = "复制";
        const ACTIVE_LABEL = "已复制";
        const els = {
          text: document.getElementById("uuidText"),
          copy: document.getElementById("copyBtn"),
          generate: document.getElementById("generateBtn"),
        };
        const state = {
          uuid: "",
        };
        let copyTimer = null;
        const replayEnter = () => {
          els.text.classList.remove("is-new");
          void els.text.offsetWidth;
          els.text.classList.add("is-new");
        };
        const resetCopy = () => {
          clearTimeout(copyTimer);
          copyTimer = null;
          els.copy.classList.remove("is-copied");
          els.copy.textContent = IDLE_LABEL;
        };
        const generate = () => {
          state.uuid = UUID.create();
          els.text.textContent = state.uuid;
          replayEnter();
          resetCopy();
        };
        const copy = async () => {
          if (!state.uuid) return;
          const ok = await Clipboard.write(state.uuid);
          if (!ok) return;
          clearTimeout(copyTimer);
          els.copy.classList.add("is-copied");
          els.copy.textContent = ACTIVE_LABEL;
          copyTimer = setTimeout(resetCopy, FEEDBACK_MS);
        };
        const bind = () => {
          els.generate.addEventListener("click", generate);
          els.copy.addEventListener("click", copy);
        };
        const init = () => {
          bind();
          generate();
        };
        return { init };
      })();
      App.init();
    </script>
  </body>
</html>
