<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星际大战</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #000;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #eef2f8;
        }
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      canvas.playing {
        cursor: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script>
      (function () {
        "use strict";
        const PI2 = Math.PI * 2;
        const HALF_PI = Math.PI / 2;
        const FONT = "sans-serif";
        const THEMES = {
          dark: {
            bgTop: "#0c1226",
            bgBot: "#04060f",
            blobs: [
              { h: 222, s: 65, l: 42, a: 0.4, x: 0.22, y: 0.18, r: 0.9 },
              { h: 272, s: 60, l: 40, a: 0.32, x: 0.82, y: 0.55, r: 0.8 },
              { h: 192, s: 70, l: 40, a: 0.28, x: 0.45, y: 0.92, r: 0.75 },
            ],
            text: "#f2f5fa",
            text2: "rgba(242,245,250,0.58)",
            text3: "rgba(242,245,250,0.26)",
            accent: "#5ac8fa",
            onAccent: "#04263d",
            danger: "#ff6482",
            gold: "#ffd60a",
            success: "#4cd97a",
            info: "#5ac8fa",
            starRGB: "230,240,255",
            starA: [0.08, 0.5],
            hairline: "rgba(255,255,255,0.1)",
            overlay: "rgba(4,6,15,0.66)",
            shipHi: "#f4f8ff",
            shipMid: "#b4c2d8",
            shipLo: "#556680",
            shipStroke: "rgba(255,255,255,0.3)",
            shipCockpit: "#5ac8fa",
            engineFlame0: "rgba(90,200,250,0.85)",
            engineFlame1: "rgba(90,200,250,0)",
            shieldRGB: "90,200,250",
            enemy: {
              scout: { hi: "#ff8080", lo: "#b83838" },
              fighter: { hi: "#ffb878", lo: "#b86828" },
              cruiser: { hi: "#d4a0f5", lo: "#7a3aa8" },
              boss: { hi: "#ff5570", lo: "#a01838" },
            },
            enemyCore: "rgba(255,255,255,0.5)",
            flash: "#ffffff",
            bullet: "#eaf6ff",
            eBullet: "#ff9a6c",
            explodeEnemy: [
              [255, 200, 120],
              [255, 100, 60],
            ],
            explodePlayer: [
              [255, 220, 140],
              [255, 120, 70],
            ],
            bossBurst: [
              [255, 230, 150],
              [255, 180, 100],
            ],
            dropHealth: [76, 217, 122],
            dropWeapon: [255, 214, 10],
            dropShield: [90, 200, 250],
          },
          light: {
            bgTop: "#f7f9fd",
            bgBot: "#e4ebf5",
            blobs: [
              { h: 222, s: 100, l: 90, a: 0.9, x: 0.22, y: 0.18, r: 0.9 },
              { h: 272, s: 100, l: 92, a: 0.75, x: 0.82, y: 0.55, r: 0.8 },
              { h: 182, s: 75, l: 90, a: 0.7, x: 0.45, y: 0.92, r: 0.75 },
            ],
            text: "#1a1f2e",
            text2: "rgba(26,31,46,0.6)",
            text3: "rgba(26,31,46,0.26)",
            accent: "#0071e3",
            onAccent: "#ffffff",
            danger: "#d63a55",
            gold: "#a85a00",
            success: "#1f8a44",
            info: "#0b7fd0",
            starRGB: "80,105,140",
            starA: [0.04, 0.18],
            hairline: "rgba(0,0,0,0.08)",
            overlay: "rgba(247,249,253,0.8)",
            shipHi: "#4a5270",
            shipMid: "#2a3048",
            shipLo: "#101426",
            shipStroke: "rgba(0,0,0,0.2)",
            shipCockpit: "#0071e3",
            engineFlame0: "rgba(0,113,227,0.7)",
            engineFlame1: "rgba(0,113,227,0)",
            shieldRGB: "0,113,227",
            enemy: {
              scout: { hi: "#e05a70", lo: "#98203a" },
              fighter: { hi: "#e08840", lo: "#985018" },
              cruiser: { hi: "#a860c0", lo: "#602a80" },
              boss: { hi: "#d04050", lo: "#88182c" },
            },
            enemyCore: "rgba(255,255,255,0.55)",
            flash: "#1a1f2e",
            bullet: "#0071e3",
            eBullet: "#d04a1a",
            explodeEnemy: [
              [230, 150, 50],
              [210, 70, 30],
            ],
            explodePlayer: [
              [230, 170, 80],
              [220, 90, 40],
            ],
            bossBurst: [
              [230, 190, 80],
              [220, 140, 60],
            ],
            dropHealth: [30, 160, 80],
            dropWeapon: [180, 120, 0],
            dropShield: [0, 110, 190],
          },
        };
        function buildSprites(theme) {
          theme.blobSprites = theme.blobs.map(function (b) {
            const size = 512;
            const c = document.createElement("canvas");
            c.width = size;
            c.height = size;
            const x = c.getContext("2d");
            const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
            g.addColorStop(0, "hsla(" + b.h + "," + b.s + "%," + b.l + "%," + b.a + ")");
            g.addColorStop(0.55, "hsla(" + b.h + "," + b.s + "%," + b.l + "%," + b.a * 0.35 + ")");
            g.addColorStop(1, "hsla(" + b.h + "," + b.s + "%," + b.l + "%,0)");
            x.fillStyle = g;
            x.fillRect(0, 0, size, size);
            return c;
          });
        }
        buildSprites(THEMES.dark);
        buildSprites(THEMES.light);
        let T = THEMES.dark;
        const mq = matchMedia("(prefers-color-scheme: light)");
        const pickTheme = function () {
          T = mq.matches ? THEMES.light : THEMES.dark;
        };
        pickTheme();
        if (mq.addEventListener) mq.addEventListener("change", pickTheme);
        else if (mq.addListener) mq.addListener(pickTheme);
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        let W = 0,
          H = 0;
        const CFG = {
          MAX_DPR: 2,
          PLAYER_SMOOTH: 0.18,
          COMBO_DURATION: 1.6,
          COMBO_MIN: 3,
          COMBO_MAX_BONUS: 10,
          COMBO_BONUS: 5,
          LEVEL_INTERVAL: 15,
          BOSS_BASE: 600,
          BOSS_INC: 500,
          FIRE_RATES: { 1: 0.22, 2: 0.15, 3: 0.1, 4: 0.08 },
          WEAPON_MAX: 4,
          WEAPON_DURATION: 20,
          WEAPON_DOWNGRADE: 15,
          SHIELD_DURATION: 18,
          SHIELD_BREAK_INV: 0.9,
          HIT_INV: 1.8,
          MAX_LIVES: 5,
          MAX_DT: 0.2,
          SHAKE_DECAY: 9,
          SHAKE_INT: 10,
          PART_GRAV: 40,
          PART_GRAV_R: 50,
          PART_SHRINK: 0.9,
          FLOAT_SPEED: 50,
          FLOAT_LIFE: 1.2,
          MAX_PARTICLES: 400,
        };
        const MODE = { MENU: 0, PLAYING: 1, PAUSED: 2, OVER: 3 };
        const ENEMY = {
          scout: { w: 22, h: 18, hp: 1, spd: 180, spdR: 140, score: 10, canShoot: false, cd: 0, cdR: 0, amp: 50, ampR: 40, freq: 2.5, freqR: 3 },
          fighter: { w: 28, h: 24, hp: 2, spd: 140, spdR: 100, score: 25, canShoot: true, cd: 1.5, cdR: 2, amp: 70, ampR: 50, freq: 1.5, freqR: 2 },
          cruiser: { w: 40, h: 32, hp: 4, spd: 90, spdR: 60, score: 50, canShoot: true, cd: 1.0, cdR: 1.5, amp: 40, ampR: 30, freq: 0.8, freqR: 1.2 },
          boss: { w: 64, h: 46, hp: 20, hpPer: 8, spd: 55, spdR: 30, score: 250, scorePer: 100, canShoot: true, cd: 0.5, cdR: 0, ampR: 0.35, freq: 0.5 },
        };
        const DROP_KEY = { health: "dropHealth", weapon: "dropWeapon", shield: "dropShield" };
        const S = {
          mode: MODE.MENU,
          score: 0,
          lives: 3,
          level: 1,
          weapon: 1,
          weaponTime: 0,
          shield: false,
          shieldTime: 0,
          combo: 0,
          comboTime: 0,
          maxCombo: 0,
          kills: 0,
          bossActive: false,
          bossKilled: 0,
          spawnTime: 0,
          bossThreshold: CFG.BOSS_BASE,
          time: 0,
          shake: 0,
          player: null,
          bullets: [],
          eBullets: [],
          enemies: [],
          particles: [],
          texts: [],
          drops: [],
        };
        const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
        const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        let stars = [];
        function initStars() {
          stars = [];
          const n = Math.round(clamp((W * H) / 13000, 55, 150));
          for (let i = 0; i < n; i++) {
            stars.push({
              x: Math.random() * W,
              y: Math.random() * H,
              r: Math.random() * 1.0 + 0.25,
              s: Math.random() * 0.6 + 0.15,
              a: Math.random(),
            });
          }
        }
        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, CFG.MAX_DPR);
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = W * dpr;
          canvas.height = H * dpr;
          canvas.style.width = W + "px";
          canvas.style.height = H + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          initStars();
        }
        window.addEventListener("resize", resize);
        window.addEventListener("orientationchange", function () {
          setTimeout(resize, 200);
        });
        function newBullet(x, y, ang, spd) {
          return { x: x, y: y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 2.2 };
        }
        function newEBullet(x, y, vx, vy) {
          return { x: x, y: y, vx: vx, vy: vy, r: 3.2 };
        }
        function newEnemy(type, bossN) {
          const tc = ENEMY[type];
          const isBoss = type === "boss";
          const hp = isBoss ? tc.hp + bossN * tc.hpPer : tc.hp;
          const score = isBoss ? tc.score + bossN * tc.scorePer : tc.score;
          return {
            type: type,
            flash: 0,
            shootTimer: 0,
            phase: Math.random() * PI2,
            startX: Math.random() * (W - 120) + 60,
            x: isBoss ? W / 2 : Math.random() * (W - 120) + 60,
            y: isBoss ? -60 : -40,
            entered: false,
            w: tc.w,
            h: tc.h,
            hp: hp,
            maxHp: hp,
            spd: tc.spd + Math.random() * tc.spdR,
            score: score,
            canShoot: tc.canShoot,
            cd: tc.cd + (tc.cdR > 0 ? Math.random() * tc.cdR : 0),
            amp: isBoss ? W * tc.ampR : tc.amp + Math.random() * tc.ampR,
            freq: tc.freq + (tc.freqR > 0 ? Math.random() * tc.freqR : 0),
            bossT: 0,
          };
        }
        function newParticle(x, y, r, g, b, size, life, vx, vy) {
          return {
            x: x,
            y: y,
            r: r,
            g: g,
            b: b,
            size: size,
            life: life,
            maxLife: life,
            vx: vx,
            vy: vy,
            grav: CFG.PART_GRAV + Math.random() * CFG.PART_GRAV_R,
          };
        }
        function newText(x, y, text, color, size, weight) {
          return {
            x: x,
            y: y,
            text: text,
            color: color,
            size: size,
            weight: weight || 400,
            life: CFG.FLOAT_LIFE,
            maxLife: CFG.FLOAT_LIFE,
          };
        }
        function newDrop(x, y, type) {
          return { x: x, y: y, type: type, r: 11, vy: 100, bob: Math.random() * PI2 };
        }
        function burst(x, y, count, c1, c2, range) {
          const diff = range[1] - range[0];
          for (let i = 0; i < count; i++) {
            const a = Math.random() * PI2;
            const sp = 80 + Math.random() * 300;
            const size = range[0] + Math.random() * diff;
            const life = 0.4 + Math.random() * 0.9;
            const c = Math.random() < 0.5 ? c1 : c2;
            S.particles.push(newParticle(x, y, c[0], c[1], c[2], size, life, Math.cos(a) * sp, Math.sin(a) * sp));
          }
        }
        function killEnemy(e) {
          const n = e.type === "boss" ? 50 : e.type === "cruiser" ? 25 : e.type === "fighter" ? 15 : 8;
          burst(e.x, e.y, n, T.explodeEnemy[0], T.explodeEnemy[1], e.type === "boss" ? [2, 6] : [1, 4]);
          if (e.type === "boss") {
            burst(e.x, e.y, 30, T.bossBurst[0], T.bossBurst[1], [3, 8]);
            S.shake = 0.6;
          }
          S.combo++;
          S.comboTime = CFG.COMBO_DURATION;
          if (S.combo > S.maxCombo) S.maxCombo = S.combo;
          const bonus = Math.min(S.combo - 1, CFG.COMBO_MAX_BONUS) * CFG.COMBO_BONUS;
          const total = e.score + bonus;
          S.score += total;
          S.kills++;
          S.texts.push(newText(e.x, e.y - 10, "+" + total, S.combo >= 5 ? T.gold : T.text, 14, 500));
          if (e.type === "cruiser") {
            const r = Math.random();
            S.drops.push(newDrop(e.x, e.y, r < 0.34 ? "health" : r < 0.67 ? "weapon" : "shield"));
          }
          if (e.type === "boss") {
            S.drops.push(newDrop(e.x - 22, e.y, "health"));
            S.drops.push(newDrop(e.x + 22, e.y, "weapon"));
            S.drops.push(newDrop(e.x, e.y - 22, "shield"));
          }
          if (e.type === "fighter" && Math.random() < 0.12) {
            S.drops.push(newDrop(e.x, e.y, Math.random() < 0.5 ? "weapon" : "shield"));
          }
        }
        function hurtPlayer() {
          S.lives--;
          S.shake = 0.5;
          burst(S.player.x, S.player.y - 25, 20, T.explodePlayer[0], T.explodePlayer[1], [1, 5]);
          S.player.inv = CFG.HIT_INV;
          S.combo = 0;
          S.comboTime = 0;
          if (S.lives <= 0) {
            S.mode = MODE.OVER;
            canvas.classList.remove("playing");
          }
        }
        const pointer = { x: 0, y: 0, active: false };
        canvas.addEventListener("mousemove", function (e) {
          pointer.x = e.clientX;
          pointer.y = e.clientY;
          pointer.active = true;
        });
        canvas.addEventListener("mouseenter", function () {
          pointer.active = true;
        });
        canvas.addEventListener("mouseleave", function () {
          pointer.active = false;
        });
        canvas.addEventListener("click", function (e) {
          onTap(e.clientX, e.clientY);
        });
        canvas.addEventListener(
          "touchstart",
          function (e) {
            e.preventDefault();
            const t = e.touches[0];
            pointer.x = t.clientX;
            pointer.y = t.clientY;
            pointer.active = true;
            onTap(pointer.x, pointer.y);
          },
          { passive: false },
        );
        canvas.addEventListener(
          "touchmove",
          function (e) {
            e.preventDefault();
            const t = e.touches[0];
            pointer.x = t.clientX;
            pointer.y = t.clientY;
          },
          { passive: false },
        );
        canvas.addEventListener(
          "touchend",
          function (e) {
            e.preventDefault();
          },
          { passive: false },
        );
        window.addEventListener("keydown", function (e) {
          if (e.key === " " || e.key === "Enter" || e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "ArrowLeft" || e.key === "ArrowRight") {
            e.preventDefault();
            if (S.mode === MODE.MENU || S.mode === MODE.OVER) startGame();
          }
          if (e.key === "p" || e.key === "P" || e.key === "Escape") {
            if (S.mode === MODE.PLAYING) {
              S.mode = MODE.PAUSED;
              canvas.classList.remove("playing");
            } else if (S.mode === MODE.PAUSED) {
              S.mode = MODE.PLAYING;
              canvas.classList.add("playing");
            }
          }
        });
        function onTap(x, y) {
          if (S.mode === MODE.MENU || S.mode === MODE.OVER) {
            startGame();
          } else if (S.mode === MODE.PAUSED) {
            const bw = 200,
              bh = 48;
            const bx = W / 2 - bw / 2;
            const ry = H * 0.5;
            const rr = ry + bh + 14;
            if (x >= bx && x <= bx + bw) {
              if (y >= ry && y <= ry + bh) {
                S.mode = MODE.PLAYING;
                canvas.classList.add("playing");
              } else if (y >= rr && y <= rr + bh) {
                startGame();
              }
            }
          }
        }
        function resetGame() {
          S.score = 0;
          S.lives = 3;
          S.level = 1;
          S.weapon = 1;
          S.weaponTime = 0;
          S.shield = false;
          S.shieldTime = 0;
          S.combo = 0;
          S.comboTime = 0;
          S.maxCombo = 0;
          S.kills = 0;
          S.bossActive = false;
          S.bossKilled = 0;
          S.spawnTime = 0;
          S.bossThreshold = CFG.BOSS_BASE;
          S.time = 0;
          S.shake = 0;
          S.bullets.length = 0;
          S.eBullets.length = 0;
          S.enemies.length = 0;
          S.particles.length = 0;
          S.texts.length = 0;
          S.drops.length = 0;
          S.player = {
            x: W / 2,
            y: H * 0.78,
            w: 34,
            h: 42,
            tx: W / 2,
            ty: H * 0.78,
            inv: 0,
            lastFire: 0,
          };
        }
        let lastTime = performance.now();
        function startGame() {
          resetGame();
          S.mode = MODE.PLAYING;
          canvas.classList.add("playing");
          lastTime = performance.now();
        }
        function updateParticles(dt) {
          for (let i = S.particles.length - 1; i >= 0; i--) {
            const p = S.particles[i];
            p.life -= dt;
            if (p.life <= 0) {
              S.particles.splice(i, 1);
              continue;
            }
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += p.grav * dt;
            p.size = Math.max(0.2, p.size * (1 - dt * CFG.PART_SHRINK));
          }
          for (let i = S.texts.length - 1; i >= 0; i--) {
            const t = S.texts[i];
            t.life -= dt;
            if (t.life <= 0) {
              S.texts.splice(i, 1);
              continue;
            }
            t.y -= CFG.FLOAT_SPEED * dt;
          }
        }
        function update(dt) {
          if (dt > CFG.MAX_DT) dt = CFG.MAX_DT;
          if (S.mode === MODE.PAUSED) return;
          S.time += dt;
          if (S.shake > 0) S.shake *= Math.max(0, 1 - dt * CFG.SHAKE_DECAY);
          for (let i = 0; i < stars.length; i++) {
            const st = stars[i];
            st.y += (16 + st.s * 55) * dt;
            if (st.y > H + 2) {
              st.y = -2;
              st.x = Math.random() * W;
            }
          }
          if (S.mode !== MODE.PLAYING) {
            updateParticles(dt);
            return;
          }
          if (S.comboTime > 0) {
            S.comboTime -= dt;
            if (S.comboTime <= 0) S.combo = 0;
          }
          if (S.weaponTime > 0) {
            S.weaponTime -= dt;
            if (S.weaponTime <= 0 && S.weapon > 1) {
              S.weapon = Math.max(1, S.weapon - 1);
              if (S.weapon > 1) S.weaponTime = CFG.WEAPON_DOWNGRADE;
            }
          }
          if (S.shieldTime > 0) {
            S.shieldTime -= dt;
            if (S.shieldTime <= 0) S.shield = false;
          }
          const p = S.player;
          if (pointer.active) {
            p.tx = pointer.x;
            p.ty = pointer.y;
          }
          const sm = CFG.PLAYER_SMOOTH * (1 + dt * 8);
          p.x += (p.tx - p.x) * sm;
          p.y += (p.ty - p.y) * sm;
          const m = p.w * 0.5;
          p.x = clamp(p.x, m, W - m);
          p.y = clamp(p.y, m, H - m);
          if (p.inv > 0) p.inv -= dt;
          const rate = CFG.FIRE_RATES[Math.min(S.weapon, CFG.WEAPON_MAX)];
          if (S.time - p.lastFire >= rate) {
            p.lastFire = S.time;
            const bx = p.x,
              by = p.y - p.h * 0.45;
            if (S.weapon >= 4) {
              S.bullets.push(newBullet(bx - 12, by, -HALF_PI, 780), newBullet(bx - 6, by, -HALF_PI, 780), newBullet(bx, by, -HALF_PI, 780), newBullet(bx + 6, by, -HALF_PI, 780), newBullet(bx + 12, by, -HALF_PI, 780));
            } else if (S.weapon >= 3) {
              S.bullets.push(newBullet(bx - 10, by, -HALF_PI, 750), newBullet(bx, by, -HALF_PI, 750), newBullet(bx + 10, by, -HALF_PI, 750));
            } else if (S.weapon >= 2) {
              S.bullets.push(newBullet(bx - 7, by, -HALF_PI, 720), newBullet(bx + 7, by, -HALF_PI, 720));
            } else {
              S.bullets.push(newBullet(bx, by, -HALF_PI, 700));
            }
          }
          for (let i = S.bullets.length - 1; i >= 0; i--) {
            const b = S.bullets[i];
            b.x += b.vx * dt;
            b.y += b.vy * dt;

            if (r < 0.55) S.enemies.push(newEnemy("scout", S.bossKilled));
            else if (r < 0.85) S.enemies.push(newEnemy("fighter", S.bossKilled));
            else S.enemies.push(newEnemy("cruiser", S.bossKilled));
            if (S.level >= 3 && Math.random() < 0.35) S.enemies.push(newEnemy("scout", S.bossKilled));

        function heartPath(cx, cy, s) {

        function drawEnemy(e) {

            ctx.lineTo(-hw * 0.4, hh);

          if (S.shake > 0.001) {
            sx = (Math.random() - 0.5) * S.shake * CFG.SHAKE_INT;
            sy = (Math.random() - 0.5) * S.shake * CFG.SHAKE_INT;
          }
          ctx.save();
          ctx.translate(sx, sy);
          for (let i = 0; i < S.drops.length; i++) drawDrop(S.drops[i]);
          for (let i = 0; i < S.enemies.length; i++) drawEnemy(S.enemies[i]);
          if ((S.mode === MODE.PLAYING || S.mode === MODE.PAUSED) && S.player) drawPlayer(S.player);
          for (let i = 0; i < S.bullets.length; i++) {
            const b = S.bullets[i];
            ctx.fillStyle = T.bullet;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, PI2);
            ctx.fill();
          }
          for (let i = 0; i < S.eBullets.length; i++) {
            const b = S.eBullets[i];
            ctx.fillStyle = T.eBullet;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, PI2);
            ctx.fill();
          }
          for (let i = 0; i < S.particles.length; i++) {
            const p = S.particles[i];
            ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
            ctx.fillStyle = "rgb(" + p.r + "," + p.g + "," + p.b + ")";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, PI2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          for (let i = 0; i < S.texts.length; i++) {
            const t = S.texts[i];
            ctx.globalAlpha = Math.max(0, t.life / t.maxLife);
            ctx.font = t.weight + " " + t.size + "px " + FONT;
            ctx.fillStyle = t.color;
            ctx.textAlign = "center";
            ctx.fillText(t.text, t.x, t.y);
          }
          ctx.globalAlpha = 1;
          ctx.restore();
          if (S.mode === MODE.PLAYING || S.mode === MODE.PAUSED) drawHUD();
          if (S.mode === MODE.MENU) drawMenu();
          else if (S.mode === MODE.OVER) drawOver();
          else if (S.mode === MODE.PAUSED) drawPause();
        }
        function loop(now) {
          const dt = Math.min(CFG.MAX_DT, (now - lastTime) / 1000);
          lastTime = now;
          update(dt);
          draw();
          requestAnimationFrame(loop);
        }
        resize();
        resetGame();
        S.mode = MODE.MENU;
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
