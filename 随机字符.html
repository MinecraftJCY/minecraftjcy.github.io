<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>随机字符生成器</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light dark;
        --bg: #e8ecf3;
        --text: #3c4456;
        --text-soft: #9aa2b4;
        --text-mute: #b6bdcb;
        --success: #1e9e5a;
        --shade: rgba(163, 177, 198, 0.62);
        --light: rgba(255, 255, 255, 0.92);
        --r-card: 2rem;
        --r-control: 1.25rem;
        --raise-lg: 10px 10px 20px var(--shade), -10px -10px 20px var(--light);
        --raise: 6px 6px 12px var(--shade), -6px -6px 12px var(--light);
        --press-lg: inset 8px 8px 16px var(--shade), inset -8px -8px 16px var(--light);
        --press: inset 5px 5px 10px var(--shade), inset -5px -5px 10px var(--light);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2b2e35;
          --text: #dfe3ec;
          --text-soft: #838b9c;
          --text-mute: #6d7585;
          --success: #4fd68a;
          --shade: rgba(0, 0, 0, 0.55);
          --light: rgba(255, 255, 255, 0.08);
        }
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        padding: 1.75rem 1.25rem;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        transition:
          background-color 0.35s ease,
          color 0.35s ease;
      }
      .app {
        margin: auto;
        width: 100%;
        max-width: 34rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-align: center;
      }
      .panel,
      .card {
        display: flex;
        flex-direction: column;
        padding: 1.5rem;
        border-radius: var(--r-card);
        background: var(--bg);
        box-shadow: var(--raise-lg);
      }
      .panel {
        gap: 1.75rem;
      }
      .card {
        gap: 1.5rem;
      }
      .field-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .label {
        font-size: 0.9375rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .length-input {
        width: 5rem;
        padding: 0.6rem 0.5rem;
        border: none;
        border-radius: var(--r-control);
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        text-align: center;
        outline: none;
        appearance: textfield;
        -moz-appearance: textfield;
        box-shadow: var(--press);
      }
      .length-input::-webkit-outer-spin-button,
      .length-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .range {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        height: 2rem;
        margin: 0;
        background: transparent;
        cursor: pointer;
      }
      .range:focus {
        outline: none;
      }
      .range::-webkit-slider-runnable-track {
        height: 1rem;
        border-radius: 999px;
        background: var(--bg);
        box-shadow: var(--press);
      }
      .range::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 1.75rem;
        height: 1.75rem;
        margin-top: -0.375rem;
        border: none;
        border-radius: 50%;
        background: var(--bg);
        box-shadow: var(--raise);
        transition:
          box-shadow 0.18s ease,
          transform 0.18s ease;
      }
      .range:active::-webkit-slider-thumb {
        box-shadow: var(--press);
        transform: scale(0.94);
      }
      .range::-moz-range-track {
        height: 1rem;
        border-radius: 999px;
        background: var(--bg);
        box-shadow: var(--press);
      }
      .range::-moz-range-progress {
        height: 1rem;
        border-radius: 999px;
        background: transparent;
      }
      .range::-moz-range-thumb {
        width: 1.75rem;
        height: 1.75rem;
        border: none;
        border-radius: 50%;
        background: var(--bg);
        box-shadow: var(--raise);
        transition:
          box-shadow 0.18s ease,
          transform 0.18s ease;
      }
      .range:active::-moz-range-thumb {
        box-shadow: var(--press);
        transform: scale(0.94);
      }
      .chips {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.875rem;
      }
      .chip,
      .btn {
        border: none;
        border-radius: var(--r-control);
        background: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        box-shadow: var(--raise);
        transition:
          box-shadow 0.2s ease,
          color 0.2s ease;
      }
      .chip:focus,
      .btn:focus {
        outline: none;
      }
      .chip:active,
      .btn:active {
        box-shadow: var(--press);
      }
      .chip {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.9rem 1.1rem;
        font-size: 0.9375rem;
        text-align: left;
        color: var(--text-soft);
      }
      .chip[aria-pressed="true"] {
        color: var(--text);
        box-shadow: var(--press);
      }
      .chip-name {
        font-weight: 600;
      }
      .chip-hint {
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--text-mute);
        transition: color 0.2s ease;
      }
      .chip[aria-pressed="true"] .chip-hint {
        color: var(--text-soft);
      }
      .chip.shake {
        animation: shake 0.3s ease;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }
      .output {
        height: 7rem;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 1.375rem;
        border-radius: var(--r-control);
        background: var(--bg);
        box-shadow: var(--press-lg);
      }
      .output::-webkit-scrollbar {
        width: 8px;
      }
      .output::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: var(--shade);
      }
      .password {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.75;
        letter-spacing: 0.04em;
        word-break: break-all;
      }
      .password.flash {
        animation: flash 0.35s ease;
      }
      @keyframes flash {
        from {
          opacity: 0.25;
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .btn {
        padding: 1.1rem 1.25rem;
        font-size: 0.9375rem;
        letter-spacing: 0.02em;
        color: var(--text);
      }
      .btn.is-copied {
        color: var(--success);
      }
      @media (min-width: 768px) {
        body {
          padding: 2.5rem 1.5rem;
        }
        .app {
          max-width: 38rem;
          gap: 1.75rem;
        }
        .title {
          font-size: 1.75rem;
        }
        .panel,
        .card {
          padding: 2rem;
        }
        .panel {
          gap: 2rem;
        }
        .length-input {
          width: 5.5rem;
          font-size: 1.0625rem;
        }
        .chip {
          font-size: 1rem;
        }
        .output {
          height: 8rem;
        }
        .password {
          font-size: 1.25rem;
        }
      }
      @media (max-width: 360px) {
        .chips {
          grid-template-columns: 1fr;
        }
        .actions {
          gap: 0.75rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1 class="title">随机字符生成器</h1>
      <section class="panel">
        <div class="field">
          <div class="field-head">
            <label class="label" for="lengthInput">长度</label>
            <input class="length-input" id="lengthInput" type="number" min="1" max="512" inputmode="numeric" value="16" aria-label="字符长度" />
          </div>
          <input class="range" id="lengthRange" type="range" min="1" max="512" step="1" value="16" aria-label="字符长度滑块" />
        </div>
        <div class="field">
          <div class="field-head">
            <span class="label" id="charsetLabel">字符类型</span>
          </div>
          <div class="chips" id="chips" role="group" aria-labelledby="charsetLabel">
            <button class="chip" type="button" data-set="lower" aria-pressed="true">
              <span class="chip-name">小写字母</span>
              <span class="chip-hint">a-z</span>
            </button>
            <button class="chip" type="button" data-set="upper" aria-pressed="true">
              <span class="chip-name">大写字母</span>
              <span class="chip-hint">A-Z</span>
            </button>
            <button class="chip" type="button" data-set="digit" aria-pressed="true">
              <span class="chip-name">数字</span>
              <span class="chip-hint">0-9</span>
            </button>
            <button class="chip" type="button" data-set="symbol" aria-pressed="false">
              <span class="chip-name">特殊符号</span>
              <span class="chip-hint">!@#</span>
            </button>
          </div>
        </div>
      </section>
      <section class="card">
        <div class="output">
          <p class="password" id="password"></p>
        </div>
        <div class="actions">
          <button class="btn" id="regenerateBtn" type="button">重新生成</button>
          <button class="btn" id="copyBtn" type="button">复制</button>
        </div>
      </section>
    </main>
    <script>
      (() => {
        "use strict";
        const CHARSETS = {
          lower: "abcdefghijklmnopqrstuvwxyz",
          upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
          digit: "0123456789",
          symbol: "!@#$%^&*()-_=+[]{}<>?/",
        };
        const MIN = 1;
        const MAX = 512;
        const DEFAULT = 16;
        const DEFAULT_SETS = ["lower", "upper", "digit"];
        const UINT32 = 4294967296;
        const el = {
          password: document.getElementById("password"),
          lengthRange: document.getElementById("lengthRange"),
          lengthNumber: document.getElementById("lengthInput"),
          chips: document.getElementById("chips"),
          regenerate: document.getElementById("regenerateBtn"),
          copy: document.getElementById("copyBtn"),
        };
        const state = {
          length: DEFAULT,
          enabled: new Set(DEFAULT_SETS),
        };
        const buf = new Uint32Array(1);
        function randomInt(max) {
          const limit = Math.floor(UINT32 / max) * max;
          let value;
          do {
            crypto.getRandomValues(buf);
            value = buf[0];
          } while (value >= limit);
          return value % max;
        }
        function pick(source) {
          return source[randomInt(source.length)];
        }
        function generate(length) {
          const pools = [];
          for (const key of state.enabled) {
            const pool = CHARSETS[key];
            if (pool) pools.push(pool);
          }
          if (!pools.length) return "";
          const combined = pools.join("");
          const chars = [];
          if (length >= pools.length) {
            for (const pool of pools) chars.push(pick(pool));
          }
          while (chars.length < length) chars.push(pick(combined));
          for (let i = chars.length - 1; i > 0; i -= 1) {
            const j = randomInt(i + 1);
            const swap = chars[i];
            chars[i] = chars[j];
            chars[j] = swap;
          }
          return chars.join("");
        }
        function render() {
          el.password.textContent = generate(state.length);
          el.password.classList.remove("flash");
          void el.password.offsetWidth;
          el.password.classList.add("flash");
        }
        function clamp(value) {
          return Math.min(MAX, Math.max(MIN, Math.round(value)));
        }
        function setLength(value, syncNumber) {
          const next = clamp(value);
          state.length = next;
          el.lengthRange.value = String(next);
          if (syncNumber) el.lengthNumber.value = String(next);
          render();
        }
        async function copy(text) {
          if (navigator.clipboard && window.isSecureContext) {
            try {
              await navigator.clipboard.writeText(text);
              return true;
            } catch {}
          }
          const helper = document.createElement("textarea");
          helper.value = text;
          helper.setAttribute("readonly", "");
          helper.style.cssText = "position:fixed;top:-1000px;left:-1000px;opacity:0";
          document.body.appendChild(helper);
          helper.select();
          let done = false;
          try {
            done = document.execCommand("copy");
          } catch {}
          helper.remove();
          return done;
        }
        let copyTimer;
        function showCopied() {
          clearTimeout(copyTimer);
          el.copy.textContent = "已复制";
          el.copy.classList.add("is-copied");
          copyTimer = setTimeout(() => {
            el.copy.textContent = "复制";
            el.copy.classList.remove("is-copied");
          }, 1600);
        }
        el.regenerate.addEventListener("click", render);
        el.copy.addEventListener("click", async () => {
          const text = el.password.textContent;
          if (text && (await copy(text))) showCopied();
        });
        el.lengthRange.addEventListener("input", (event) => {
          setLength(Number(event.target.value), true);
        });
        el.lengthNumber.addEventListener("input", (event) => {
          const raw = event.target.value.trim();
          if (!raw) return;
          const parsed = Number.parseInt(raw, 10);
          if (Number.isNaN(parsed) || parsed < MIN) return;
          if (parsed > MAX) {
            el.lengthNumber.value = String(MAX);
            setLength(MAX, false);
            return;
          }
          setLength(parsed, false);
        });
        el.lengthNumber.addEventListener("blur", () => {
          el.lengthNumber.value = String(state.length);
        });
        el.chips.addEventListener("click", (event) => {
          const chip = event.target.closest(".chip");
          if (!chip) return;
          const key = chip.dataset.set;
          if (state.enabled.has(key)) {
            if (state.enabled.size === 1) {
              chip.classList.remove("shake");
              void chip.offsetWidth;
              chip.classList.add("shake");
              return;
            }
            state.enabled.delete(key);
            chip.setAttribute("aria-pressed", "false");
          } else {
            state.enabled.add(key);
            chip.setAttribute("aria-pressed", "true");
          }
          render();
        });
        el.chips.addEventListener("animationend", (event) => {
          if (event.animationName === "shake") {
            event.target.classList.remove("shake");
          }
        });
        setLength(DEFAULT, true);
      })();
    </script>
  </body>
</html>
