<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>乘法口诀表</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light dark;
        --bg: #e8ecf3;
        --text: #3c4456;
        --text-soft: #7d8698;
        --shade: rgba(163, 177, 198, 0.62);
        --light: rgba(255, 255, 255, 0.92);
        --raise: 3px 3px 6px var(--shade), -3px -3px 6px var(--light);
        --raise-hover: 5px 5px 10px var(--shade), -5px -5px 10px var(--light);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2b2e35;
          --text: #dfe3ec;
          --text-soft: #939cb0;
          --shade: rgba(0, 0, 0, 0.55);
          --light: rgba(255, 255, 255, 0.08);
        }
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        transition:
          background-color 0.35s ease,
          color 0.35s ease;
      }
      .app {
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: clamp(24px, 3.5vw, 56px) clamp(14px, 3vw, 48px) clamp(32px, 4vw, 72px);
      }
      .title {
        margin: 0 0 clamp(24px, 2.5vw, 40px);
        font-size: clamp(22px, 2.2vw, 32px);
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: center;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(9, minmax(0, 1fr));
        gap: clamp(8px, 1.4vw, 18px);
      }
      .cell {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.15em;
        padding: clamp(9px, 1.2vw, 18px) clamp(3px, 0.6vw, 8px);
        border-radius: clamp(9px, 1.1vw, 16px);
        background: var(--bg);
        box-shadow: var(--raise);
        font-size: clamp(10px, 1.3vw + 5px, 18px);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
        white-space: nowrap;
        user-select: none;
        transition:
          box-shadow 0.22s ease,
          transform 0.22s ease;
      }
      .expr,
      .op {
        color: var(--text-soft);
      }
      .product {
        color: var(--text);
      }
      @media (hover: hover) and (pointer: fine) {
        .cell:hover {
          transform: translateY(-1px);
          box-shadow: var(--raise-hover);
        }
      }
      .cell:active {
        transform: scale(0.97);
      }
      @media (max-width: 680px) {
        :root {
          --raise: 2px 2px 4px var(--shade), -2px -2px 4px var(--light);
        }
        .cell {
          flex-direction: column;
          gap: 0;
          padding: clamp(8px, 2.2vw, 14px) 1px;
          border-radius: 9px;
          font-size: clamp(9px, 2.2vw + 2px, 17px);
        }
        .op {
          display: none;
        }
        .expr {
          font-size: 0.92em;
        }
        .product {
          font-size: 1.15em;
          line-height: 1.2;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1 class="title">乘法口诀表</h1>
      <div class="board" id="board"></div>
    </main>
    <script>
      (() => {
        "use strict";
        const board = document.getElementById("board");
        const cells = [];
        for (let row = 1; row <= 9; row += 1) {
          for (let col = 1; col <= row; col += 1) {
            cells.push(`<div class="cell" style="grid-area:${row}/${col}">` + `<span class="expr">${col}×${row}</span>` + `<span class="op">=</span>` + `<span class="product">${col * row}</span>` + `</div>`);
          }
        }
        board.innerHTML = cells.join("");
      })();
    </script>
  </body>
</html>
