<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>乘法口诀表</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light;
        --bg: #f2f2f7;
        --card: #ffffff;
        --card-hover: #ffffff;
        --text: #1c1c1e;
        --accent: #007aff;
        --border: rgba(60, 60, 67, 0.08);
        --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.05);
        --card-shadow-hover: 0 2px 5px rgba(0, 0, 0, 0.06), 0 10px 22px rgba(0, 0, 0, 0.09);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0b0b0d;
          --card: #1c1c1e;
          --card-hover: #242426;
          --text: #f2f2f7;
          --accent: #0a84ff;
          --border: rgba(255, 255, 255, 0.07);
          --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.3);
          --card-shadow-hover: 0 2px 6px rgba(0, 0, 0, 0.5), 0 10px 24px rgba(0, 0, 0, 0.45);
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
      .app {
        width: 100%;
        max-width: 1040px;
        margin: 0 auto;
        padding: clamp(16px, 3vw, 40px) clamp(10px, 3vw, 32px) clamp(24px, 4vw, 56px);
      }
      .topbar {
        margin-bottom: clamp(16px, 2.5vw, 28px);
      }
      .topbar h1 {
        margin: 0;
        font-size: clamp(20px, 2.4vw, 28px);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(9, minmax(0, 1fr));
        gap: clamp(4px, 0.9vw, 10px);
        animation: board-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes board-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      .cell {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.2em;
        padding: clamp(8px, 1.2vw, 15px) clamp(2px, 0.7vw, 8px);
        border: 1px solid var(--border);
        border-radius: clamp(8px, 1vw, 13px);
        background: var(--card);
        box-shadow: var(--card-shadow);
        font-size: clamp(10px, 0.5vw + 8px, 15px);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
        line-height: 1.15;
        white-space: nowrap;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition:
          transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.22s ease,
          background-color 0.3s ease,
          border-color 0.3s ease;
      }
      .op {
        opacity: 0.45;
      }
      .product {
        font-weight: 600;
        color: var(--accent);
      }
      @media (hover: hover) and (pointer: fine) {
        .cell:hover {
          z-index: 2;
          transform: translateY(-2px);
          background: var(--card-hover);
          box-shadow: var(--card-shadow-hover);
        }
      }
      .cell:active {
        transform: scale(0.96);
        transition-duration: 0.12s;
      }
      @media (max-width: 560px) {
        .cell {
          flex-direction: column;
          gap: 0;
          padding: clamp(7px, 2vw, 12px) 1px;
          border-radius: 9px;
          font-size: clamp(10px, 2.8vw, 14px);
        }
        .op {
          display: none;
        }
        .expr {
          font-size: 0.92em;
        }
        .product {
          font-size: 1.15em;
          line-height: 1.25;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1>乘法口诀表</h1>
      </header>
      <main class="board" id="board"></main>
    </div>
    <script>
      (function () {
        "use strict";
        const board = document.getElementById("board");
        const cells = [];
        for (let row = 1; row <= 9; row += 1) {
          for (let col = 1; col <= row; col += 1) {
            cells.push('<div class="cell" style="grid-area:' + row + "/" + col + '"><span class="expr">' + col + "×" + row + '</span><span class="op">=</span><span class="product">' + col * row + "</span></div>");
          }
        }
        board.innerHTML = cells.join("");
      })();
    </script>
  </body>
</html>
