<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --bg: #e9e4d9;
        --text: #2b2923;
        --text-secondary: #7c786c;
        --surface: rgba(255, 253, 247, 0.72);
        --stroke: rgba(72, 66, 54, 0.13);
        --board-bg: rgba(72, 66, 54, 0.105);
        --cell-bg: rgba(72, 66, 54, 0.045);
        --overlay-bg: rgba(233, 228, 217, 0.86);
        --board-shadow: 0 16px 38px rgba(74, 62, 44, 0.13), 0 2px 8px rgba(74, 62, 44, 0.06), inset 0 1px 0 rgba(255, 253, 247, 0.65);
        --tile-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 1px 2px rgba(74, 62, 44, 0.07);
        --gap: clamp(9px, 2.6vmin, 13px);
        color-scheme: light;
      }
      [data-theme="dark"] {
        --bg: #191714;
        --text: #e9e5dc;
        --text-secondary: #8e8a7f;
        --surface: rgba(255, 250, 240, 0.06);
        --stroke: rgba(255, 248, 235, 0.09);
        --board-bg: rgba(255, 248, 235, 0.045);
        --cell-bg: rgba(255, 248, 235, 0.028);
        --overlay-bg: rgba(25, 23, 20, 0.85);
        --board-shadow: 0 18px 44px rgba(0, 0, 0, 0.6), 0 2px 10px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 248, 235, 0.05);
        --tile-shadow: inset 0 1px 0 rgba(255, 248, 235, 0.05), 0 1px 3px rgba(0, 0, 0, 0.4);
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        background-color: var(--bg);
        color: var(--text);
        transition:
          background-color 0.35s ease,
          color 0.35s ease;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      .app {
        width: min(92vw, 460px, calc(100dvh - 180px));
        min-width: 200px;
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 2.2vh, 18px);
      }
      .header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
      }
      .brand h1 {
        margin: 0;
        font-size: clamp(26px, 7vw, 34px);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      .brand p {
        margin: 3px 0 0;
        font-size: 12px;
        color: var(--text-secondary);
        letter-spacing: 0.01em;
      }
      .scores {
        display: flex;
        gap: 8px;
      }
      .score {
        min-width: 66px;
        padding: 6px 14px 7px;
        border-radius: 14px;
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--stroke);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        text-align: center;
        transition:
          background-color 0.35s ease,
          box-shadow 0.35s ease;
      }
      .score span {
        display: block;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }
      .score strong {
        display: inline-block;
        font-size: 18px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        line-height: 1.25;
      }
      @keyframes scorePop {
        0% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.18);
        }
        100% {
          transform: scale(1);
        }
      }
      .score.bump strong {
        animation: scorePop 0.28s ease;
      }
      .board {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: clamp(16px, 4vmin, 24px);
        background: var(--board-bg);
        box-shadow: var(--board-shadow);
        container-type: inline-size;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        transition:
          background-color 0.35s ease,
          box-shadow 0.35s ease;
      }
      .grid {
        position: absolute;
        inset: var(--gap);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: var(--gap);
      }
      .cell {
        border-radius: 3.2cqw;
        background: var(--cell-bg);
        transition: background-color 0.35s ease;
      }
      .tiles {
        position: absolute;
        inset: var(--gap);
        pointer-events: none;
      }
      .tile {
        --r: 0;
        --c: 0;
        position: absolute;
        top: 0;
        left: 0;
        width: calc((100% - 3 * var(--gap)) / 4);
        height: calc((100% - 3 * var(--gap)) / 4);
        transform: translate(calc(var(--c) * (100% + var(--gap))), calc(var(--r) * (100% + var(--gap))));
        transition: transform 0.12s cubic-bezier(0.22, 0.61, 0.36, 1);
        will-change: transform;
      }
      .tile-inner {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 3.2cqw;
        font-size: 10cqw;
        font-weight: 700;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        background: #f0ece1;
        color: #2b2923;
        box-shadow: var(--tile-shadow);
        transition:
          transform 0.16s cubic-bezier(0.22, 0.61, 0.36, 1),
          background-color 0.28s ease,
          color 0.28s ease,
          box-shadow 0.28s ease;
        will-change: transform;
      }
      .tile-inner.entering {
        transform: scale(0);
      }
      @keyframes tilePop {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.16);
        }
        100% {
          transform: scale(1);
        }
      }
      .tile-inner.pop {
        animation: tilePop 0.18s cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      .tile[data-len="3"] .tile-inner {
        font-size: 7.8cqw;
      }
      .tile[data-len="4"] .tile-inner {
        font-size: 6.2cqw;
      }
      .tile[data-len="5"] .tile-inner {
        font-size: 5cqw;
      }
      .tile[data-v="2"] .tile-inner {
        background: #faf8f2;
        color: #3a3830;
      }
      .tile[data-v="4"] .tile-inner {
        background: #eeece4;
        color: #38362e;
      }
      .tile[data-v="8"] .tile-inner {
        background: #dedfd4;
        color: #34332b;
      }
      .tile[data-v="16"] .tile-inner {
        background: #c8cec0;
        color: #2f2f28;
      }
      .tile[data-v="32"] .tile-inner {
        background: #aab6a6;
        color: #2a2a24;
      }
      .tile[data-v="64"] .tile-inner {
        background: #8a9c8d;
        color: #f6f8f5;
      }
      .tile[data-v="128"] .tile-inner {
        background: #6f8688;
        color: #f3f7f7;
      }
      .tile[data-v="256"] .tile-inner {
        background: #596e79;
        color: #eef3f5;
      }
      .tile[data-v="512"] .tile-inner {
        background: #48586d;
        color: #eaf0f6;
      }
      .tile[data-v="1024"] .tile-inner {
        background: #39465b;
        color: #e8eef6;
      }
      .tile[data-v="2048"] .tile-inner {
        background: #2a3448;
        color: #e6edf6;
        box-shadow:
          0 0 0 1px rgba(190, 165, 105, 0.45),
          0 0 28px rgba(190, 165, 105, 0.42);
      }
      .tile[data-v="4096"] .tile-inner,
      .tile[data-v="8192"] .tile-inner,
      .tile[data-v="16384"] .tile-inner,
      .tile[data-v="32768"] .tile-inner,
      .tile[data-v="65536"] .tile-inner {
        background: #1c2436;
        color: #e4ebf4;
      }
      [data-theme="dark"] .tile[data-v="2"] .tile-inner {
        background: #37342d;
        color: #c8c4b6;
      }
      [data-theme="dark"] .tile[data-v="4"] .tile-inner {
        background: #42403a;
        color: #d3cfc2;
      }
      [data-theme="dark"] .tile[data-v="8"] .tile-inner {
        background: #515247;
        color: #e0dcd0;
      }
      [data-theme="dark"] .tile[data-v="16"] .tile-inner {
        background: #646b5e;
        color: #eae8de;
      }
      [data-theme="dark"] .tile[data-v="32"] .tile-inner {
        background: #7c8a79;
        color: #1f1d18;
      }
      [data-theme="dark"] .tile[data-v="64"] .tile-inner {
        background: #98a89a;
        color: #1a1814;
      }
      [data-theme="dark"] .tile[data-v="128"] .tile-inner {
        background: #b5c3b8;
        color: #1a1814;
      }
      [data-theme="dark"] .tile[data-v="256"] .tile-inner {
        background: #ced9d0;
        color: #1a1814;
      }
      [data-theme="dark"] .tile[data-v="512"] .tile-inner {
        background: #e0e9e2;
        color: #1a1814;
      }
      [data-theme="dark"] .tile[data-v="1024"] .tile-inner {
        background: #edf2ec;
        color: #1a1814;
      }
      [data-theme="dark"] .tile[data-v="2048"] .tile-inner {
        background: #f7f8f2;
        color: #1a1814;
        box-shadow:
          0 0 0 1px rgba(235, 205, 145, 0.5),
          0 0 32px rgba(225, 190, 125, 0.42);
      }
      [data-theme="dark"] .tile[data-v="4096"] .tile-inner,
      [data-theme="dark"] .tile[data-v="8192"] .tile-inner,
      [data-theme="dark"] .tile[data-v="16384"] .tile-inner,
      [data-theme="dark"] .tile[data-v="32768"] .tile-inner,
      [data-theme="dark"] .tile[data-v="65536"] .tile-inner {
        background: #fdfdf8;
        color: #1a1814;
      }
      .overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: inherit;
        background: var(--overlay-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.32s ease,
          background-color 0.35s ease;
      }
      .overlay.visible {
        opacity: 1;
        pointer-events: auto;
      }
      .overlay-content {
        padding: 24px;
        text-align: center;
        transform: scale(0.94);
        transition: transform 0.32s cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      .overlay.visible .overlay-content {
        transform: scale(1);
      }
      .overlay-content h2 {
        margin: 0 0 6px;
        font-size: clamp(24px, 7cqw, 30px);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .overlay-content p {
        margin: 0 0 20px;
        font-size: 14px;
        color: var(--text-secondary);
      }
      .btn {
        appearance: none;
        border: none;
        border-radius: 999px;
        padding: 11px 24px;
        font-size: 15px;
        font-weight: 600;
        color: var(--bg);
        background: var(--text);
        cursor: pointer;
        touch-action: manipulation;
        transition:
          transform 0.16s cubic-bezier(0.22, 0.61, 0.36, 1),
          opacity 0.2s ease,
          background-color 0.35s ease,
          color 0.35s ease;
      }
      .btn:hover {
        opacity: 0.86;
      }
      .btn:active {
        transform: scale(0.95);
      }
      .btn-ghost {
        color: var(--text);
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--stroke);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        padding: 9px 20px;
        font-size: 14px;
      }
      .btn:focus-visible,
      .icon-btn:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 3px;
      }
      .footer {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .hint {
        flex: 1;
        margin: 0;
        text-align: center;
        font-size: 12px;
        color: var(--text-secondary);
        letter-spacing: 0.01em;
      }
      .icon-btn {
        appearance: none;
        border: none;
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        flex: none;
        border-radius: 50%;
        color: var(--text);
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--stroke);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        cursor: pointer;
        touch-action: manipulation;
        transition:
          transform 0.16s cubic-bezier(0.22, 0.61, 0.36, 1),
          background-color 0.35s ease,
          color 0.35s ease,
          box-shadow 0.35s ease;
      }
      .icon-btn:active {
        transform: scale(0.92);
      }
      .icon-btn svg {
        width: 19px;
        height: 19px;
      }
      .icon-sun {
        display: none;
      }
      [data-theme="dark"] .icon-sun {
        display: block;
      }
      [data-theme="dark"] .icon-moon {
        display: none;
      }
      @media (max-width: 360px) {
        .brand p {
          display: none;
        }
        .hint {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <h1>2048</h1>
          <p>合并数字，抵达 2048</p>
        </div>
        <div class="scores">
          <div class="score" id="score-box">
            <span>得分</span>
            <strong id="score">0</strong>
          </div>
          <div class="score">
            <span>最高</span>
            <strong id="best">0</strong>
          </div>
        </div>
      </header>
      <main class="board" id="board">
        <div class="grid" id="grid"></div>
        <div class="tiles" id="tiles"></div>
        <div class="overlay" id="overlay">
          <div class="overlay-content">
            <h2 id="overlay-title"></h2>
            <p id="overlay-text"></p>
            <button class="btn" id="overlay-action"></button>
          </div>
        </div>
      </main>
      <footer class="footer">
        <button class="btn btn-ghost" id="new-game">新游戏</button>
        <p class="hint">方向键 / WASD · 滑动屏幕</p>
        <button class="icon-btn" id="theme-toggle" aria-label="切换主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.2 14.6A8.6 8.6 0 1 1 9.4 3.8a6.9 6.9 0 0 0 10.8 10.8Z" />
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.1" />
            <path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5" />
          </svg>
        </button>
      </footer>
    </div>
    <script>
      const SIZE = 4;
      const MOVE_MS = 130;
      const SPAWN_FOUR_RATE = 0.1;
      const WIN_VALUE = 2048;
      const BEST_KEY = "best";
      const THEME_KEY = "theme";
      const boardEl = document.getElementById("board");
      const gridEl = document.getElementById("grid");
      const tilesEl = document.getElementById("tiles");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const scoreBox = document.getElementById("score-box");
      const overlayEl = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayText = document.getElementById("overlay-text");
      const overlayAction = document.getElementById("overlay-action");
      const newGameBtn = document.getElementById("new-game");
      const themeToggle = document.getElementById("theme-toggle");
      const DIRECTIONS = {
        up: { dr: -1, dc: 0 },
        down: { dr: 1, dc: 0 },
        left: { dr: 0, dc: -1 },
        right: { dr: 0, dc: 1 },
      };
      const KEY_MAP = {
        arrowup: "up",
        arrowdown: "down",
        arrowleft: "left",
        arrowright: "right",
        w: "up",
        s: "down",
        a: "left",
        d: "right",
      };
      const state = {
        grid: [],
        score: 0,
        best: 0,
        over: false,
        won: false,
        locked: false,
        nextId: 1,
      };
      let overlayHandler = null;
      function createEmptyGrid() {
        return Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
      }
      function forEachCell(callback) {
        for (let r = 0; r < SIZE; r += 1) {
          for (let c = 0; c < SIZE; c += 1) {
            callback(r, c);
          }
        }
      }
      function setPosition(el, r, c) {
        el.style.setProperty("--r", String(r));
        el.style.setProperty("--c", String(c));
      }
      function paintTile(el, value) {
        const text = String(value);
        el.dataset.v = text;
        el.dataset.len = String(text.length);
        el.firstChild.textContent = text;
      }
      function popTile(el) {
        const inner = el.firstChild;
        inner.classList.remove("pop");
        void inner.offsetWidth;
        inner.classList.add("pop");
      }
      function createTile(value, r, c) {
        const el = document.createElement("div");
        el.className = "tile";
        const inner = document.createElement("div");
        inner.className = "tile-inner";
        el.appendChild(inner);
        const tile = { id: state.nextId, value, r, c, el };
        state.nextId += 1;
        paintTile(el, value);
        setPosition(el, r, c);
        return tile;
      }
      function lineCoords(dir, index) {
        const { dr, dc } = DIRECTIONS[dir];
        const coords = [];
        for (let i = 0; i < SIZE; i += 1) {
          if (dc === 0) {
            coords.push([dr < 0 ? i : SIZE - 1 - i, index]);
          } else {
            coords.push([index, dc < 0 ? i : SIZE - 1 - i]);
          }
        }
        return coords;
      }
      function spawnTile() {
        const empties = [];
        forEachCell((r, c) => {
          if (!state.grid[r][c]) empties.push([r, c]);
        });
        if (!empties.length) return null;
        const [r, c] = empties[Math.floor(Math.random() * empties.length)];
        const value = Math.random() < SPAWN_FOUR_RATE ? 4 : 2;
        const tile = createTile(value, r, c);
        state.grid[r][c] = tile;
        const inner = tile.el.firstChild;
        inner.classList.add("entering");
        tilesEl.appendChild(tile.el);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => inner.classList.remove("entering"));
        });
        return tile;
      }
      function addScore(points) {
        if (!points) return;
        state.score += points;
        scoreEl.textContent = String(state.score);
        scoreBox.classList.remove("bump");
        void scoreBox.offsetWidth;
        scoreBox.classList.add("bump");
        if (state.score > state.best) {
          state.best = state.score;
          bestEl.textContent = String(state.best);
          localStorage.setItem(BEST_KEY, String(state.best));
        }
      }
      function hasMoves() {
        for (let r = 0; r < SIZE; r += 1) {
          for (let c = 0; c < SIZE; c += 1) {
            const tile = state.grid[r][c];
            if (!tile) return true;
            const right = c + 1 < SIZE ? state.grid[r][c + 1] : null;
            const down = r + 1 < SIZE ? state.grid[r + 1][c] : null;
            if (right && right.value === tile.value) return true;
            if (down && down.value === tile.value) return true;
          }
        }
        return false;
      }
      function showOverlay(title, text, action, handler) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlayAction.textContent = action;
        overlayHandler = handler;
        overlayEl.classList.add("visible");
      }
      function hideOverlay() {
        overlayEl.classList.remove("visible");
        overlayHandler = null;
      }
      function isOverlayVisible() {
        return overlayEl.classList.contains("visible");
      }
      function checkState() {
        const reachedWin = state.grid.some((row) => row.some((tile) => tile && tile.value >= WIN_VALUE));
        if (reachedWin && !state.won) {
          state.won = true;
          showOverlay("你赢了！", "继续挑战更大的数字吧", "继续游戏", hideOverlay);
          return;
        }
        if (!hasMoves()) {
          state.over = true;
          showOverlay("游戏结束", `最终得分 ${state.score}`, "再来一局", newGame);
        }
      }
      function move(dir) {
        if (state.over || state.locked || isOverlayVisible()) return;
        const next = createEmptyGrid();
        const moves = [];
        const merges = [];
        let moved = false;
        let gained = 0;
        for (let index = 0; index < SIZE; index += 1) {
          const coords = lineCoords(dir, index);
          const tiles = coords.map(([r, c]) => state.grid[r][c]).filter(Boolean);
          let target = 0;
          let i = 0;
          while (i < tiles.length) {
            const a = tiles[i];
            const b = tiles[i + 1];
            const [r, c] = coords[target];
            if (b && a.value === b.value) {
              next[r][c] = a;
              moves.push([a, r, c], [b, r, c]);
              merges.push({ tile: a, victim: b, value: a.value * 2 });
              gained += a.value * 2;
              moved = true;
              i += 2;
            } else {
              next[r][c] = a;
              moves.push([a, r, c]);
              if (a.r !== r || a.c !== c) moved = true;
              i += 1;
            }
            target += 1;
          }
        }
        if (!moved) return;
        state.grid = next;
        state.locked = true;
        moves.forEach(([tile, r, c]) => {
          tile.r = r;
          tile.c = c;
          setPosition(tile.el, r, c);
        });
        addScore(gained);
        spawnTile();
        setTimeout(() => {
          merges.forEach(({ tile, victim, value }) => {
            victim.el.remove();
            tile.value = value;
            paintTile(tile.el, value);
            popTile(tile.el);
          });
          state.locked = false;
          checkState();
        }, MOVE_MS);
      }
      function newGame() {
        hideOverlay();
        tilesEl.replaceChildren();
        state.grid = createEmptyGrid();
        state.score = 0;
        state.over = false;
        state.won = false;
        state.locked = false;
        scoreEl.textContent = "0";
        spawnTile();
        spawnTile();
      }
      function buildGridCells() {
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < SIZE * SIZE; i += 1) {
          const cell = document.createElement("div");
          cell.className = "cell";
          fragment.appendChild(cell);
        }
        gridEl.appendChild(fragment);
      }
      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem(THEME_KEY, theme);
      }
      function toggleTheme() {
        const current = document.documentElement.dataset.theme;
        applyTheme(current === "dark" ? "light" : "dark");
      }
      function initTheme() {
        applyTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");
      }
      function handleKeydown(event) {
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        const dir = KEY_MAP[event.key.toLowerCase()];
        if (!dir) return;
        event.preventDefault();
        move(dir);
      }
      function bindSwipe() {
        let startX = 0;
        let startY = 0;
        let tracking = false;
        boardEl.addEventListener(
          "touchstart",
          (event) => {
            if (event.touches.length !== 1) return;
            tracking = true;
            startX = event.touches[0].clientX;
            startY = event.touches[0].clientY;
          },
          { passive: true },
        );
        boardEl.addEventListener(
          "touchmove",
          (event) => {
            if (tracking) event.preventDefault();
          },
          { passive: false },
        );
        boardEl.addEventListener(
          "touchend",
          (event) => {
            if (!tracking) return;
            tracking = false;
            const touch = event.changedTouches[0];
            const dx = touch.clientX - startX;
            const dy = touch.clientY - startY;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
            if (Math.abs(dx) > Math.abs(dy)) {
              move(dx > 0 ? "right" : "left");
            } else {
              move(dy > 0 ? "down" : "up");
            }
          },
          { passive: true },
        );
        boardEl.addEventListener("touchcancel", () => {
          tracking = false;
        });
      }
      function init() {
        initTheme();
        buildGridCells();
        state.best = Number(localStorage.getItem(BEST_KEY)) || 0;
        bestEl.textContent = String(state.best);
        window.addEventListener("keydown", handleKeydown);
        newGameBtn.addEventListener("click", newGame);
        themeToggle.addEventListener("click", toggleTheme);
        overlayAction.addEventListener("click", () => {
          const handler = overlayHandler;
          if (handler) handler();
        });
        bindSwipe();
        newGame();
      }
      init();
    </script>
  </body>
</html>
