<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BCC 转 SRT</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #e7eaf1;
        --surface: #e7eaf1;
        --light: #ffffff;
        --dark: #c0c6d6;
        --text: #3a4053;
        --muted: #858ca2;
        --success: #2f9e6b;
        --danger: #d4504a;
        --radius-xl: 34px;
        --radius-lg: 22px;
        --radius-md: 14px;
        --raise: 6px 6px 14px var(--dark), -6px -6px 14px var(--light);
        --raise-hover: 7px 7px 17px var(--dark), -7px -7px 17px var(--light);
        --sink: inset 5px 5px 12px var(--dark), inset -5px -5px 12px var(--light);
        --sink-deep: inset 7px 7px 16px var(--dark), inset -7px -7px 16px var(--light);
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #23252b;
          --surface: #23252b;
          --light: #2f323a;
          --dark: #15161a;
          --text: #d9dde7;
          --muted: #838a9c;
          --success: #4cc38a;
          --danger: #f07a72;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(18px, 5vw, 48px);
        background: var(--bg);
        color: var(--text);
        transition:
          background-color 0.4s var(--ease),
          color 0.4s var(--ease);
      }
      [hidden] {
        display: none !important;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        margin: 0;
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      :focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 4px;
      }
      .shell {
        width: 100%;
        max-width: 600px;
        display: grid;
        gap: clamp(20px, 5vw, 32px);
      }
      .hero {
        display: grid;
        gap: 10px;
        text-align: center;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(1.6rem, 6vw, 2.1rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(0.85rem, 3.2vw, 0.95rem);
      }
      .panel {
        display: grid;
        gap: clamp(18px, 4vw, 24px);
        padding: clamp(22px, 6vw, 40px);
        border-radius: var(--radius-xl);
        background: var(--surface);
        box-shadow: var(--raise);
        transition: box-shadow 0.4s var(--ease);
      }
      .drop {
        display: grid;
        justify-items: center;
        gap: 14px;
        width: 100%;
        padding: clamp(34px, 9vw, 56px) clamp(18px, 6vw, 32px);
        border-radius: var(--radius-lg);
        background: var(--surface);
        color: var(--text);
        text-align: center;
        box-shadow: var(--sink);
        transition: box-shadow 0.35s var(--ease);
      }
      .drop__icon {
        display: grid;
        place-items: center;
        color: var(--muted);
        transition: transform 0.35s var(--ease);
      }
      .drop__icon svg {
        width: 32px;
        height: 32px;
      }
      .drop__title {
        font-size: clamp(0.95rem, 3.6vw, 1.05rem);
        font-weight: 600;
      }
      .drop.is-dragging {
        box-shadow:
          var(--sink-deep),
          0 0 0 3px var(--text);
      }
      .file {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: var(--radius-lg);
        box-shadow: var(--sink);
        animation: appear 0.35s var(--ease);
      }
      .file__icon {
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .file__icon svg {
        width: 24px;
        height: 24px;
      }
      .file__meta {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 3px;
      }
      .file__name {
        font-size: 0.95rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .file__size {
        color: var(--muted);
        font-size: 0.78rem;
      }
      .icon-btn {
        flex: none;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--surface);
        color: var(--muted);
        box-shadow: var(--raise);
        transition: box-shadow 0.35s var(--ease);
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 18px 24px;
        border-radius: var(--radius-lg);
        background: var(--surface);
        color: var(--text);
        font-size: clamp(0.95rem, 3.6vw, 1rem);
        font-weight: 650;
        letter-spacing: 0.01em;
        box-shadow: var(--raise);
        transition:
          box-shadow 0.35s var(--ease),
          color 0.35s var(--ease);
      }
      .btn:disabled {
        color: var(--muted);
        cursor: not-allowed;
        box-shadow: var(--sink);
      }
      .status {
        margin: 0;
        padding-top: 4px;
        font-size: clamp(0.95rem, 3.5vw, 1.05rem);
        font-weight: 500;
        text-align: center;
        animation: appear 0.35s var(--ease);
      }
      .status[data-tone="success"] {
        color: var(--success);
      }
      .status[data-tone="error"] {
        color: var(--danger);
      }
      @media (hover: hover) and (pointer: fine) {
        .drop:hover {
          box-shadow: var(--sink-deep);
        }
        .drop:hover .drop__icon {
          transform: translateY(-2px);
        }
        .icon-btn:hover {
          box-shadow: var(--raise-hover);
        }
        .btn:hover:not(:disabled) {
          box-shadow: var(--raise-hover);
        }
      }
      .drop:active {
        box-shadow: var(--sink-deep);
      }
      .icon-btn:active {
        box-shadow: var(--sink);
      }
      .btn:active:not(:disabled) {
        box-shadow: var(--sink);
      }
      @media (min-width: 900px) {
        .shell {
          max-width: 660px;
        }
        .panel {
          padding: 44px;
          gap: 26px;
        }
        .drop {
          padding: 62px 36px;
        }
        .hero h1 {
          font-size: 2.3rem;
        }
        .hero p {
          font-size: 1rem;
        }
        .drop__title {
          font-size: 1.1rem;
        }
        .btn {
          padding: 20px 26px;
          font-size: 1.05rem;
        }
        .file__name {
          font-size: 1rem;
        }
        .status {
          font-size: 1.05rem;
        }
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <h1>BCC 转 SRT</h1>
        <p>将 Bilibili 字幕转为通用格式</p>
      </header>
      <div class="panel">
        <button class="drop" id="dropZone" type="button">
          <span class="drop__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 15V3" />
              <path d="m7 8 5-5 5 5" />
              <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
            </svg>
          </span>
          <span class="drop__title">点击或拖拽上传字幕文件</span>
        </button>
        <input type="file" id="fileInput" accept=".bcc,.json" hidden />
        <div class="file" id="fileInfo" hidden>
          <span class="file__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
              <path d="M14 3v5h5" />
            </svg>
          </span>
          <span class="file__meta">
            <span class="file__name" id="fileName"></span>
            <span class="file__size" id="fileSize"></span>
          </span>
          <button class="icon-btn" id="removeFile" type="button" aria-label="移除文件">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12" />
              <path d="M18 6 6 18" />
            </svg>
          </button>
        </div>
        <button class="btn" id="convertBtn" type="button" hidden>
          <span id="convertLabel">转换并下载</span>
        </button>
        <p class="status" id="statusMessage" role="status" hidden></p>
      </div>
    </main>
    <script>
      const els = {
        drop: document.getElementById("dropZone"),
        input: document.getElementById("fileInput"),
        file: document.getElementById("fileInfo"),
        fileName: document.getElementById("fileName"),
        fileSize: document.getElementById("fileSize"),
        remove: document.getElementById("removeFile"),
        convert: document.getElementById("convertBtn"),
        convertLabel: document.getElementById("convertLabel"),
        status: document.getElementById("statusMessage"),
      };
      let currentFile = null;
      const pad = (value, size = 2) => String(value).padStart(size, "0");
      function formatTime(seconds) {
        const total = Number.isFinite(seconds) ? Math.max(0, seconds) : 0;
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const secs = Math.floor(total % 60);
        const millis = Math.floor((total % 1) * 1000);
        return `${pad(hours)}:${pad(minutes)}:${pad(secs)},${pad(millis, 3)}`;
      }
      function formatSize(bytes) {
        if (!bytes) return "0 B";
        const units = ["B", "KB", "MB", "GB"];
        const index = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
        const value = bytes / 1024 ** index;
        return `${index === 0 ? value : value.toFixed(1)} ${units[index]}`;
      }
      function buildSRT(data) {
        if (!data || !Array.isArray(data.body)) {
          throw new Error("未找到有效的字幕数据");
        }
        const blocks = [];
        for (const cue of data.body) {
          if (!cue || !Number.isFinite(cue.from) || !Number.isFinite(cue.to)) {
            continue;
          }
          const text = typeof cue.content === "string" ? cue.content.trim() : "";
          if (!text) continue;
          blocks.push(`${blocks.length + 1}\n${formatTime(cue.from)} --> ${formatTime(cue.to)}\n${text}`);
        }
        if (!blocks.length) {
          throw new Error("文件中没有有效的字幕条目");
        }
        return `${blocks.join("\n\n")}\n`;
      }
      function download(content, filename) {
        const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      function setStatus(message, tone) {
        els.status.textContent = message;
        els.status.dataset.tone = tone;
        els.status.hidden = false;
      }
      function clearStatus() {
        els.status.hidden = true;
        els.status.textContent = "";
        delete els.status.dataset.tone;
      }
      function showFile(file) {
        currentFile = file;
        els.fileName.textContent = file.name;
        els.fileSize.textContent = formatSize(file.size);
        els.drop.hidden = true;
        els.file.hidden = false;
        els.convert.hidden = false;
        els.convert.disabled = false;
        clearStatus();
      }
      function resetFile() {
        currentFile = null;
        els.input.value = "";
        els.drop.hidden = false;
        els.file.hidden = true;
        els.convert.hidden = true;
        els.convert.disabled = true;
        clearStatus();
      }
      function acceptFile(file) {
        if (!file) return;
        if (!/\.(bcc|json)$/i.test(file.name)) {
          setStatus("请上传 .bcc 或 .json 格式的文件", "error");
          return;
        }
        showFile(file);
      }
      async function convert() {
        if (!currentFile) return;
        els.convert.disabled = true;
        els.convertLabel.textContent = "转换中…";
        try {
          const raw = await currentFile.text();
          const data = JSON.parse(raw.replace(/^\uFEFF/, ""));
          const srt = buildSRT(data);
          const base = currentFile.name.replace(/\.[^.]+$/, "");
          download(srt, `${base}.srt`);
          setStatus("转换完成，请下载查看", "success");
        } catch (error) {
          const message = error instanceof Error ? error.message : "未知错误";
          setStatus(`转换失败：${message}`, "error");
        } finally {
          els.convert.disabled = false;
          els.convertLabel.textContent = "转换并下载";
        }
      }
      function bindEvents() {
        els.drop.addEventListener("click", () => els.input.click());
        els.input.addEventListener("change", () => acceptFile(els.input.files[0]));
        els.remove.addEventListener("click", resetFile);
        els.convert.addEventListener("click", convert);
        let dragDepth = 0;
        els.drop.addEventListener("dragenter", (event) => {
          event.preventDefault();
          dragDepth += 1;
          els.drop.classList.add("is-dragging");
        });
        els.drop.addEventListener("dragover", (event) => {
          event.preventDefault();
          event.dataTransfer.dropEffect = "copy";
        });
        els.drop.addEventListener("dragleave", () => {
          dragDepth = Math.max(0, dragDepth - 1);
          if (dragDepth === 0) els.drop.classList.remove("is-dragging");
        });
        els.drop.addEventListener("drop", (event) => {
          event.preventDefault();
          dragDepth = 0;
          els.drop.classList.remove("is-dragging");
          acceptFile(event.dataTransfer.files[0]);
        });
        window.addEventListener("dragover", (event) => event.preventDefault());
        window.addEventListener("drop", (event) => event.preventDefault());
      }
      bindEvents();
    </script>
  </body>
</html>
