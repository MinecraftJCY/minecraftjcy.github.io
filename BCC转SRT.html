<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BCC 转 SRT</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";
      } catch (e) {}
    </script>
    <style>
      :root {
        --bg-color: #f5f5f7;
        --card-bg: rgba(255, 255, 255, 0.8);
        --text-primary: #1d1d1f;
        --text-secondary: #86868b;
        --accent-color: #007aff;
        --accent-hover: #0062cc;
        --border-color: rgba(0, 0, 0, 0.1);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
        --radius-lg: 20px;
        --radius-md: 12px;
        --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }
      [data-theme="dark"] {
        --bg-color: #000000;
        --card-bg: rgba(28, 28, 30, 0.8);
        --text-primary: #f5f5f7;
        --text-secondary: #86868b;
        --accent-color: #0a84ff;
        --accent-hover: #409cff;
        --border-color: rgba(255, 255, 255, 0.15);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: background-color 0.5s ease;
        padding: 20px;
      }
      .container {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      header {
        text-align: center;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }
      p.subtitle {
        color: var(--text-secondary);
        font-size: 15px;
      }
      .card {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-md);
        padding: 30px;
        transition: var(--transition);
      }
      .upload-area {
        border: 2px dashed var(--border-color);
        border-radius: var(--radius-md);
        padding: 40px 20px;
        text-align: center;
        cursor: pointer;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
      }
      .upload-area:hover,
      .upload-area.drag-over {
        border-color: var(--accent-color);
        background-color: rgba(0, 122, 255, 0.05);
      }
      .upload-icon {
        width: 48px;
        height: 48px;
        margin-bottom: 16px;
        fill: var(--text-secondary);
        transition: var(--transition);
      }
      .upload-area:hover .upload-icon {
        fill: var(--accent-color);
        transform: translateY(-2px);
      }
      .upload-text {
        font-size: 16px;
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: 4px;
      }
      .upload-hint {
        font-size: 13px;
        color: var(--text-secondary);
      }
      input[type="file"] {
        display: none;
      }
      .file-info {
        display: none;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
        background: rgba(0, 0, 0, 0.03);
        border-radius: var(--radius-md);
        margin-top: 20px;
      }
      [data-theme="dark"] .file-info {
        background: rgba(255, 255, 255, 0.05);
      }
      .file-details {
        display: flex;
        align-items: center;
        gap: 12px;
        overflow: hidden;
      }
      .file-name {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 200px;
      }
      .file-size {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .btn-remove {
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        border-radius: 50%;
        color: var(--text-secondary);
        transition: var(--transition);
      }
      .btn-remove:hover {
        background: rgba(255, 59, 48, 0.1);
        color: #ff3b30;
      }
      .actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }
      .btn {
        flex: 1;
        padding: 14px;
        border-radius: var(--radius-md);
        border: none;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .btn-primary {
        background-color: var(--accent-color);
        color: white;
      }
      .btn-primary:hover {
        background-color: var(--accent-hover);
        transform: scale(1.02);
      }
      .btn-primary:active {
        transform: scale(0.98);
      }
      .btn-primary:disabled {
        background-color: var(--text-secondary);
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      .status-message {
        margin-top: 16px;
        padding: 12px;
        border-radius: var(--radius-md);
        font-size: 14px;
        text-align: center;
        display: none;
        animation: fadeIn 0.3s ease;
      }
      .status-success {
        background-color: rgba(52, 199, 89, 0.1);
        color: #34c759;
      }
      .status-error {
        background-color: rgba(255, 59, 48, 0.1);
        color: #ff3b30;
      }
      .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
        z-index: 100;
        transition: var(--transition);
      }
      .theme-toggle:hover {
        transform: rotate(15deg);
      }
      .theme-icon {
        width: 24px;
        height: 24px;
        fill: var(--text-primary);
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (max-width: 480px) {
        .container {
          padding: 0 10px;
        }
        h1 {
          font-size: 24px;
        }
        .card {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
      <svg class="theme-icon" viewBox="0 0 24 24">
        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-2V4a8 8 0 1 1 0 16z" />
      </svg>
    </button>
    <div class="container">
      <header>
        <h1>BCC 转 SRT</h1>
        <p class="subtitle">将 Bilibili 字幕文件转换为通用格式</p>
      </header>
      <main class="card">
        <div class="upload-area" id="dropZone">
          <svg class="upload-icon" viewBox="0 0 24 24">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
          </svg>
          <div class="upload-text">点击或拖拽上传 .bcc 文件</div>
          <div class="upload-hint">自动识别编码并转换</div>
          <input type="file" id="fileInput" accept=".bcc,.json" />
        </div>
        <div class="file-info" id="fileInfo">
          <div class="file-details">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--text-secondary)">
              <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
            </svg>
            <div>
              <div class="file-name" id="fileName">filename.bcc</div>
              <div class="file-size" id="fileSize">0 KB</div>
            </div>
          </div>
          <button class="btn-remove" id="removeFile" aria-label="Remove File">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
            </svg>
          </button>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="convertBtn" disabled>转换并下载</button>
        </div>
        <div id="statusMessage" class="status-message"></div>
      </main>
    </div>
    <script>
      const Utils = {
        formatTime(seconds) {
          const date = new Date(seconds * 1000);
          const hh = String(Math.floor(seconds / 3600)).padStart(2, "0");
          const mm = String(date.getUTCMinutes()).padStart(2, "0");
          const ss = String(date.getUTCSeconds()).padStart(2, "0");
          const ms = String(date.getUTCMilliseconds()).padStart(3, "0");
          return `${hh}:${mm}:${ss},${ms}`;
        },
        formatFileSize(bytes) {
          if (bytes === 0) return "0 Bytes";
          const k = 1024;
          const sizes = ["Bytes", "KB", "MB", "GB"];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
        },
      };
      const Converter = {
        parseBCC(jsonData) {
          if (!jsonData || !jsonData.body || !Array.isArray(jsonData.body)) {
            throw new Error("文件格式错误：未找到有效的字幕数据(body)");
          }
          let srtContent = "";
          let validCount = 0;
          jsonData.body.forEach((item, index) => {
            if (!item.from || !item.to || !item.content) return;
            validCount++;
            const startTime = Utils.formatTime(item.from);
            const endTime = Utils.formatTime(item.to);
            srtContent += `${validCount}\n`;
            srtContent += `${startTime} --> ${endTime}\n`;
            srtContent += `${item.content.trim()}\n\n`;
          });
          if (validCount === 0) {
            throw new Error("文件中没有有效的字幕条目");
          }
          return srtContent;
        },
        downloadSRT(content, originalFilename) {
          const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          const baseName = originalFilename.replace(/\.[^/.]+$/, "");
          link.href = url;
          link.download = `${baseName}.srt`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        },
      };
      const App = {
        elements: {
          dropZone: document.getElementById("dropZone"),
          fileInput: document.getElementById("fileInput"),
          fileInfo: document.getElementById("fileInfo"),
          fileName: document.getElementById("fileName"),
          fileSize: document.getElementById("fileSize"),
          removeFile: document.getElementById("removeFile"),
          convertBtn: document.getElementById("convertBtn"),
          statusMessage: document.getElementById("statusMessage"),
          themeToggle: document.getElementById("themeToggle"),
        },
        state: {
          file: null,
          isDark: false,
        },
        init() {
          this.setupTheme();
          this.setupEventListeners();
        },
        setupTheme() {
          this.state.isDark = document.documentElement.getAttribute("data-theme") === "dark";
          this.updateTheme();
          this.elements.themeToggle.addEventListener("click", () => {
            this.state.isDark = !this.state.isDark;
            this.updateTheme();
            try {
              localStorage.setItem("theme", this.state.isDark ? "dark" : "light");
            } catch (e) {}
          });
        },
        updateTheme() {
          document.documentElement.setAttribute("data-theme", this.state.isDark ? "dark" : "light");
          const iconPath = this.state.isDark ? "M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-2V4a8 8 0 1 1 0 16z" : "M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z";
          this.elements.themeToggle.querySelector("path").setAttribute("d", iconPath);
        },
        setupEventListeners() {
          const { dropZone, fileInput, removeFile, convertBtn } = this.elements;
          dropZone.addEventListener("click", () => fileInput.click());
          dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("drag-over");
          });
          dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("drag-over");
          });
          dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZone.classList.remove("drag-over");
            if (e.dataTransfer.files.length) {
              this.handleFile(e.dataTransfer.files[0]);
            }
          });
          fileInput.addEventListener("change", (e) => {
            if (e.target.files.length) {
              this.handleFile(e.target.files[0]);
            }
          });
          removeFile.addEventListener("click", (e) => {
            e.stopPropagation();
            this.resetFile();
          });
          convertBtn.addEventListener("click", () => {
            this.processConversion();
          });
        },
        handleFile(file) {
          if (!file.name.endsWith(".bcc") && !file.name.endsWith(".json")) {
            this.showStatus("请上传 .bcc 或 .json 格式的文件", "error");
            return;
          }
          this.state.file = file;
          this.elements.fileName.textContent = file.name;
          this.elements.fileSize.textContent = Utils.formatFileSize(file.size);
          this.elements.dropZone.style.display = "none";
          this.elements.fileInfo.style.display = "flex";
          this.elements.convertBtn.disabled = false;
          this.hideStatus();
        },
        resetFile() {
          this.state.file = null;
          this.elements.fileInput.value = "";
          this.elements.dropZone.style.display = "block";
          this.elements.fileInfo.style.display = "none";
          this.elements.convertBtn.disabled = true;
          this.hideStatus();
        },
        async processConversion() {
          if (!this.state.file) return;
          try {
            this.elements.convertBtn.disabled = true;
            this.elements.convertBtn.textContent = "处理中...";
            const text = await this.state.file.text();
            const jsonData = JSON.parse(text);
            const srtContent = Converter.parseBCC(jsonData);
            Converter.downloadSRT(srtContent, this.state.file.name);
            this.showStatus("转换成功！文件已开始下载", "success");
          } catch (error) {
            console.error(error);
            this.showStatus(`转换失败: ${error.message}`, "error");
          } finally {
            this.elements.convertBtn.disabled = false;
            this.elements.convertBtn.textContent = "转换并下载";
          }
        },
        showStatus(message, type) {
          const el = this.elements.statusMessage;
          el.textContent = message;
          el.className = `status-message status-${type}`;
          el.style.display = "block";
        },
        hideStatus() {
          this.elements.statusMessage.style.display = "none";
        },
      };
      document.addEventListener("DOMContentLoaded", () => {
        App.init();
      });
    </script>
  </body>
</html>
