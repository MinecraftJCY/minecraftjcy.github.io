<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二维码生成器</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #e8ebf0;
        --text: #363c48;
        --muted: #7d8698;
        --accent: #4a7df0;
        --shadow-dark: #c3c9d5;
        --shadow-light: #ffffff;
        --scroll-thumb: #bcc2ce;
        --raised-lg: 10px 10px 22px var(--shadow-dark), -10px -10px 22px var(--shadow-light);
        --raised-sm: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
        --sunken-lg: inset 7px 7px 14px var(--shadow-dark), inset -7px -7px 14px var(--shadow-light);
        --sunken-sm: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        --radius-xl: 34px;
        --radius-lg: 24px;
        --theme-transition: background-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #262a32;
          --text: #dee2ea;
          --muted: #8992a4;
          --accent: #6d9bff;
          --shadow-dark: #1a1d23;
          --shadow-light: #31363f;
          --scroll-thumb: #3e4450;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        transition: var(--theme-transition);
      }
      .app {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(22px, 5.5vw, 60px);
        padding-top: max(clamp(22px, 5.5vw, 60px), env(safe-area-inset-top));
        padding-bottom: max(clamp(22px, 5.5vw, 60px), env(safe-area-inset-bottom));
      }
      .shell {
        width: min(100%, 440px);
        display: grid;
        gap: clamp(20px, 4.5vw, 30px);
      }
      .title {
        margin: 0;
        text-align: center;
        font-size: clamp(1.5rem, 5vw, 1.85rem);
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--text);
        transition: var(--theme-transition);
      }
      .panel {
        display: grid;
        gap: clamp(18px, 4.2vw, 24px);
        padding: clamp(22px, 5.5vw, 30px);
        border-radius: var(--radius-xl);
        background: var(--bg);
        box-shadow: var(--raised-lg);
        transition: var(--theme-transition);
      }
      .field {
        padding: 17px 19px;
        border-radius: var(--radius-lg);
        background: var(--bg);
        box-shadow: var(--sunken-lg);
        transition: var(--theme-transition);
      }
      .field textarea {
        display: block;
        width: 100%;
        min-height: 86px;
        margin: 0;
        padding: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: inherit;
        font: inherit;
        font-size: 1rem;
        line-height: 1.55;
        letter-spacing: 0.005em;
        resize: none;
        scrollbar-width: thin;
        scrollbar-color: var(--scroll-thumb) transparent;
      }
      .field textarea::placeholder {
        color: var(--muted);
        opacity: 0.9;
      }
      .field textarea::-webkit-scrollbar {
        width: 6px;
      }
      .field textarea::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb);
        border-radius: 999px;
      }
      .field textarea::-webkit-scrollbar-thumb:hover {
        background: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 16px;
      }
      .label {
        font-size: clamp(1rem, 3vw, 1.125rem);
        letter-spacing: 0.02em;
        color: var(--muted);
        transition: var(--theme-transition);
      }
      .segmented {
        position: relative;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        width: min(176px, 100%);
        padding: 4px;
        border-radius: 999px;
        background: var(--bg);
        box-shadow: var(--sunken-sm);
        -webkit-tap-highlight-color: transparent;
        transition: var(--theme-transition);
      }
      .thumb {
        position: absolute;
        top: 4px;
        left: 4px;
        bottom: 4px;
        width: calc((100% - 8px) / 4);
        border-radius: 999px;
        background: var(--bg);
        box-shadow: var(--raised-sm);
        pointer-events: none;
        transition:
          transform 0.42s cubic-bezier(0.3, 1.45, 0.5, 1),
          var(--theme-transition);
      }
      .segment {
        position: relative;
        z-index: 1;
        padding: 9px 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.02em;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: color 0.25s ease;
      }
      .segment.is-active {
        color: var(--text);
        font-weight: 600;
      }
      .segment:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .stage {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: var(--radius-xl);
        background: var(--bg);
        box-shadow: var(--sunken-lg);
        transition: var(--theme-transition);
      }
      .code {
        position: absolute;
        inset: clamp(14px, 4.5vw, 22px);
        opacity: 0;
        transform: scale(0.93);
        transition:
          opacity 0.45s ease,
          transform 0.45s cubic-bezier(0.34, 1.3, 0.64, 1);
      }
      .stage.is-ready .code {
        opacity: 1;
        transform: scale(1);
      }
      .code svg {
        display: block;
        width: 100%;
        height: 100%;
        user-select: none;
        -webkit-user-select: none;
      }
      .hint {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 0 clamp(26px, 9vw, 52px);
        text-align: center;
        font-size: clamp(1rem, 3vw, 1.125rem);
        line-height: 1.6;
        letter-spacing: 0.01em;
        color: var(--muted);
        pointer-events: none;
        transition:
          opacity 0.35s ease,
          var(--theme-transition);
      }
      .stage.is-ready .hint {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="shell">
        <h1 class="title">二维码生成器</h1>
        <section class="panel">
          <div class="field">
            <textarea id="input" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="输入文本、链接或任意字符串…"></textarea>
          </div>
          <div class="controls">
            <span class="label">纠错等级</span>
            <div class="segmented" id="levels" role="radiogroup" aria-label="纠错等级">
              <span class="thumb" id="thumb"></span>
              <button type="button" class="segment" role="radio" aria-checked="false" data-level="L">L</button>
              <button type="button" class="segment is-active" role="radio" aria-checked="true" data-level="M">M</button>
              <button type="button" class="segment" role="radio" aria-checked="false" data-level="Q">Q</button>
              <button type="button" class="segment" role="radio" aria-checked="false" data-level="H">H</button>
            </div>
          </div>
          <div class="stage" id="stage">
            <div class="code" id="code"></div>
            <p class="hint" id="hint">输入内容后显示二维码</p>
          </div>
        </section>
      </div>
    </main>
    <script>
      (function () {
        "use strict";
        var LEVELS = ["L", "M", "Q", "H"];
        var DEBOUNCE = 200;
        var HINT_EMPTY = "输入内容后显示二维码";
        var HINT_ERROR = "内容过长，无法生成二维码";
        var dark = window.matchMedia("(prefers-color-scheme: dark)");
        var input = document.getElementById("input");
        var stage = document.getElementById("stage");
        var code = document.getElementById("code");
        var hint = document.getElementById("hint");
        var levels = document.getElementById("levels");
        var thumb = document.getElementById("thumb");
        var level = "M";
        var revision = 0;
        var timer = 0;
        function setHint(message) {
          hint.textContent = message;
        }
        function clearCode() {
          revision++;
          code.innerHTML = "";
          stage.classList.remove("is-ready");
        }
        function fail() {
          clearCode();
          setHint(HINT_ERROR);
        }
        function paint(text) {
          var rev = ++revision;
          try {
            QRCode.toString(
              text,
              {
                type: "svg",
                margin: 0,
                color: {
                  dark: dark.matches ? "#dee2ea" : "#363c48",
                  light: "#00000000",
                },
                errorCorrectionLevel: level,
              },
              function (error, svg) {
                if (rev !== revision) return;
                if (error || !svg) {
                  fail();
                  return;
                }
                code.innerHTML = svg;
                stage.classList.add("is-ready");
              },
            );
          } catch (error) {
            if (rev === revision) fail();
          }
        }
        function render(immediate) {
          clearTimeout(timer);
          var text = input.value;
          if (text.trim() === "") {
            clearCode();
            setHint(HINT_EMPTY);
            return;
          }
          if (immediate) {
            paint(text);
          } else {
            timer = setTimeout(function () {
              paint(text);
            }, DEBOUNCE);
          }
        }
        function selectLevel(next) {
          if (level === next) return;
          level = next;
          thumb.style.transform = "translateX(" + LEVELS.indexOf(level) * 100 + "%)";
          levels.querySelectorAll(".segment").forEach(function (segment) {
            var active = segment.dataset.level === level;
            segment.classList.toggle("is-active", active);
            segment.setAttribute("aria-checked", String(active));
          });
          if (input.value.trim() !== "") render(true);
        }
        input.addEventListener("input", function () {
          render(false);
        });
        levels.addEventListener("click", function (event) {
          var segment = event.target.closest(".segment");
          if (segment) selectLevel(segment.dataset.level);
        });
        dark.addEventListener("change", function () {
          if (input.value.trim() !== "") render(true);
        });
        thumb.style.transform = "translateX(" + LEVELS.indexOf(level) * 100 + "%)";
      })();
    </script>
  </body>
</html>
