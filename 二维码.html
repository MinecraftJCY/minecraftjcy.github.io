<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>二维码生成器</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f1ee;
        --ink: #15171b;
        --dim: #75787f;
        --dot: rgba(21, 23, 27, 0.13);
        --surface: #e9e7e3;
        --ease: cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0b0c0e;
          --ink: #eceef1;
          --dim: #787d86;
          --dot: rgba(236, 238, 241, 0.1);
          --surface: #16181c;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: clamp(1.5rem, 3vw, 3rem);
        padding-top: max(clamp(1.5rem, 3vw, 3rem), env(safe-area-inset-top));
        padding-right: max(clamp(1.5rem, 3vw, 3rem), env(safe-area-inset-right));
        padding-bottom: max(clamp(1.5rem, 3vw, 3rem), env(safe-area-inset-bottom));
        padding-left: max(clamp(1.5rem, 3vw, 3rem), env(safe-area-inset-left));
        background: var(--bg);
        color: var(--ink);
        transition:
          background-color 0.45s ease,
          color 0.45s ease;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 1440px;
        display: grid;
        grid-template-columns: 1fr;
        gap: clamp(1.75rem, 4vw, 3.5rem);
      }
      @media (min-width: 900px) {
        main {
          grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
          align-items: center;
        }
      }
      .stage {
        position: relative;
        width: min(100%, 70dvh);
        margin-inline: auto;
        aspect-ratio: 1;
      }
      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.1px);
        background-size: 1.125rem 1.125rem;
        background-position: center;
        -webkit-mask-image: radial-gradient(circle at center, #000 22%, transparent 70%);
        mask-image: radial-gradient(circle at center, #000 22%, transparent 70%);
        transition: opacity 0.5s ease;
      }
      .stage.has::before {
        opacity: 0;
      }
      .stage-title {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 0 2rem;
        text-align: center;
        font-size: clamp(1.5rem, 3vw, 2.5rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        color: var(--dim);
        pointer-events: none;
        transition:
          opacity 0.4s ease,
          color 0.45s ease;
      }
      .stage.has .stage-title {
        opacity: 0;
      }
      .stage.error .stage-title {
        color: var(--ink);
      }
      .qr {
        position: absolute;
        inset: 6%;
        opacity: 0;
        transform: scale(0.96);
        transition:
          opacity 0.5s ease,
          transform 0.7s var(--ease);
      }
      .stage.has .qr {
        opacity: 1;
        transform: scale(1);
      }
      .qr svg {
        display: block;
        width: 100%;
        height: 100%;
        color: var(--ink);
        transition: color 0.45s ease;
      }
      .panel {
        display: grid;
        gap: 1.5rem;
        width: 100%;
        max-width: 34rem;
        margin-inline: auto;
      }
      @media (min-width: 900px) {
        .panel {
          max-width: none;
          margin: 0;
          gap: 2rem;
        }
      }
      .field {
        padding: clamp(1rem, 2vw, 1.5rem) clamp(1.25rem, 2.5vw, 1.75rem);
        border-radius: 1rem;
        background: var(--surface);
        transition:
          background-color 0.45s ease,
          box-shadow 0.3s ease;
      }
      .field:focus-within {
        box-shadow: 0 0 0 1.5px var(--ink);
      }
      .field textarea {
        display: block;
        width: 100%;
        min-height: 3.1em;
        max-height: 12em;
        margin: 0;
        padding: 0;
        border: 0;
        outline: none;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 1rem;
        line-height: 1.55;
        letter-spacing: 0.01em;
        resize: none;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--dim) transparent;
      }
      @media (min-width: 900px) {
        .field textarea {
          min-height: 5em;
        }
      }
      .field textarea::placeholder {
        color: var(--dim);
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }
      .label {
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        color: var(--dim);
        transition: color 0.45s ease;
      }
      .levels {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 2.5rem;
      }
      .levels button {
        position: relative;
        height: 2.5rem;
        padding: 0;
        border: 0;
        border-radius: 0.5rem;
        background: none;
        color: var(--dim);
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: color 0.25s ease;
      }
      .levels button::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0.4rem;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0;
        transform: translateX(-50%) scale(0.3);
        transition:
          opacity 0.3s ease,
          transform 0.4s var(--ease);
      }
      .levels button[aria-checked="true"] {
        color: var(--ink);
      }
      .levels button[aria-checked="true"]::after {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
      .levels button:focus-visible {
        outline: 1.5px solid var(--ink);
        outline-offset: -2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stage" id="stage">
        <h1 class="stage-title" id="stageTitle">二维码生成器</h1>
        <div class="qr" id="qr" aria-hidden="true"></div>
      </div>
      <div class="panel">
        <div class="field">
          <textarea id="input" rows="2" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="请输入文本" aria-label="二维码内容"></textarea>
        </div>
        <div class="controls">
          <span class="label" id="levelLabel">纠错等级</span>
          <div class="levels" id="levels" role="radiogroup" aria-labelledby="levelLabel">
            <button type="button" role="radio" aria-checked="false" tabindex="-1" data-level="L">L</button>
            <button type="button" role="radio" aria-checked="true" tabindex="0" data-level="M">M</button>
            <button type="button" role="radio" aria-checked="false" tabindex="-1" data-level="Q">Q</button>
            <button type="button" role="radio" aria-checked="false" tabindex="-1" data-level="H">H</button>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script>
      (function () {
        "use strict";
        var LEVELS = ["L", "M", "Q", "H"];
        var DEBOUNCE = 160;
        var HINT_OVERFLOW = "内容过长，无法生成";
        var TITLE = "二维码生成器";
        var input = document.getElementById("input");
        var stage = document.getElementById("stage");
        var stageTitle = document.getElementById("stageTitle");
        var qrEl = document.getElementById("qr");
        var levelsEl = document.getElementById("levels");
        var buttons = Array.prototype.slice.call(levelsEl.querySelectorAll("button"));
        var level = "M";
        var timer = 0;
        var token = 0;
        function toSvg(qr) {
          var size = qr.modules.size;
          var data = qr.modules.data;
          var d = "";
          for (var y = 0; y < size; y++) {
            var x = 0;
            var row = y * size;
            while (x < size) {
              if (!data[row + x]) {
                x++;
                continue;
              }
              var start = x;
              while (x < size && data[row + x]) x++;
              var run = x - start;
              d += "M" + start + " " + y + "h" + run + "v1h-" + run + "z";
            }
          }
          return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + " " + size + '" shape-rendering="crispEdges"><path fill="currentColor" d="' + d + '"/></svg>';
        }
        function setStage(mode, message) {
          if (mode === "has") {
            stage.classList.add("has");
            stage.classList.remove("error");
            stageTitle.textContent = "";
          } else if (mode === "error") {
            stage.classList.remove("has");
            stage.classList.add("error");
            stageTitle.textContent = message || HINT_OVERFLOW;
          } else {
            stage.classList.remove("has", "error");
            stageTitle.textContent = TITLE;
          }
        }
        function blank() {
          token++;
          qrEl.innerHTML = "";
          setStage("empty");
        }
        function draw(text) {
          var id = ++token;
          var svg;
          try {
            svg = toSvg(QRCode.create(text, { errorCorrectionLevel: level }));
          } catch (error) {
            setStage("error", HINT_OVERFLOW);
            qrEl.innerHTML = "";
            return;
          }
          if (id !== token) return;
          var fresh = !stage.classList.contains("has");
          qrEl.innerHTML = svg;
          setStage("has");
          if (fresh) void qrEl.offsetWidth;
        }
        function render(text) {
          if (text.trim() === "") {
            blank();
          } else {
            draw(text);
          }
        }
        function grow() {
          input.style.height = "auto";
          input.style.height = input.scrollHeight + "px";
        }
        function setLevel(next) {
          if (next === level) return;
          level = next;
          buttons.forEach(function (button) {
            var on = button.dataset.level === level;
            button.setAttribute("aria-checked", String(on));
            button.tabIndex = on ? 0 : -1;
          });
          if (input.value.trim() !== "") draw(input.value);
        }
        input.addEventListener("input", function () {
          grow();
          clearTimeout(timer);
          var text = input.value;
          if (text.trim() === "") {
            render(text);
            return;
          }
          timer = setTimeout(function () {
            render(text);
          }, DEBOUNCE);
        });
        levelsEl.addEventListener("click", function (event) {
          var button = event.target.closest("button");
          if (button) setLevel(button.dataset.level);
        });
        levelsEl.addEventListener("keydown", function (event) {
          var step = event.key === "ArrowRight" || event.key === "ArrowDown" ? 1 : event.key === "ArrowLeft" || event.key === "ArrowUp" ? -1 : 0;
          if (!step) return;
          event.preventDefault();
          var next = LEVELS[(LEVELS.indexOf(level) + step + LEVELS.length) % LEVELS.length];
          setLevel(next);
          var target = levelsEl.querySelector('[data-level="' + next + '"]');
          if (target) target.focus();
        });
      })();
    </script>
  </body>
</html>
