<!doctype html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>数字华容道</title>
    <style>
      :root {
        --bg: #f5f0e9;
        --surface: #e8e0d5;
        --tile-bg: #faf7f2;
        --tile-text: #4a3728;
        --tile-shadow: 0 2px 8px rgba(74, 55, 40, 0.12);
        --tile-hover: #f0e8d8;
        --text: #4a3728;
        --text-secondary: #8b7b6b;
        --primary: #8b7355;
        --accent: #5b8c6f;
        --accent-hover: #4a7360;
        --btn-bg: #e0d5c5;
        --btn-text: #4a3728;
        --btn-active-bg: #8b7355;
        --btn-active-text: #faf7f2;
        --message-success: #5b8c6f;
        --shadow-lg: 0 8px 32px rgba(74, 55, 40, 0.12);
        --shadow-sm: 0 2px 6px rgba(74, 55, 40, 0.08);
        --radius-sm: 10px;
        --transition-theme: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1d23;
          --surface: #242730;
          --tile-bg: #2d3039;
          --tile-text: #e4ddd2;
          --tile-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
          --tile-hover: #363a44;
          --text: #e4ddd2;
          --text-secondary: #9a948a;
          --primary: #6b9b8a;
          --accent: #7eb8a0;
          --accent-hover: #6ba890;
          --btn-bg: #2d3039;
          --btn-text: #e4ddd2;
          --btn-active-bg: #6b9b8a;
          --btn-active-text: #1a1d23;
          --message-success: #7eb8a0;
          --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.35);
          --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.25);
          color-scheme: dark;
        }
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        transition: var(--transition-theme);
      }
      .app {
        width: 100%;
        max-width: 640px;
        height: 100%;
        min-height: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: clamp(8px, 1.6vh, 14px);
        padding: clamp(10px, 2.4vw, 20px);
        padding-top: max(clamp(10px, 2.4vw, 20px), env(safe-area-inset-top));
        padding-bottom: max(clamp(10px, 2.4vw, 20px), env(safe-area-inset-bottom));
        padding-left: max(clamp(10px, 2.4vw, 20px), env(safe-area-inset-left));
        padding-right: max(clamp(10px, 2.4vw, 20px), env(safe-area-inset-right));
      }
      .levels {
        display: flex;
        gap: clamp(5px, 1.2vw, 10px);
        justify-content: center;
        flex-wrap: wrap;
      }
      .level-btn {
        padding: clamp(6px, 1.3vw, 10px) clamp(14px, 2.6vw, 24px);
        font-size: clamp(12px, 1.4vw + 6px, 16px);
        font-weight: 600;
        border: 2px solid transparent;
        border-radius: var(--radius-sm);
        background: var(--btn-bg);
        color: var(--btn-text);
        cursor: pointer;
        transition:
          var(--transition-theme),
          transform 0.2s ease,
          border-color 0.2s ease;
        box-shadow: var(--shadow-sm);
        white-space: nowrap;
        letter-spacing: 0.02em;
        font-family: inherit;
      }
      .level-btn:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
        border-color: var(--primary);
      }
      .level-btn:active {
        transform: translateY(0);
      }
      .level-btn.active {
        background: var(--btn-active-bg);
        color: var(--btn-active-text);
        border-color: transparent;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      }
      .board-area {
        min-height: 0;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .board-wrapper {
        position: relative;
        background: var(--surface);
        border-radius: clamp(12px, 2.5vw, 20px);
        box-shadow: var(--shadow-lg);
        transition:
          var(--transition-theme),
          box-shadow 0.4s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .board-wrapper.victory {
        box-shadow:
          0 0 0 4px var(--message-success),
          0 12px 40px rgba(0, 0, 0, 0.2);
      }
      #board {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
      }
      .tile {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--tile-bg);
        color: var(--tile-text);
        font-weight: 700;
        border-radius: clamp(6px, 1.2vw, 12px);
        cursor: default;
        transition:
          transform 0.16s cubic-bezier(0.4, 0, 0.2, 1),
          background-color 0.35s ease,
          color 0.35s ease,
          box-shadow 0.35s ease;
        box-shadow: var(--tile-shadow);
        will-change: transform;
        letter-spacing: 0.01em;
        font-family: inherit;
      }
      .tile.movable {
        cursor: pointer;
      }
      .tile.movable:hover {
        background: var(--tile-hover);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      }
      .tile.movable:active {
        transform: scale(0.93);
        transition: transform 0.08s ease;
      }
      .tile.no-transition,
      .empty-indicator.no-transition {
        transition: none;
      }
      .empty-indicator {
        position: absolute;
        top: 0;
        left: 0;
        border-radius: clamp(6px, 1.2vw, 12px);
        background: transparent;
        transition: transform 0.16s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
        pointer-events: none;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(12px, 3vw, 28px);
        flex-wrap: wrap;
      }
      .stat {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: clamp(12px, 1vw + 7px, 15px);
        color: var(--text-secondary);
        font-weight: 500;
        transition: var(--transition-theme);
      }
      .stat-value {
        color: var(--text);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        transition: var(--transition-theme);
      }
      #startBtn {
        padding: clamp(8px, 1.5vw, 12px) clamp(20px, 4vw, 34px);
        font-size: clamp(13px, 1.2vw + 7px, 16px);
        font-weight: 600;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        transition:
          var(--transition-theme),
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        letter-spacing: 0.03em;
        font-family: inherit;
      }
      #startBtn:hover {
        background: var(--accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      }
      #startBtn:active {
        transform: translateY(0);
      }
      .toast {
        position: fixed;
        left: 50%;
        top: 15%;
        transform: translate(-50%, -12px);
        padding: 10px 20px;
        border-radius: 999px;
        background: var(--tile-bg);
        color: var(--message-success);
        font-size: clamp(14px, 1.4vw + 8px, 18px);
        font-weight: 700;
        letter-spacing: 0.04em;
        box-shadow: var(--shadow-lg);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
        z-index: 100;
        white-space: nowrap;
        font-family: inherit;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 400px) {
        .level-btn {
          padding: 6px 12px;
          font-size: 12px;
        }
        .stat {
          font-size: 12px;
        }
        #startBtn {
          padding: 8px 18px;
          font-size: 13px;
        }
      }
      @media (orientation: landscape) and (max-height: 500px) {
        .app {
          gap: 6px;
        }
        .level-btn {
          padding: 5px 10px;
          font-size: 11px;
        }
        .stat {
          font-size: 11px;
        }
        #startBtn {
          padding: 6px 14px;
          font-size: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="levels" id="levelContainer">
        <button class="level-btn active" data-level="2">2 阶</button>
        <button class="level-btn" data-level="3">3 阶</button>
        <button class="level-btn" data-level="4">4 阶</button>
        <button class="level-btn" data-level="5">5 阶</button>
      </div>
      <div class="board-area" id="boardArea">
        <div class="board-wrapper" id="boardWrapper">
          <div id="board"></div>
        </div>
      </div>
      <div class="controls">
        <div class="stat">
          <span>步数</span>
          <span class="stat-value" id="stepCount">0</span>
        </div>
        <button id="startBtn">开始游戏</button>
        <div class="stat">
          <span>用时</span>
          <span class="stat-value" id="timerDisplay">0.0s</span>
        </div>
      </div>
    </div>
    <div class="toast" id="message" aria-live="polite"></div>
    <script>
      (function () {
        var DOM = {
          levelContainer: document.getElementById("levelContainer"),
          boardArea: document.getElementById("boardArea"),
          boardWrapper: document.getElementById("boardWrapper"),
          board: document.getElementById("board"),
          startBtn: document.getElementById("startBtn"),
          stepCount: document.getElementById("stepCount"),
          timerDisplay: document.getElementById("timerDisplay"),
          message: document.getElementById("message"),
        };
        var MAX_BOARD_PX = 600;
        var GAP_TILE_RATIO = 0.07;
        var PAD_TILE_RATIO = 0.12;
        var state = {
          size: 2,
          board: [],
          target: [],
          emptyPos: { row: 0, col: 0 },
          isPlaying: false,
          isFinished: false,
          startTime: null,
          steps: 0,
          timerInterval: null,
        };
        var tileElements = new Map();
        var emptyIndicatorEl = null;
        var boardPixelSize = 0;
        var tilePixelSize = 0;
        var gapPx = 0;
        var paddingPx = 0;
        var resizeRaf = 0;
        var toastTimer = null;
        function updateEmptyPos() {
          var flat = state.board.flat();
          var idx = flat.indexOf(0);
          state.emptyPos = {
            row: Math.floor(idx / state.size),
            col: idx % state.size,
          };
        }
        function boardsEqual(a, b) {
          return a.every(function (row, i) {
            return row.every(function (val, j) {
              return val === b[i][j];
            });
          });
        }
        function isSolvable(puzzle) {
          var flat = puzzle.flat();
          var emptyIdx = flat.indexOf(0);
          var emptyRow = Math.floor(emptyIdx / state.size);
          var nums = flat.filter(function (v) {
            return v !== 0;
          });
          var inversions = 0;
          for (var i = 0; i < nums.length; i++) {
            for (var j = i + 1; j < nums.length; j++) {
              if (nums[i] > nums[j]) inversions++;
            }
          }
          var emptyDist = state.size - emptyRow;
          return state.size % 2 === 1 ? inversions % 2 === 0 : (inversions + emptyDist) % 2 === 1;
        }
        function buildOrderedBoard() {
          var s = state.size;
          var board = [];
          var target = [];
          var num = 1;
          for (var i = 0; i < s; i++) {
            var row = [];
            var tRow = [];
            for (var j = 0; j < s; j++) {
              var val = i === s - 1 && j === s - 1 ? 0 : num++;
              row.push(val);
              tRow.push(val);
            }
            board.push(row);
            target.push(tRow);
          }
          return { board: board, target: target };
        }
        function shuffleBoard() {
          var s = state.size;
          var total = s * s;
          var shuffled;
          do {
            var arr = [];
            for (var i = 1; i < total; i++) arr.push(i);
            arr.push(0);
            for (var k = arr.length - 1; k > 0; k--) {
              var j = Math.floor(Math.random() * (k + 1));
              var tmp = arr[k];
              arr[k] = arr[j];
              arr[j] = tmp;
            }
            shuffled = [];
            for (var r = 0; r < s; r++) {
              shuffled.push(arr.slice(r * s, (r + 1) * s));
            }
          } while (!isSolvable(shuffled) || boardsEqual(shuffled, state.target));
          return shuffled;
        }
        function calcSizes() {
          var area = DOM.boardArea;
          var availW = area.clientWidth;
          var availH = area.clientHeight;
          if (availW < 40 || availH < 40) return false;
          var s = state.size;
          var desired = Math.floor(Math.min(availW, availH, MAX_BOARD_PX));
          var idealTile = desired / s;
          gapPx = Math.max(2, Math.round(idealTile * GAP_TILE_RATIO));
          paddingPx = Math.max(3, Math.round(idealTile * PAD_TILE_RATIO));
          var inner = desired - paddingPx * 2;
          tilePixelSize = Math.max(8, Math.floor((inner - (s - 1) * gapPx) / s));
          boardPixelSize = paddingPx * 2 + tilePixelSize * s + gapPx * (s - 1);
          return true;
        }
        function tileTransform(row, col) {
          return {
            left: paddingPx + col * (tilePixelSize + gapPx),
            top: paddingPx + row * (tilePixelSize + gapPx),
          };
        }
        function createTileElement(value) {
          var el = document.createElement("div");
          el.className = "tile";
          el.textContent = value;
          el.style.width = tilePixelSize + "px";
          el.style.height = tilePixelSize + "px";
          el.style.fontSize = Math.round(tilePixelSize * 0.42) + "px";
          el.style.lineHeight = tilePixelSize + "px";
          el.addEventListener("click", function () {
            handleTileClick(value);
          });
          return el;
        }
        function createEmptyIndicator() {
          var el = document.createElement("div");
          el.className = "empty-indicator";
          el.style.width = tilePixelSize + "px";
          el.style.height = tilePixelSize + "px";
          return el;
        }
        function findTilePosition(value) {
          var s = state.size;
          for (var r = 0; r < s; r++) {
            for (var c = 0; c < s; c++) {
              if (state.board[r][c] === value) return { row: r, col: c };
            }
          }
          return null;
        }
        function isAdjacentToEmpty(row, col) {
          var dr = Math.abs(row - state.emptyPos.row);
          var dc = Math.abs(col - state.emptyPos.col);
          return dr + dc === 1;
        }
        function renderBoard(fullRebuild) {
          if (!calcSizes()) return;
          var sizeStr = boardPixelSize + "px";
          DOM.board.style.width = sizeStr;
          DOM.board.style.height = sizeStr;
          DOM.boardWrapper.style.width = sizeStr;
          DOM.boardWrapper.style.height = sizeStr;
          var totalTiles = state.size * state.size - 1;
          if (fullRebuild || tileElements.size !== totalTiles) {
            DOM.board.innerHTML = "";
            tileElements.clear();
            emptyIndicatorEl = null;
            for (var v = 1; v <= totalTiles; v++) {
              var el = createTileElement(v);
              tileElements.set(v, el);
              DOM.board.appendChild(el);
            }
            emptyIndicatorEl = createEmptyIndicator();
            DOM.board.appendChild(emptyIndicatorEl);
          }
          var allTiles = DOM.board.querySelectorAll(".tile");
          allTiles.forEach(function (t) {
            t.style.width = tilePixelSize + "px";
            t.style.height = tilePixelSize + "px";
            t.style.fontSize = Math.round(tilePixelSize * 0.42) + "px";
            t.style.lineHeight = tilePixelSize + "px";
          });
          for (var v = 1; v <= totalTiles; v++) {
            var pos = findTilePosition(v);
            var tileEl = tileElements.get(v);
            if (!pos || !tileEl) continue;
            var tr = tileTransform(pos.row, pos.col);
            tileEl.style.transform = "translate(" + tr.left + "px, " + tr.top + "px)";
            if (state.isPlaying && !state.isFinished && isAdjacentToEmpty(pos.row, pos.col)) {
              tileEl.classList.add("movable");
            } else {
              tileEl.classList.remove("movable");
            }
          }
          if (emptyIndicatorEl) {
            emptyIndicatorEl.style.width = tilePixelSize + "px";
            emptyIndicatorEl.style.height = tilePixelSize + "px";
            var et = tileTransform(state.emptyPos.row, state.emptyPos.col);
            emptyIndicatorEl.style.transform = "translate(" + et.left + "px, " + et.top + "px)";
          }
        }
        function setTileTransitions(enabled) {
          var tiles = DOM.board.querySelectorAll(".tile");
          tiles.forEach(function (t) {
            if (enabled) t.classList.remove("no-transition");
            else t.classList.add("no-transition");
          });
          if (emptyIndicatorEl) {
            if (enabled) emptyIndicatorEl.classList.remove("no-transition");
            else emptyIndicatorEl.classList.add("no-transition");
          }
        }
        function handleTileClick(value) {
          if (!state.isPlaying || state.isFinished) return;
          var pos = findTilePosition(value);
          if (!pos) return;
          if (!isAdjacentToEmpty(pos.row, pos.col)) return;
          var er = state.emptyPos.row;
          var ec = state.emptyPos.col;
          state.board[er][ec] = value;
          state.board[pos.row][pos.col] = 0;
          state.emptyPos = { row: pos.row, col: pos.col };
          state.steps++;
          DOM.stepCount.textContent = state.steps;
          renderBoard();
          checkWin();
        }
        function checkWin() {
          if (!boardsEqual(state.board, state.target)) return;
          finishGame(true);
        }
        function finishGame(won) {
          state.isPlaying = false;
          state.isFinished = true;
          if (state.timerInterval) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
          }
          var elapsed = state.startTime ? ((Date.now() - state.startTime) / 1000).toFixed(1) : "0.0";
          DOM.timerDisplay.textContent = elapsed + "s";
          if (won) {
            showMessage("🎉 挑战成功！用时 " + elapsed + "s");
            DOM.boardWrapper.classList.add("victory");
          }
          updateMovableClasses();
        }
        function updateMovableClasses() {
          var tiles = DOM.board.querySelectorAll(".tile");
          tiles.forEach(function (t) {
            t.classList.remove("movable");
          });
        }
        function showMessage(text) {
          DOM.message.textContent = text;
          DOM.message.classList.add("show");
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            DOM.message.classList.remove("show");
          }, 2200);
        }
        function resetGameState() {
          if (state.timerInterval) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
          }
          state.isPlaying = false;
          state.isFinished = false;
          state.startTime = null;
          state.steps = 0;
          DOM.stepCount.textContent = "0";
          DOM.timerDisplay.textContent = "0.0s";
          DOM.message.classList.remove("show");
          DOM.boardWrapper.classList.remove("victory");
        }
        function startGame() {
          resetGameState();
          state.board = shuffleBoard();
          updateEmptyPos();
          state.isPlaying = true;
          state.startTime = Date.now();
          state.timerInterval = setInterval(updateTimer, 120);
          setTileTransitions(false);
          renderBoard(true);
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              setTileTransitions(true);
            });
          });
        }
        function updateTimer() {
          if (!state.isPlaying || !state.startTime) return;
          var elapsed = ((Date.now() - state.startTime) / 1000).toFixed(1);
          DOM.timerDisplay.textContent = elapsed + "s";
        }
        function switchLevel(level) {
          var newSize = Number(level);
          if (state.size === newSize && tileElements.size > 0) return;
          state.size = newSize;
          resetGameState();
          var ordered = buildOrderedBoard();
          state.board = ordered.board;
          state.target = ordered.target;
          updateEmptyPos();
          tileElements.clear();
          emptyIndicatorEl = null;
          DOM.board.innerHTML = "";
          DOM.boardWrapper.classList.remove("victory");
          renderBoard(true);
          updateLevelButtons();
        }
        function updateLevelButtons() {
          var buttons = DOM.levelContainer.querySelectorAll(".level-btn");
          buttons.forEach(function (btn) {
            btn.classList.toggle("active", Number(btn.dataset.level) === state.size);
          });
        }
        function handleKeyDown(e) {
          if (!state.isPlaying || state.isFinished) return;
          var row = state.emptyPos.row;
          var col = state.emptyPos.col;
          var targetRow = row;
          var targetCol = col;
          switch (e.key) {
            case "ArrowUp":
              targetRow = row + 1;
              break;
            case "ArrowDown":
              targetRow = row - 1;
              break;
            case "ArrowLeft":
              targetCol = col + 1;
              break;
            case "ArrowRight":
              targetCol = col - 1;
              break;
            default:
              return;
          }
          if (targetRow < 0 || targetRow >= state.size || targetCol < 0 || targetCol >= state.size) return;
          var value = state.board[targetRow][targetCol];
          if (value === 0) return;
          e.preventDefault();
          state.board[row][col] = value;
          state.board[targetRow][targetCol] = 0;
          state.emptyPos = { row: targetRow, col: targetCol };
          state.steps++;
          DOM.stepCount.textContent = state.steps;
          renderBoard();
          checkWin();
        }
        function scheduleRender() {
          if (resizeRaf) return;
          resizeRaf = requestAnimationFrame(function () {
            resizeRaf = 0;
            renderBoard();
          });
        }
        DOM.startBtn.addEventListener("click", startGame);
        DOM.levelContainer.addEventListener("click", function (e) {
          var btn = e.target.closest(".level-btn");
          if (!btn) return;
          switchLevel(btn.dataset.level);
        });
        window.addEventListener("keydown", handleKeyDown);
        window.addEventListener("resize", scheduleRender);
        window.addEventListener("orientationchange", function () {
          setTimeout(scheduleRender, 150);
        });
        if (typeof ResizeObserver === "function") {
          var ro = new ResizeObserver(scheduleRender);
          ro.observe(DOM.boardArea);
        }
        switchLevel(2);
        requestAnimationFrame(function () {
          renderBoard(true);
        });
      })();
    </script>
  </body>
</html>
