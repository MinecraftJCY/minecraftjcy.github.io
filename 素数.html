<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>素数与因数</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light dark;
        --bg: #e0e5ec;
        --shadow-dark: #a3b1c6;
        --shadow-light: #ffffff;
        --text: #3f4a5a;
        --text-soft: #7b8598;
        --accent: #5f6d84;
        --success: #4a9070;
        --error: #c05a5a;
        --radius-lg: 28px;
        --radius-md: 18px;
        --radius-sm: 12px;
        --out-lg: 12px 12px 26px var(--shadow-dark), -12px -12px 26px var(--shadow-light);
        --out-md: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
        --out-xs: 3px 3px 7px var(--shadow-dark), -3px -3px 7px var(--shadow-light);
        --in-md: inset 6px 6px 13px var(--shadow-dark), inset -6px -6px 13px var(--shadow-light);
        --in-sm: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light);
        --t: 0.22s;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2c3038;
          --shadow-dark: #20232a;
          --shadow-light: #383e48;
          --text: #c9cfdb;
          --text-soft: #868e9e;
          --accent: #8fa3c4;
          --success: #5fc094;
          --error: #d98a8a;
        }
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        padding: clamp(20px, 5vw, 56px) clamp(16px, 5vw, 48px);
        padding-bottom: calc(clamp(20px, 5vw, 56px) + env(safe-area-inset-bottom));
        background-color: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        transition:
          background-color var(--t) ease,
          color var(--t) ease;
      }
      .app {
        width: 100%;
        max-width: 680px;
        margin: auto;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
        gap: clamp(24px, 5vw, 40px);
      }
      .title {
        margin: 0;
        font-size: clamp(24px, 6vw, 40px);
        font-weight: 600;
        letter-spacing: 0.02em;
        text-align: center;
        color: var(--text);
        transition: color var(--t) ease;
      }
      .panel {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
        padding: clamp(22px, 6vw, 46px);
        border-radius: var(--radius-lg);
        background-color: var(--bg);
        box-shadow: var(--out-lg);
        transition:
          box-shadow var(--t) ease,
          background-color var(--t) ease;
      }
      .input-group {
        display: flex;
        gap: clamp(12px, 1.4vw, 16px);
      }
      .input-field {
        flex: 1;
        min-width: 0;
        padding: clamp(16px, 1.6vw, 20px) clamp(18px, 1.8vw, 24px);
        border: 0;
        border-radius: var(--radius-md);
        background-color: var(--bg);
        color: var(--text);
        font-size: clamp(16px, 1.3vw + 5px, 20px);
        outline: none;
        box-shadow: var(--in-sm);
        transition:
          box-shadow var(--t) ease,
          color var(--t) ease,
          background-color var(--t) ease;
      }
      .input-field::placeholder {
        color: var(--text-soft);
      }
      .btn {
        padding: clamp(16px, 1.6vw, 20px) clamp(26px, 2.6vw, 38px);
        border: 0;
        border-radius: var(--radius-md);
        background-color: var(--bg);
        color: var(--accent);
        font-size: clamp(16px, 1.3vw + 5px, 20px);
        font-weight: 600;
        letter-spacing: 0.03em;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        box-shadow: var(--out-md);
        transition:
          box-shadow var(--t) var(--ease),
          color var(--t) ease,
          background-color var(--t) ease;
      }
      .btn:active {
        box-shadow: var(--in-md);
      }
      .result-container {
        flex: 1;
        min-height: 0;
        margin-top: clamp(20px, 5vw, 32px);
        padding: clamp(20px, 2vw, 28px);
        border-radius: var(--radius-md);
        background-color: var(--bg);
        box-shadow: var(--in-sm);
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--shadow-dark) transparent;
        transition:
          box-shadow var(--t) ease,
          background-color var(--t) ease;
      }
      .result-container:empty {
        display: none;
      }
      .result-container::-webkit-scrollbar {
        width: 6px;
      }
      .result-container::-webkit-scrollbar-track {
        background: transparent;
      }
      .result-container::-webkit-scrollbar-thumb {
        background-color: var(--shadow-dark);
        border-radius: 3px;
      }
      .result {
        animation: soft-in 0.4s var(--ease) both;
      }
      @keyframes soft-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .status {
        margin: 0 0 clamp(18px, 1.8vw, 24px);
        font-size: clamp(20px, 5vw, 28px);
        font-weight: 600;
        letter-spacing: 0.02em;
        transition: color var(--t) ease;
      }
      .status:last-child {
        margin-bottom: 0;
      }
      .status.prime {
        color: var(--success);
      }
      .status.error {
        color: var(--error);
      }
      .factors-label {
        margin: 0 0 clamp(12px, 1.2vw, 16px);
        font-size: clamp(13px, 0.9vw + 5px, 16px);
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--text-soft);
        transition: color var(--t) ease;
      }
      .factors-list {
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 1.2vw, 14px);
      }
      .factor-row {
        display: flex;
        gap: clamp(10px, 1.2vw, 14px);
      }
      .factor-item {
        flex: 1;
        padding: clamp(12px, 1.2vw, 16px) clamp(8px, 1vw, 12px);
        border-radius: var(--radius-sm);
        background-color: var(--bg);
        color: var(--text);
        font-size: clamp(15px, 1vw + 5px, 19px);
        font-weight: 500;
        letter-spacing: 0.02em;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: all;
        -webkit-user-select: all;
        box-shadow: var(--out-xs);
        transition:
          box-shadow var(--t) ease,
          color var(--t) ease,
          background-color var(--t) ease;
      }
      .factor-item.single {
        flex: 0 0 auto;
        width: calc(50% - 5px);
        margin: 0 auto;
      }
      :focus-visible:not(.input-field) {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 6px;
      }
      @media (hover: hover) {
        .btn:hover:not(:active) {
          box-shadow: var(--out-lg);
        }
      }
      @media (max-width: 480px) {
        .panel {
          border-radius: 24px;
        }
        .input-group {
          flex-direction: column;
        }
        .btn {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1 class="title">素数与因数</h1>
      <section class="panel">
        <div class="input-group">
          <input type="text" class="input-field" id="numberInput" placeholder="请输入数字" inputmode="numeric" autocomplete="off" spellcheck="false" />
          <button class="btn" id="calcBtn" type="button">验证</button>
        </div>
        <div class="result-container" id="resultContainer"></div>
      </section>
    </main>
    <script>
      const input = document.getElementById("numberInput");
      const calc = document.getElementById("calcBtn");
      const container = document.getElementById("resultContainer");
      const factorPairs = (n) => {
        const pairs = [];
        const limit = Math.floor(Math.sqrt(n));
        for (let i = 1; i <= limit; i += 1) {
          if (n % i === 0) pairs.push([i, n / i]);
        }
        return pairs;
      };
      const render = (html) => {
        container.innerHTML = `<div class="result">${html}</div>`;
      };
      const showError = (message) => {
        render(`<p class="status error">${message}</p>`);
      };
      const showResult = (isPrime, pairs) => {
        const statusClass = isPrime ? "prime" : "composite";
        const statusText = isPrime ? "是素数" : "不是素数";
        let factorsHtml = "";
        if (!isPrime) {
          const rows = pairs.map(([a, b]) => (a === b ? `<div class="factor-row"><span class="factor-item single">${a}</span></div>` : `<div class="factor-row"><span class="factor-item">${a}</span><span class="factor-item">${b}</span></div>`)).join("");
          factorsHtml = `<p class="factors-label">因数对</p><div class="factors-list">${rows}</div>`;
        }
        render(`<p class="status ${statusClass}">${statusText}</p>${factorsHtml}`);
      };
      const calculate = () => {
        const raw = input.value.trim();
        if (!/^\d+$/.test(raw)) {
          showError("请输入有效的正整数");
          return;
        }
        const number = Number(raw);
        if (number <= 1) {
          showError("请输入大于 1 的自然数");
          return;
        }
        if (number > Number.MAX_SAFE_INTEGER) {
          showError("数值过大，请减小后重试");
          return;
        }
        const pairs = factorPairs(number);
        showResult(pairs.length === 1, pairs);
      };
      calc.addEventListener("click", calculate);
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "");
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") calculate();
      });
    </script>
  </body>
</html>
