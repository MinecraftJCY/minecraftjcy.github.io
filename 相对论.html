<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>相对论效应</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        color-scheme: light;
        --bg: #e0e5ec;
        --shadow-dark: #a3b1c6;
        --shadow-light: #ffffff;
        --text: #3f4a5a;
        --text-soft: #7b8598;
        --danger: #c05a5a;
        --raise-lg: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
        --raise-md: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
        --raise-sm: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
        --sink-sm: inset 4px 4px 9px var(--shadow-dark), inset -4px -4px 9px var(--shadow-light);
        --ease: cubic-bezier(0.25, 0.8, 0.25, 1);
        --gap: clamp(16px, 2vw, 22px);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #2c3038;
          --shadow-dark: #20232a;
          --shadow-light: #383e48;
          --text: #c9cfdb;
          --text-soft: #868e9e;
          --danger: #d98a8a;
        }
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: clamp(14px, 2vw, 22px) clamp(16px, 5vw, 40px);
        padding-bottom: calc(clamp(14px, 2vw, 22px) + env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition:
          background-color 0.45s ease,
          color 0.45s ease;
      }
      .app {
        margin: 0 auto;
        width: 100%;
        max-width: 1080px;
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }
      .title {
        margin: 0;
        text-align: center;
        font-size: clamp(22px, 4vw, 32px);
        font-weight: 600;
        letter-spacing: 0.02em;
        transition: color 0.45s ease;
      }
      .panel {
        padding: clamp(20px, 3vw, 28px);
        border-radius: 26px;
        background: var(--bg);
        box-shadow: var(--raise-lg);
        transition:
          box-shadow 0.28s ease,
          background-color 0.45s ease;
      }
      .label,
      .ratio,
      .card-head {
        display: flex;
        flex-wrap: nowrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      .label > *,
      .ratio > *,
      .card-head > * {
        white-space: nowrap;
      }
      .label,
      .ratio-label {
        font-size: 0.88rem;
        font-weight: 500;
        color: var(--text-soft);
        letter-spacing: 0.04em;
      }
      .label {
        margin-bottom: 10px;
      }
      .label .range {
        font-size: 0.76rem;
        opacity: 0.75;
      }
      .velocity-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 10px 20px;
        border-radius: 18px;
        background: var(--bg);
        box-shadow: var(--sink-sm);
        transition:
          box-shadow 0.28s ease,
          background-color 0.45s ease;
      }
      .velocity-row input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font-family: inherit;
        font-size: clamp(20px, 3vw, 28px);
        font-weight: 600;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        padding: 4px 0;
      }
      .velocity-row .unit {
        flex: none;
        font-size: 0.88rem;
        font-weight: 500;
        color: var(--text-soft);
        letter-spacing: 0.04em;
      }
      .slider {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        height: 28px;
        margin: 14px 0 0;
        background: transparent;
        cursor: pointer;
      }
      .slider::-webkit-slider-runnable-track {
        height: 10px;
        border-radius: 999px;
        background: var(--bg);
        box-shadow: var(--sink-sm);
      }
      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 22px;
        height: 22px;
        margin-top: -6px;
        border: none;
        border-radius: 50%;
        background: var(--bg);
        box-shadow: var(--raise-sm);
        transition: transform 0.18s var(--ease);
      }
      .slider:active::-webkit-slider-thumb {
        transform: scale(1.08);
      }
      .slider::-moz-range-track {
        height: 10px;
        border-radius: 999px;
        background: var(--bg);
        box-shadow: var(--sink-sm);
      }
      .slider::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border: none;
        border-radius: 50%;
        background: var(--bg);
        box-shadow: var(--raise-sm);
      }
      .hint {
        display: none;
        margin: 12px 0 0;
        font-size: 0.8rem;
        line-height: 1.5;
        color: var(--danger);
      }
      .hint.error {
        display: block;
      }
      .ratio {
        margin-top: 16px;
      }
      .ratio-value {
        font-size: clamp(15px, 1.2vw + 11px, 19px);
        font-weight: 600;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .chips button {
        font: inherit;
        font-size: 0.8rem;
        font-weight: 500;
        padding: 8px 16px;
        border: none;
        border-radius: 12px;
        background: var(--bg);
        color: var(--text-soft);
        letter-spacing: 0.02em;
        cursor: pointer;
        box-shadow: var(--raise-sm);
        transition:
          box-shadow 0.22s ease,
          color 0.22s ease,
          background-color 0.45s ease;
      }
      .chips button:active {
        box-shadow: var(--sink-sm);
        color: var(--text);
      }
      .results {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: clamp(18px, 2.4vw, 24px);
        border-radius: 22px;
        background: var(--bg);
        box-shadow: var(--raise-md);
        transition:
          box-shadow 0.28s ease,
          background-color 0.45s ease;
      }
      .card-label {
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.04em;
      }
      .card-formula {
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text-soft);
        letter-spacing: 0.02em;
      }
      .card-value {
        font-size: clamp(20px, 2vw + 10px, 26px);
        font-weight: 600;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
        white-space: nowrap;
      }
      .card-note {
        margin: 0;
        font-size: 0.8rem;
        line-height: 1.55;
        color: var(--text-soft);
        overflow-wrap: anywhere;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1 class="title">相对论效应</h1>
      <section class="panel">
        <div class="label">
          <span>物体速度 v</span>
          <span class="range">0 ≤ v &lt; c</span>
        </div>
        <div class="velocity-row">
          <input id="velocityInput" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="速度，单位米每秒" />
          <span class="unit">m/s</span>
        </div>
        <input id="speedSlider" class="slider" type="range" min="0" max="1000" step="0.1" value="0" aria-label="速度调节滑块" />
        <p class="hint" id="hint" role="alert"></p>
        <div class="ratio">
          <span class="ratio-label">速度比 β = v / c</span>
          <span class="ratio-value" id="betaValue">—</span>
        </div>
        <div class="chips" id="chips">
          <button type="button" data-beta="0.1">0.1c</button>
          <button type="button" data-beta="0.5">0.5c</button>
          <button type="button" data-beta="0.9">0.9c</button>
          <button type="button" data-beta="0.99">0.99c</button>
          <button type="button" data-beta="0.999">0.999c</button>
          <button type="button" data-beta="0.9999">0.9999c</button>
          <button type="button" data-beta="0.99999">0.99999c</button>
          <button type="button" data-beta="0.999999">0.999999c</button>
        </div>
      </section>
      <section class="results">
        <article class="card">
          <div class="card-head">
            <span class="card-label">洛伦兹因子 γ</span>
            <span class="card-formula">γ = 1 / √(1 − β²)</span>
          </div>
          <div class="card-value" id="gammaValue">—</div>
          <p class="card-note">时间膨胀 Δt = γ·Δτ 与质量增加 m = γ·m₀ 的共同倍数</p>
        </article>
        <article class="card">
          <div class="card-head">
            <span class="card-label">洛伦兹因子倒数 1/γ</span>
            <span class="card-formula">1/γ = √(1 − β²)</span>
          </div>
          <div class="card-value" id="invGammaValue">—</div>
          <p class="card-note">长度收缩 L = L₀ / γ 的比例</p>
        </article>
      </section>
    </main>
    <script>
      (function () {
        "use strict";
        const LIGHT_SPEED = 299792458;
        const SLIDER_MAX = 1000;
        const MIN_GAP = 1e-7;
        const INITIAL_VELOCITY = 149896229;
        const GAP_RATIO = MIN_GAP / LIGHT_SPEED;
        const LOG_GAP_RATIO = Math.log(GAP_RATIO);
        const $ = (id) => document.getElementById(id);
        const velocityInput = $("velocityInput");
        const slider = $("speedSlider");
        const hint = $("hint");
        const chips = $("chips");
        const outputs = {
          beta: $("betaValue"),
          gamma: $("gammaValue"),
          invGamma: $("invGammaValue"),
        };
        const sliderToGap = (value) => {
          const t = value / SLIDER_MAX;
          if (t <= 0) return LIGHT_SPEED;
          if (t >= 1) return MIN_GAP;
          return LIGHT_SPEED * Math.pow(GAP_RATIO, t);
        };
        const gapToSlider = (gap) => {
          if (gap >= LIGHT_SPEED) return 0;
          if (gap <= MIN_GAP) return SLIDER_MAX;
          return (Math.log(gap / LIGHT_SPEED) / LOG_GAP_RATIO) * SLIDER_MAX;
        };
        const setHint = (message) => {
          hint.textContent = message || "";
          hint.classList.toggle("error", Boolean(message));
        };
        const render = (gap) => {
          const ratio = gap / LIGHT_SPEED;
          const beta = 1 - ratio;
          const gamma = 1 / Math.sqrt(ratio * (2 - ratio));
          outputs.beta.textContent = beta;
          outputs.gamma.textContent = gamma;
          outputs.invGamma.textContent = 1 / gamma;
        };
        const applyVelocity = (velocity) => {
          const gap = Math.max(LIGHT_SPEED - velocity, MIN_GAP);
          slider.value = String(gapToSlider(gap));
          setHint("");
          render(gap);
        };
        const parseVelocity = (raw) => {
          const cleaned = raw.trim().replace(/[,\s]/g, "");
          if (!cleaned) return { error: "请输入一个速度值" };
          const value = Number(cleaned);
          if (!Number.isFinite(value)) return { error: "请输入有效的数字" };
          if (value < 0) return { error: "速度不能为负数" };
          if (value >= LIGHT_SPEED) return { error: "速度不能达到或超过光速" };
          return { value };
        };
        velocityInput.addEventListener("input", () => {
          const { value, error } = parseVelocity(velocityInput.value);
          if (error) {
            setHint(error);
            return;
          }
          applyVelocity(value);
        });
        velocityInput.addEventListener("blur", () => {
          const { value } = parseVelocity(velocityInput.value);
          if (value !== undefined) velocityInput.value = value;
        });
        slider.addEventListener("input", () => {
          const gap = sliderToGap(Number(slider.value));
          velocityInput.value = LIGHT_SPEED - gap;
          setHint("");
          render(gap);
        });
        chips.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-beta]");
          if (!button) return;
          const velocity = Number(button.dataset.beta) * LIGHT_SPEED;
          velocityInput.value = velocity;
          applyVelocity(velocity);
        });
        velocityInput.value = INITIAL_VELOCITY;
        applyVelocity(INITIAL_VELOCITY);
      })();
    </script>
  </body>
</html>
