<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>相对论效应</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        color-scheme: light;
        --bg: #f4f3f0;
        --ink: #141416;
        --muted: #83838b;
        --line: #e3e1dc;
        --accent: #2b47d6;
        --danger: #c0392b;
        --focus: rgba(43, 71, 214, 0.22);
        --ease: cubic-bezier(0.32, 0.72, 0, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0c0c0e;
          --ink: #f0efec;
          --muted: #84848d;
          --line: #242429;
          --accent: #8ea2ff;
          --danger: #ff8f82;
          --focus: rgba(142, 162, 255, 0.28);
        }
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: clamp(32px, 6vw, 72px) clamp(20px, 5vw, 40px) calc(clamp(32px, 6vw, 72px) + env(safe-area-inset-bottom));
        display: grid;
        justify-items: center;
        align-content: start;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition:
          background-color 0.4s ease,
          color 0.4s ease;
      }
      .app {
        width: 100%;
        max-width: 880px;
        display: flex;
        flex-direction: column;
        gap: clamp(40px, 7vw, 72px);
      }
      .masthead h1 {
        margin: 0;
        font-size: clamp(22px, 3.2vw, 30px);
        font-weight: 600;
        letter-spacing: 0.03em;
        transition: color 0.4s ease;
      }
      .masthead p {
        margin: 12px 0 0;
        font-size: 0.82rem;
        letter-spacing: 0.05em;
        color: var(--muted);
        transition: color 0.4s ease;
      }
      .control {
        display: flex;
        flex-direction: column;
      }
      .slider {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        height: 26px;
        margin: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
      }
      .slider::-webkit-slider-runnable-track {
        height: 2px;
        border-radius: 2px;
        background: var(--line);
        transition: background-color 0.4s ease;
      }
      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        margin-top: -8px;
        border: 0;
        border-radius: 50%;
        background: var(--ink);
        transition:
          transform 0.25s var(--ease),
          background-color 0.4s ease;
      }
      .slider::-moz-range-track {
        height: 2px;
        border-radius: 2px;
        background: var(--line);
        transition: background-color 0.4s ease;
      }
      .slider::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border: 0;
        border-radius: 50%;
        background: var(--ink);
        transition:
          transform 0.25s var(--ease),
          background-color 0.4s ease;
      }
      .slider:hover::-webkit-slider-thumb,
      .slider:hover::-moz-range-thumb {
        transform: scale(1.1);
      }
      .slider:active::-webkit-slider-thumb,
      .slider:active::-moz-range-thumb {
        transform: scale(1.18);
      }
      .slider:focus-visible {
        outline: none;
      }
      .slider:focus-visible::-webkit-slider-thumb {
        box-shadow: 0 0 0 6px var(--focus);
      }
      .slider:focus-visible::-moz-range-thumb {
        box-shadow: 0 0 0 6px var(--focus);
      }
      .fields {
        display: flex;
        flex-direction: column;
      }
      .field {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: baseline;
        gap: 16px;
        padding: clamp(14px, 2.2vw, 18px) 0;
        border-bottom: 1px solid var(--line);
        cursor: text;
        transition: border-color 0.4s ease;
      }
      .field-name {
        font-size: 0.78rem;
        letter-spacing: 0.1em;
        color: var(--muted);
        white-space: nowrap;
        transition: color 0.25s ease;
      }
      .field-input {
        width: 100%;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: clamp(19px, 4.2vw, 26px);
        font-weight: 500;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        text-align: right;
        caret-color: var(--accent);
        transition: color 0.25s ease;
      }
      .field-unit {
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        transition: color 0.4s ease;
      }
      .field.invalid .field-name,
      .field.invalid .field-input {
        color: var(--danger);
      }
      .hint {
        margin: 0;
        max-height: 0;
        overflow: hidden;
        font-size: 0.78rem;
        letter-spacing: 0.03em;
        color: var(--danger);
        opacity: 0;
        transition:
          max-height 0.22s ease,
          margin 0.22s ease,
          opacity 0.22s ease;
      }
      .hint.show {
        max-height: 5em;
        margin-top: 12px;
        opacity: 1;
      }
      .readouts {
        display: flex;
        flex-direction: column;
      }
      .readout {
        display: flex;
        flex-direction: column;
        gap: clamp(16px, 2.4vw, 22px);
        padding: clamp(20px, 3vw, 30px) 0;
        border-bottom: 1px solid var(--line);
        transition: border-color 0.4s ease;
      }
      .readout-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        white-space: nowrap;
      }
      .readout-name {
        margin: 0;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--ink);
        transition: color 0.4s ease;
      }
      .readout-formula {
        font-size: 0.75rem;
        letter-spacing: 0.02em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        transition: color 0.4s ease;
      }
      .readout-value {
        margin: 0;
        font-size: clamp(30px, 4.6vw, 42px);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.05;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
        transition: color 0.4s ease;
      }
      .readout-notes {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        white-space: nowrap;
      }
      .readout-note {
        font-size: 0.75rem;
        letter-spacing: 0.02em;
        color: var(--muted);
        line-height: 1.5;
        transition: color 0.4s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="masthead">
        <h1>相对论效应</h1>
        <p>狭义相对论中的时间膨胀与长度收缩</p>
      </header>
      <section class="control">
        <input id="speedSlider" class="slider" type="range" min="0" max="1000" step="0.1" value="0" aria-label="速度调节" />
        <div class="fields">
          <label class="field">
            <span class="field-name">速度 v</span>
            <input id="velocityInput" class="field-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="物体速度，单位米每秒" />
            <span class="field-unit">m/s</span>
          </label>
          <label class="field">
            <span class="field-name">速度比 β</span>
            <input id="betaInput" class="field-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="速度比，v 与 c 的比值" />
            <span class="field-unit">v / c</span>
          </label>
        </div>
        <p class="hint" id="hint" role="alert"></p>
      </section>
      <section class="readouts">
        <article class="readout">
          <div class="readout-head">
            <h2 class="readout-name">洛伦兹因子 γ</h2>
            <span class="readout-formula">γ = 1 / √(1 − β²)</span>
          </div>
          <p class="readout-value" id="gammaValue">—</p>
          <div class="readout-notes">
            <span class="readout-note">时间膨胀 Δt = γ·Δτ</span>
            <span class="readout-note">质量增加 m = γ·m₀</span>
          </div>
        </article>
        <article class="readout">
          <div class="readout-head">
            <h2 class="readout-name">洛伦兹因子倒数 1/γ</h2>
            <span class="readout-formula">1/γ = √(1 − β²)</span>
          </div>
          <p class="readout-value" id="invGammaValue">—</p>
          <div class="readout-notes">
            <span class="readout-note">长度收缩 L = L₀ / γ</span>
          </div>
        </article>
      </section>
    </main>
    <script>
      (function () {
        "use strict";
        const LIGHT_SPEED = 299792458;
        const SLIDER_MAX = 1000;
        const MIN_GAP = 1e-7;
        const GAP_RATIO = MIN_GAP / LIGHT_SPEED;
        const LOG_GAP_RATIO = Math.log(GAP_RATIO);
        const INITIAL_BETA = 0.5;
        const byId = (id) => document.getElementById(id);
        const slider = byId("speedSlider");
        const velocityInput = byId("velocityInput");
        const betaInput = byId("betaInput");
        const hint = byId("hint");
        const gammaOutput = byId("gammaValue");
        const invGammaOutput = byId("invGammaValue");
        const velocityField = velocityInput.closest(".field");
        const betaField = betaInput.closest(".field");
        let gap = LIGHT_SPEED * (1 - INITIAL_BETA);
        let errorField = null;
        function gapToSlider(value) {
          if (value >= LIGHT_SPEED) return 0;
          if (value <= MIN_GAP) return SLIDER_MAX;
          return (Math.log(value / LIGHT_SPEED) / LOG_GAP_RATIO) * SLIDER_MAX;
        }
        function sliderToGap(value) {
          const position = value / SLIDER_MAX;
          if (position <= 0) return LIGHT_SPEED;
          if (position >= 1) return MIN_GAP;
          return LIGHT_SPEED * Math.pow(GAP_RATIO, position);
        }
        function render() {
          const ratio = gap / LIGHT_SPEED;
          const gamma = 1 / Math.sqrt(ratio * (2 - ratio));
          gammaOutput.textContent = gamma;
          invGammaOutput.textContent = 1 / gamma;
        }
        function apply(nextGap, source) {
          gap = Math.min(Math.max(nextGap, MIN_GAP), LIGHT_SPEED);
          slider.value = String(gapToSlider(gap));
          if (source !== "velocity") velocityInput.value = LIGHT_SPEED - gap;
          if (source !== "beta") betaInput.value = 1 - gap / LIGHT_SPEED;
          render();
        }
        function fail(field, message) {
          if (errorField && errorField !== field) {
            errorField.classList.remove("invalid");
          }
          errorField = field;
          field.classList.add("invalid");
          hint.textContent = message;
          hint.classList.add("show");
        }
        function clearError() {
          if (errorField) {
            errorField.classList.remove("invalid");
            errorField = null;
          }
          hint.textContent = "";
          hint.classList.remove("show");
        }
        function toNumber(text) {
          const cleaned = text.trim().replace(/[,\s]/g, "");
          if (!cleaned) return null;
          const value = Number(cleaned);
          return Number.isFinite(value) ? value : null;
        }
        velocityInput.addEventListener("input", () => {
          if (!velocityInput.value.trim()) {
            clearError();
            return;
          }
          const value = toNumber(velocityInput.value);
          if (value === null) {
            fail(velocityField, "请输入有效的数字");
            return;
          }
          if (value < 0) {
            fail(velocityField, "速度不能为负数");
            return;
          }
          if (value >= LIGHT_SPEED) {
            fail(velocityField, "速度必须小于光速 c");
            return;
          }
          clearError();
          apply(LIGHT_SPEED - value, "velocity");
        });
        betaInput.addEventListener("input", () => {
          if (!betaInput.value.trim()) {
            clearError();
            return;
          }
          const value = toNumber(betaInput.value);
          if (value === null) {
            fail(betaField, "请输入有效的数字");
            return;
          }
          if (value < 0) {
            fail(betaField, "速度比不能为负数");
            return;
          }
          if (value >= 1) {
            fail(betaField, "速度比必须小于 1");
            return;
          }
          clearError();
          apply(LIGHT_SPEED * (1 - value), "beta");
        });
        velocityInput.addEventListener("blur", () => {
          velocityInput.value = LIGHT_SPEED - gap;
        });
        betaInput.addEventListener("blur", () => {
          betaInput.value = 1 - gap / LIGHT_SPEED;
        });
        slider.addEventListener("input", () => {
          clearError();
          apply(sliderToGap(Number(slider.value)), "slider");
        });
        apply(gap, "init");
      })();
    </script>
  </body>
</html>
