<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";
      } catch (e) {}
    </script>
    <style>
      :root {
        --bg: #1a2633;
        --panel-bg: #1e2d3a;
        --text: #c8d4dc;
        --text-secondary: #8a9ba8;
        --accent: #5eeadb;
        --canvas-bg: #17222b;
        --canvas-border: #2a4a4f;
        --grid-line: #1f3038;
        --btn-bg: #1e4d4a;
        --btn-hover: #1f5f58;
        --btn-active: #1a3f3b;
        --btn-text: #e0f0ed;
        --btn-restart-bg: #3d3a4a;
        --btn-restart-hover: #4e4a5c;
        --btn-restart-active: #2e2b38;
        --shadow: rgba(0, 0, 0, 0.35);
        --card-bg: #1e2d3a;
        --card-border: #2a3d48;
        --highlight-score: #facc15;
        --status-idle: #8a9ba8;
        --status-playing: #5eeadb;
        --status-paused: #f0c060;
        --status-over: #f08080;
        --dpad-bg: rgba(30, 77, 74, 0.75);
        --dpad-border: rgba(94, 234, 219, 0.38);
        --dpad-color: #5eeadb;
        --dpad-hover: rgba(31, 95, 88, 0.9);
        --dpad-active: rgba(26, 63, 59, 0.98);
        --dpad-glow: rgba(94, 234, 219, 0.25);
        --slider-track: #2a3d48;
      }
      body.light-theme {
        --bg: #f2efe8;
        --panel-bg: #fdfcfa;
        --text: #4a4440;
        --text-secondary: #8a7e74;
        --accent: #2d9d8e;
        --canvas-bg: #fafaf5;
        --canvas-border: #c8d0c4;
        --grid-line: #e6e2d8;
        --btn-bg: #d4e8e0;
        --btn-hover: #c0ddd2;
        --btn-active: #a8cfc2;
        --btn-text: #2a4a3f;
        --btn-restart-bg: #e0dde4;
        --btn-restart-hover: #d2ced8;
        --btn-restart-active: #bfbac7;
        --shadow: rgba(0, 0, 0, 0.1);
        --card-bg: #fdfcfa;
        --card-border: #e6e2d8;
        --status-idle: #8a7e74;
        --status-playing: #1a8a78;
        --status-paused: #a07820;
        --status-over: #b84040;
        --dpad-bg: rgba(212, 232, 224, 0.88);
        --dpad-border: rgba(45, 157, 142, 0.42);
        --dpad-color: #2a4a3f;
        --dpad-hover: rgba(192, 221, 210, 0.96);
        --dpad-active: rgba(168, 207, 194, 0.99);
        --dpad-glow: rgba(45, 157, 142, 0.22);
        --slider-track: #e6e2d8;
      }
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        transition:
          background-color 0.25s ease,
          color 0.25s ease;
      }
      .app {
        display: flex;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
      }
      .panel {
        background: var(--panel-bg);
        z-index: 10;
        transition: background-color 0.25s ease;
      }
      .panel-content {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
      }
      .game-title {
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        transition: color 0.25s ease;
      }
      .theme-toggle {
        border-radius: 50%;
        border: 2px solid var(--card-border);
        background: var(--card-bg);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        line-height: 1;
        padding: 0;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          background-color 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .theme-toggle:hover {
        transform: rotate(20deg);
        border-color: var(--accent);
      }
      .theme-toggle:active {
        transform: scale(0.9) rotate(20deg);
      }
      .score-panel {
        display: flex;
        flex-direction: column;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        box-shadow: 0 2px 8px var(--shadow);
        transition:
          background-color 0.25s ease,
          border-color 0.25s ease;
      }
      .score-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .score-label {
        color: var(--text-secondary);
        font-weight: 500;
        transition: color 0.25s ease;
      }
      .score-value {
        color: var(--accent);
        font-weight: 700;
        transition: color 0.25s ease;
      }
      .score-value.highlight {
        color: var(--highlight-score);
        animation: scorePop 0.4s ease-out;
      }
      .high-score-value {
        color: var(--text-secondary);
        font-weight: 600;
        transition: color 0.25s ease;
      }
      .status-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        color: var(--text-secondary);
        font-weight: 600;
        box-shadow: 0 2px 8px var(--shadow);
        transition:
          color 0.25s ease,
          border-color 0.25s ease,
          background-color 0.25s ease;
      }
      .status-indicator {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--status-idle);
        flex-shrink: 0;
        transition:
          background-color 0.25s ease,
          box-shadow 0.25s ease;
      }
      .status-bar.playing {
        color: var(--status-playing);
        border-color: var(--status-playing);
      }
      .status-bar.playing .status-indicator {
        background: var(--status-playing);
        box-shadow: 0 0 8px var(--status-playing);
      }
      .status-bar.paused {
        color: var(--status-paused);
        border-color: var(--status-paused);
      }
      .status-bar.paused .status-indicator {
        background: var(--status-paused);
      }
      .status-bar.over {
        color: var(--status-over);
        border-color: var(--status-over);
      }
      .status-bar.over .status-indicator {
        background: var(--status-over);
      }
      .opacity-control {
        display: flex;
        flex-direction: column;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        box-shadow: 0 2px 8px var(--shadow);
        transition:
          background-color 0.25s ease,
          border-color 0.25s ease;
      }
      .opacity-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-secondary);
        transition: color 0.25s ease;
      }
      .opacity-value {
        color: var(--accent);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        transition: color 0.25s ease;
      }
      .opacity-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 3px;
        outline: none;
        cursor: pointer;
        background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--percent, 0%), var(--slider-track) var(--percent, 0%), var(--slider-track) 100%);
        transition: height 0.15s ease;
      }
      .opacity-slider:hover {
        height: 8px;
      }
      .opacity-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        border: 2px solid var(--card-bg);
        cursor: pointer;
        box-shadow: 0 2px 6px var(--shadow);
        transition: transform 0.15s ease;
      }
      .opacity-slider::-webkit-slider-thumb:hover {
        transform: scale(1.15);
      }
      .opacity-slider::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        border: 2px solid var(--card-bg);
        cursor: pointer;
        box-shadow: 0 2px 6px var(--shadow);
      }
      .button-group {
        display: flex;
      }
      .control-btn {
        flex: 1;
        font-weight: 700;
        color: var(--btn-text);
        background-color: var(--btn-bg);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        letter-spacing: 1px;
        box-shadow: 0 3px 10px var(--shadow);
        transition:
          background-color 0.2s ease,
          transform 0.15s ease,
          box-shadow 0.2s ease;
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }
      .control-btn:hover {
        background-color: var(--btn-hover);
        transform: translateY(-1px);
        box-shadow: 0 5px 16px var(--shadow);
      }
      .control-btn:active {
        background-color: var(--btn-active);
        transform: translateY(1px);
        box-shadow: 0 1px 4px var(--shadow);
        transition: transform 0.08s ease;
      }
      #restartBtn {
        background-color: var(--btn-restart-bg);
        color: var(--text);
      }
      #restartBtn:hover {
        background-color: var(--btn-restart-hover);
      }
      #restartBtn:active {
        background-color: var(--btn-restart-active);
      }
      #restartBtn[hidden] {
        display: none;
      }
      .board-area {
        display: flex;
        min-width: 0;
        min-height: 0;
      }
      .board-wrap {
        position: relative;
        display: inline-block;
        line-height: 0;
      }
      #snakeCanvas {
        border: 4px solid var(--canvas-border);
        border-radius: 12px;
        background-color: var(--canvas-bg);
        box-shadow: 0 6px 24px var(--shadow);
        display: block;
        transition:
          border-color 0.25s ease,
          background-color 0.25s ease;
      }
      .dpad-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: auto auto;
        gap: 8px;
        width: 100%;
      }
      .dpad-btn {
        aspect-ratio: 1 / 1;
        width: 100%;
        height: auto;
        display: grid;
        place-items: center;
        padding: 0;
        border: 2px solid var(--dpad-border);
        border-radius: 16px;
        background: var(--dpad-bg);
        color: var(--dpad-color);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        transition:
          background 0.12s ease,
          transform 0.1s ease,
          border-color 0.12s ease,
          box-shadow 0.15s ease;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow:
          0 4px 14px rgba(0, 0, 0, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        outline: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .dpad-btn:hover {
        background: var(--dpad-hover);
        border-color: var(--dpad-color);
        box-shadow:
          0 4px 20px var(--dpad-glow),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
      }
      .dpad-btn:active {
        transform: scale(0.94);
        background: var(--dpad-active);
        border-color: var(--dpad-color);
        box-shadow:
          0 2px 8px var(--dpad-glow),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        transition:
          transform 0.06s ease,
          background 0.06s ease;
      }
      .dpad-btn[data-dir="up"] {
        grid-column: 2;
        grid-row: 1;
      }
      .dpad-btn[data-dir="left"] {
        grid-column: 1;
        grid-row: 2;
      }
      .dpad-btn[data-dir="down"] {
        grid-column: 2;
        grid-row: 2;
      }
      .dpad-btn[data-dir="right"] {
        grid-column: 3;
        grid-row: 2;
      }
      .dpad-btn svg {
        width: 38%;
        height: 38%;
        display: block;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.2));
      }
      @media (max-aspect-ratio: 1/1) {
        .app {
          flex-direction: column;
        }
        .panel {
          order: 0;
          width: 100%;
          flex-shrink: 0;
          padding: 10px 12px 12px;
          border-radius: 0 0 18px 18px;
          box-shadow: 0 4px 18px var(--shadow);
        }
        .panel-content {
          gap: 8px;
        }
        .game-title {
          position: relative;
          width: 100%;
          justify-content: center;
          font-size: 20px;
          gap: 8px;
          padding: 2px 40px;
          min-height: 34px;
        }
        .theme-toggle {
          position: absolute;
          right: 0;
          top: 50%;
          width: 32px;
          height: 32px;
          font-size: 15px;
          transform: translateY(-50%);
        }
        .theme-toggle:hover {
          transform: translateY(-50%) rotate(20deg);
        }
        .theme-toggle:active {
          transform: translateY(-50%) scale(0.9) rotate(20deg);
        }
        .score-panel {
          flex-direction: row;
          justify-content: space-around;
          align-items: center;
          padding: 8px 12px;
          gap: 10px;
        }
        .score-row {
          flex-direction: column;
          gap: 2px;
          align-items: center;
        }
        .score-label {
          font-size: 11px;
        }
        .score-value {
          font-size: 17px;
        }
        .high-score-value {
          font-size: 15px;
        }
        .status-bar {
          padding: 8px 12px;
          font-size: 13px;
        }
        .opacity-control {
          padding: 8px 12px;
          gap: 6px;
        }
        .button-group {
          gap: 8px;
        }
        .control-btn {
          padding: 11px 14px;
          font-size: 14px;
          border-radius: 9px;
        }
        .board-area {
          order: 1;
          flex: 1 1 0;
          min-height: 0;
          align-items: flex-start;
          justify-content: center;
          padding: 8px 8px 0;
        }
        .dpad-container {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          padding: 0 10px max(10px, env(safe-area-inset-bottom));
          z-index: 100;
          pointer-events: none;
          transition: opacity 0.15s ease;
        }
        .dpad-grid {
          pointer-events: auto;
          gap: 8px;
        }
      }
      @media (min-aspect-ratio: 1/1) {
        .app {
          flex-direction: row;
        }
        .board-area {
          order: 0;
          flex: 1 1 0;
          min-width: 0;
          align-items: center;
          justify-content: center;
          padding: 14px;
        }
        .panel {
          order: 1;
          width: clamp(256px, 26vw, 320px);
          flex-shrink: 0;
          height: 100%;
          display: flex;
          flex-direction: column;
          padding: 20px;
          padding-bottom: max(20px, env(safe-area-inset-bottom));
          border-radius: 18px 0 0 18px;
          box-shadow: -6px 0 28px var(--shadow);
          overflow: hidden;
        }
        .panel-content {
          flex: 1 1 auto;
          min-height: 0;
          gap: 12px;
          overflow-y: auto;
          padding-right: 2px;
        }
        .panel-content::-webkit-scrollbar {
          width: 6px;
        }
        .panel-content::-webkit-scrollbar-thumb {
          background: var(--card-border);
          border-radius: 3px;
        }
        .game-title {
          font-size: 23px;
          gap: 10px;
          padding: 2px 0;
          justify-content: space-between;
        }
        .theme-toggle {
          width: 36px;
          height: 36px;
          font-size: 17px;
        }
        .score-panel {
          padding: 12px 14px;
          gap: 8px;
        }
        .score-label {
          font-size: 13px;
        }
        .score-value {
          font-size: 20px;
        }
        .high-score-value {
          font-size: 15px;
        }
        .status-bar {
          padding: 11px 14px;
          font-size: 14px;
        }
        .opacity-control {
          padding: 11px 14px;
          gap: 8px;
        }
        .button-group {
          gap: 10px;
        }
        .control-btn {
          padding: 12px 16px;
          font-size: 15px;
          border-radius: 10px;
        }
        .dpad-container {
          flex: 0 0 auto;
          padding-top: 14px;
          transition: opacity 0.15s ease;
        }
        .dpad-grid {
          gap: 8px;
        }
      }
      @keyframes scorePop {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.45);
        }
        100% {
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <script>
      try {
        if (localStorage.getItem("theme") !== "dark") {
          document.body.classList.add("light-theme");
        }
      } catch (e) {}
    </script>
    <div class="app">
      <aside class="panel" id="panel">
        <div class="panel-content">
          <h1 class="game-title">
            🐍 贪吃蛇
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
          </h1>
          <div class="score-panel">
            <div class="score-row">
              <span class="score-label">当前分数</span>
              <span class="score-value" id="score">0</span>
            </div>
            <div class="score-row">
              <span class="score-label">最高分数</span>
              <span class="high-score-value" id="highScore">0</span>
            </div>
          </div>
          <div class="status-bar" id="statusBar">
            <span class="status-indicator"></span>
            <span id="statusText">等待开始</span>
          </div>
          <div class="opacity-control">
            <div class="opacity-header">
              <span>虚拟方向键</span>
              <span class="opacity-value" id="opacityValue">0%</span>
            </div>
            <input type="range" class="opacity-slider" id="opacitySlider" min="0" max="100" value="50" aria-label="虚拟方向键透明度" />
          </div>
          <div class="button-group">
            <button class="control-btn" id="pauseBtn">开始游戏</button>
            <button class="control-btn" id="restartBtn" hidden>重新开始</button>
          </div>
        </div>
        <div class="dpad-container" id="dpadContainer" style="opacity: 0; pointer-events: none">
          <div class="dpad-grid" id="dpad">
            <button class="dpad-btn" data-dir="up" aria-label="上">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5L3 19h18z" /></svg>
            </button>
            <button class="dpad-btn" data-dir="left" aria-label="左">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 12L19 3v18z" /></svg>
            </button>
            <button class="dpad-btn" data-dir="down" aria-label="下">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 19L3 5h18z" /></svg>
            </button>
            <button class="dpad-btn" data-dir="right" aria-label="右">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 12L5 3v18z" /></svg>
            </button>
          </div>
        </div>
      </aside>
      <div class="board-area" id="boardArea">
        <div class="board-wrap">
          <canvas id="snakeCanvas"></canvas>
        </div>
      </div>
    </div>
    <script>
      (() => {
        "use strict";
        const GRID_COUNT = 20;
        const TICK_INTERVAL = 200;
        const FOOD_SCORE = 10;
        const INITIAL_SNAKE_LENGTH = 3;
        const INITIAL_HEAD = { x: 10, y: 10 };
        const DEFAULT_DPAD_OPACITY = 50;
        const RESIZE_DELAYS = [50, 200];
        const ORIENTATION_DELAYS = [120, 320];
        const STORAGE_KEYS = {
          theme: "theme",
          highScore: "snakeGameHighScore",
          dpadOpacity: "snakeGameDpadOpacity",
        };
        const STATUS_TEXT = {
          waiting: "等待开始",
          playing: "游戏中",
          paused: "已暂停",
          over: "游戏结束",
        };
        const BUTTON_TEXT = {
          waiting: "开始游戏",
          playing: "暂停游戏",
          paused: "继续游戏",
          over: "再来一局",
        };
        const DIRECTIONS = {
          up: { x: 0, y: -1 },
          down: { x: 0, y: 1 },
          left: { x: -1, y: 0 },
          right: { x: 1, y: 0 },
        };
        const OPPOSITE_DIRECTION = {
          up: "down",
          down: "up",
          left: "right",
          right: "left",
        };
        const KEY_TO_DIRECTION = {
          ArrowUp: "up",
          w: "up",
          W: "up",
          ArrowDown: "down",
          s: "down",
          S: "down",
          ArrowLeft: "left",
          a: "left",
          A: "left",
          ArrowRight: "right",
          d: "right",
          D: "right",
        };
        const THEME_COLORS = {
          dark: {
            snakeHead: "#5eeadb",
            snakeBody: "#3dbda7",
            snakeBodyAlt: "#35a894",
            food: "#f0a58f",
            foodGlow: "#f8c4b4",
            gridLine: "#1f3038",
            canvasBg: "#17222b",
          },
          light: {
            snakeHead: "#23917e",
            snakeBody: "#3db89e",
            snakeBodyAlt: "#35a08a",
            food: "#e8836e",
            foodGlow: "#f0a090",
            gridLine: "#e6e2d8",
            canvasBg: "#fafaf5",
          },
        };
        const storage = {
          read(key, fallback) {
            try {
              const value = window.localStorage.getItem(key);
              return value === null ? fallback : value;
            } catch (error) {
              return fallback;
            }
          },
          write(key, value) {
            try {
              window.localStorage.setItem(key, String(value));
            } catch (error) {}
          },
          readInteger(key, fallback) {
            const raw = storage.read(key, null);
            if (raw === null) return fallback;
            const parsed = Number.parseInt(raw, 10);
            return Number.isFinite(parsed) ? parsed : fallback;
          },
        };
        class ThemeManager {
          constructor(button) {
            this.button = button;
            this.current = "light";
            this.palette = THEME_COLORS.light;
            this.listeners = [];
          }
          onChange(listener) {
            this.listeners.push(listener);
          }
          initialize() {
            this.apply(storage.read(STORAGE_KEYS.theme, "light"));
          }
          toggle() {
            this.apply(this.current === "dark" ? "light" : "dark");
          }
          apply(theme) {
            this.current = theme === "light" ? "light" : "dark";
            this.palette = THEME_COLORS[this.current];
            document.body.classList.toggle("light-theme", this.current === "light");
            this.button.textContent = this.current === "light" ? "☀️" : "🌙";
            this.button.setAttribute("aria-label", this.current === "light" ? "切换到暗色主题" : "切换到亮色主题");
            storage.write(STORAGE_KEYS.theme, this.current);
            for (const listener of this.listeners) {
              listener(this.palette);
            }
          }
        }
        class Renderer {
          constructor(canvas, container, gridCount) {
            this.canvas = canvas;
            this.container = container;
            this.ctx = canvas.getContext("2d");
            this.gridCount = gridCount;
            this.cellSize = 0;
            this.palette = THEME_COLORS.dark;
            this.snapshot = { snake: [], food: { x: -1, y: -1 } };
            this.resizeFrame = 0;
          }
          setPalette(palette) {
            this.palette = palette;
            this.draw();
          }
          setSnapshot(snapshot) {
            this.snapshot = snapshot;
            this.draw();
          }
          scheduleResize() {
            if (this.resizeFrame) return;
            this.resizeFrame = window.requestAnimationFrame(() => {
              this.resizeFrame = 0;
              this.resize();
            });
          }
          resize() {
            const style = window.getComputedStyle(this.container);
            const paddingX = Number.parseFloat(style.paddingLeft) + Number.parseFloat(style.paddingRight);
            const paddingY = Number.parseFloat(style.paddingTop) + Number.parseFloat(style.paddingBottom);
            const availableWidth = this.container.clientWidth - paddingX;
            const availableHeight = this.container.clientHeight - paddingY;
            const size = Math.floor(Math.min(availableWidth, availableHeight));
            if (size < 40) return;
            const ratio = Math.min(window.devicePixelRatio || 1, 2);
            const pixelSize = Math.floor(size * ratio);
            if (this.canvas.width !== pixelSize || this.canvas.height !== pixelSize) {
              this.canvas.width = pixelSize;
              this.canvas.height = pixelSize;
            }
            this.canvas.style.width = `${size}px`;
            this.canvas.style.height = `${size}px`;
            this.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
            this.cellSize = size / this.gridCount;
            this.draw();
          }
          draw() {
            if (!this.cellSize) return;
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            this.drawBackground();
            this.drawGrid();
            this.drawFood();
            this.drawSnake();
          }
          drawBackground() {
            this.ctx.fillStyle = this.palette.canvasBg;
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
          }
          drawGrid() {
            const ctx = this.ctx;
            ctx.strokeStyle = this.palette.gridLine;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            for (let i = 1; i < this.gridCount; i++) {
              const position = Math.round(i * this.cellSize) + 0.5;
              ctx.moveTo(position, 0);
              ctx.lineTo(position, this.canvas.height);
              ctx.moveTo(0, position);
              ctx.lineTo(this.canvas.width, position);
            }
            ctx.stroke();
          }
          drawSnake() {
            const snake = this.snapshot.snake;
            if (!snake.length) return;
            const ctx = this.ctx;
            const cell = this.cellSize;
            const size = cell - 1.5;
            for (let index = 0; index < snake.length; index++) {
              const segment = snake[index];
              const x = segment.x * cell;
              const y = segment.y * cell;
              if (index === 0) {
                ctx.fillStyle = this.palette.snakeHead;
                ctx.shadowColor = this.palette.snakeHead;
                ctx.shadowBlur = cell * 0.5;
                this.roundRect(x + 0.5, y + 0.5, size, size, cell * 0.28);
                ctx.fill();
                ctx.shadowColor = "transparent";
                ctx.shadowBlur = 0;
                this.drawSnakeEyes(x, y);
              } else {
                ctx.fillStyle = index % 2 === 0 ? this.palette.snakeBody : this.palette.snakeBodyAlt;
                this.roundRect(x + 0.5, y + 0.5, size, size, cell * 0.2);
                ctx.fill();
              }
            }
          }
          drawSnakeEyes(x, y) {
            const ctx = this.ctx;
            const cell = this.cellSize;
            const centerX = x + cell / 2;
            const centerY = y + cell / 2;
            const offsetX = cell * 0.22;
            const offsetY = cell * 0.132;
            const radius = cell * 0.1;
            ctx.fillStyle = "#1a1a1a";
            ctx.beginPath();
            ctx.arc(centerX - offsetX, centerY - offsetY, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(centerX + offsetX, centerY - offsetY, radius, 0, Math.PI * 2);
            ctx.fill();
          }
          drawFood() {
            const food = this.snapshot.food;
            if (food.x < 0 || food.y < 0) return;
            const ctx = this.ctx;
            const cell = this.cellSize;
            const centerX = food.x * cell + cell / 2;
            const centerY = food.y * cell + cell / 2;
            const radius = cell * 0.38;
            const glowRadius = radius * 1.7;
            const glow = ctx.createRadialGradient(centerX, centerY, radius * 0.5, centerX, centerY, glowRadius);
            glow.addColorStop(0, this.palette.foodGlow);
            glow.addColorStop(0.5, this.palette.food);
            glow.addColorStop(1, "transparent");
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(centerX, centerY, glowRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = this.palette.food;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.45)";
            ctx.beginPath();
            ctx.arc(centerX - radius * 0.25, centerY - radius * 0.35, radius * 0.3, 0, Math.PI * 2);
            ctx.fill();
          }
          roundRect(x, y, width, height, radius) {
            const ctx = this.ctx;
            ctx.beginPath();
            if (typeof ctx.roundRect === "function") {
              ctx.roundRect(x, y, width, height, radius);
              return;
            }
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + width, y, x + width, y + height, radius);
            ctx.arcTo(x + width, y + height, x, y + height, radius);
            ctx.arcTo(x, y + height, x, y, radius);
            ctx.arcTo(x, y, x + width, y, radius);
            ctx.closePath();
          }
        }
        class SnakeGame {
          constructor(options) {
            this.gridCount = options.gridCount;
            this.tickInterval = options.tickInterval;
            this.foodScore = options.foodScore;
            this.initialLength = options.initialLength;
            this.initialHead = options.initialHead;
            this.onUpdate = options.onUpdate;
            this.onGameOver = options.onGameOver;
            this.snake = [];
            this.food = { x: -1, y: -1 };
            this.direction = "right";
            this.nextDirection = "right";
            this.score = 0;
            this.status = "waiting";
            this.timerId = null;
            this.reset();
          }
          reset() {
            this.stopTimer();
            this.snake = [];
            this.food = { x: -1, y: -1 };
            this.direction = "right";
            this.nextDirection = "right";
            this.score = 0;
            this.status = "waiting";
            this.emit();
          }
          start() {
            this.stopTimer();
            this.snake = this.createInitialSnake();
            this.food = { x: -1, y: -1 };
            this.direction = "right";
            this.nextDirection = "right";
            this.score = 0;
            this.status = "playing";
            this.spawnFood();
            this.startTimer();
            this.emit();
          }
          togglePause() {
            if (this.status === "waiting" || this.status === "over") {
              this.start();
              return;
            }
            if (this.status === "playing") {
              this.stopTimer();
              this.status = "paused";
            } else if (this.status === "paused") {
              this.status = "playing";
              this.startTimer();
            }
            this.emit();
          }
          pauseIfPlaying() {
            if (this.status !== "playing") return;
            this.stopTimer();
            this.status = "paused";
            this.emit();
          }
          turn(direction) {
            if (this.status !== "playing") return;
            if (!DIRECTIONS[direction]) return;
            if (direction === this.direction) return;
            if (direction === OPPOSITE_DIRECTION[this.direction]) return;
            this.nextDirection = direction;
          }
          tick() {
            if (this.status !== "playing") return;
            this.direction = this.nextDirection;
            const head = this.computeNextHead();
            if (this.isOutOfBounds(head) || this.isSelfCollision(head)) {
              this.finish();
              return;
            }
            this.snake.unshift(head);
            if (this.isFood(head)) {
              this.score += this.foodScore;
              this.spawnFood();
            } else {
              this.snake.pop();
            }
            this.emit();
          }
          finish() {
            this.stopTimer();
            this.status = "over";
            this.onGameOver(this.score);
            this.emit();
          }
          createInitialSnake() {
            const snake = [];
            for (let index = 0; index < this.initialLength; index++) {
              snake.push({
                x: this.initialHead.x - index,
                y: this.initialHead.y,
              });
            }
            return snake;
          }
          computeNextHead() {
            const vector = DIRECTIONS[this.direction];
            const head = this.snake[0];
            return { x: head.x + vector.x, y: head.y + vector.y };
          }
          isOutOfBounds(point) {
            return point.x < 0 || point.x >= this.gridCount || point.y < 0 || point.y >= this.gridCount;
          }
          isSelfCollision(point) {
            return this.snake.some((segment) => segment.x === point.x && segment.y === point.y);
          }
          isFood(point) {
            return point.x === this.food.x && point.y === this.food.y;
          }
          spawnFood() {
            const occupied = new Set(this.snake.map((segment) => `${segment.x},${segment.y}`));
            if (occupied.size >= this.gridCount * this.gridCount) return;
            for (let attempt = 0; attempt < 200; attempt++) {
              const x = Math.floor(Math.random() * this.gridCount);
              const y = Math.floor(Math.random() * this.gridCount);
              if (!occupied.has(`${x},${y}`)) {
                this.food = { x, y };
                return;
              }
            }
            for (let y = 0; y < this.gridCount; y++) {
              for (let x = 0; x < this.gridCount; x++) {
                if (!occupied.has(`${x},${y}`)) {
                  this.food = { x, y };
                  return;
                }
              }
            }
          }
          startTimer() {
            this.stopTimer();
            this.timerId = window.setInterval(() => this.tick(), this.tickInterval);
          }
          stopTimer() {
            if (this.timerId === null) return;
            window.clearInterval(this.timerId);
            this.timerId = null;
          }
          emit() {
            this.onUpdate({
              snake: this.snake,
              food: this.food,
              score: this.score,
              status: this.status,
            });
          }
        }
        class ScoreBoard {
          constructor(scoreElement, highScoreElement) {
            this.scoreElement = scoreElement;
            this.highScoreElement = highScoreElement;
            this.highScore = 0;
            this.lastScore = null;
          }
          loadHighScore() {
            const stored = storage.readInteger(STORAGE_KEYS.highScore, 0);
            this.highScore = stored > 0 ? stored : 0;
            this.highScoreElement.textContent = String(this.highScore);
          }
          update(score) {
            if (score === this.lastScore) return;
            const increased = this.lastScore !== null && score > this.lastScore;
            this.lastScore = score;
            this.scoreElement.textContent = String(score);
            if (increased) {
              this.flash(this.scoreElement);
            }
          }
          commitHighScore(score) {
            if (score <= this.highScore) return;
            this.highScore = score;
            this.highScoreElement.textContent = String(score);
            storage.write(STORAGE_KEYS.highScore, score);
            this.flash(this.highScoreElement);
          }
          flash(element) {
            element.classList.remove("highlight");
            void element.offsetWidth;
            element.classList.add("highlight");
          }
        }
        class StatusBar {
          constructor(barElement, textElement) {
            this.barElement = barElement;
            this.textElement = textElement;
            this.currentStatus = null;
          }
          set(status) {
            if (status === this.currentStatus) return;
            this.currentStatus = status;
            this.textElement.textContent = STATUS_TEXT[status] || STATUS_TEXT.waiting;
            this.barElement.className = "status-bar" + (status === "waiting" ? "" : ` ${status}`);
          }
        }
        class DpadOpacityController {
          constructor(options) {
            this.container = options.container;
            this.slider = options.slider;
            this.label = options.label;
            this.storageKey = options.storageKey;
            this.value = options.defaultValue;
          }
          initialize() {
            const stored = storage.readInteger(this.storageKey, this.value);
            this.apply(stored, false);
            this.slider.addEventListener("input", (event) => {
              this.apply(event.target.value, true);
            });
          }
          sync() {
            const stored = storage.readInteger(this.storageKey, this.value);
            this.apply(stored, false);
          }
          apply(rawValue, persist) {
            const parsed = Number.parseInt(rawValue, 10);
            const value = Number.isFinite(parsed) ? Math.max(0, Math.min(100, parsed)) : 0;
            this.value = value;
            this.slider.value = String(value);
            this.slider.style.setProperty("--percent", `${value}%`);
            this.label.textContent = `${value}%`;
            this.container.style.opacity = String(value / 100);
            this.container.style.pointerEvents = value > 0 ? "auto" : "none";
            if (persist) {
              storage.write(this.storageKey, value);
            }
          }
        }
        class SnakeApp {
          constructor() {
            this.dom = this.queryDom();
            this.themeManager = new ThemeManager(this.dom.themeToggle);
            this.renderer = new Renderer(this.dom.canvas, this.dom.boardArea, GRID_COUNT);
            this.scoreBoard = new ScoreBoard(this.dom.score, this.dom.highScore);
            this.statusBar = new StatusBar(this.dom.statusBar, this.dom.statusText);
            this.dpadOpacity = new DpadOpacityController({
              container: this.dom.dpadContainer,
              slider: this.dom.opacitySlider,
              label: this.dom.opacityValue,
              storageKey: STORAGE_KEYS.dpadOpacity,
              defaultValue: DEFAULT_DPAD_OPACITY,
            });
            this.game = new SnakeGame({
              gridCount: GRID_COUNT,
              tickInterval: TICK_INTERVAL,
              foodScore: FOOD_SCORE,
              initialLength: INITIAL_SNAKE_LENGTH,
              initialHead: INITIAL_HEAD,
              onUpdate: (snapshot) => this.handleGameUpdate(snapshot),
              onGameOver: (score) => this.scoreBoard.commitHighScore(score),
            });
          }
          queryDom() {
            return {
              panel: document.getElementById("panel"),
              boardArea: document.getElementById("boardArea"),
              canvas: document.getElementById("snakeCanvas"),
              score: document.getElementById("score"),
              highScore: document.getElementById("highScore"),
              statusBar: document.getElementById("statusBar"),
              statusText: document.getElementById("statusText"),
              pauseBtn: document.getElementById("pauseBtn"),
              restartBtn: document.getElementById("restartBtn"),
              themeToggle: document.getElementById("themeToggle"),
              dpad: document.getElementById("dpad"),
              dpadContainer: document.getElementById("dpadContainer"),
              opacitySlider: document.getElementById("opacitySlider"),
              opacityValue: document.getElementById("opacityValue"),
            };
          }
          start() {
            this.themeManager.onChange((palette) => this.renderer.setPalette(palette));
            this.themeManager.initialize();
            this.scoreBoard.loadHighScore();
            this.dpadOpacity.initialize();
            this.bindEvents();
            this.observeResize();
            this.renderer.scheduleResize();
            for (const delay of RESIZE_DELAYS) {
              window.setTimeout(() => this.renderer.scheduleResize(), delay);
            }
          }
          bindEvents() {
            document.addEventListener("keydown", (event) => this.handleKeyDown(event));
            document.addEventListener("visibilitychange", () => this.handleVisibilityChange());
            this.dom.pauseBtn.addEventListener("click", () => this.game.togglePause());
            this.dom.restartBtn.addEventListener("click", () => this.game.reset());
            this.dom.themeToggle.addEventListener("click", () => this.themeManager.toggle());
            this.dom.dpad.querySelectorAll(".dpad-btn").forEach((button) => {
              const direction = button.dataset.dir;
              button.addEventListener(
                "pointerdown",
                (event) => {
                  event.preventDefault();
                  event.stopPropagation();
                  this.game.turn(direction);
                },
                { passive: false },
              );
              button.addEventListener("contextmenu", (event) => event.preventDefault());
            });
            window.addEventListener("resize", () => this.renderer.scheduleResize());
            window.addEventListener("orientationchange", () => this.handleOrientationChange());
            window.addEventListener("pageshow", () => this.handlePageShow());
            if (window.visualViewport) {
              window.visualViewport.addEventListener("resize", () => this.renderer.scheduleResize());
            }
          }
          observeResize() {
            if (typeof ResizeObserver === "undefined") return;
            const observer = new ResizeObserver(() => this.renderer.scheduleResize());
            observer.observe(this.dom.boardArea);
            observer.observe(this.dom.panel);
          }
          handleKeyDown(event) {
            const direction = KEY_TO_DIRECTION[event.key];
            if (direction) {
              event.preventDefault();
              this.game.turn(direction);
              return;
            }
            if (event.key === " " || event.code === "Space") {
              event.preventDefault();
              this.game.togglePause();
            }
          }
          handleOrientationChange() {
            this.renderer.scheduleResize();
            for (const delay of ORIENTATION_DELAYS) {
              window.setTimeout(() => this.renderer.scheduleResize(), delay);
            }
          }
          handlePageShow() {
            this.dpadOpacity.sync();
            this.renderer.scheduleResize();
          }
          handleVisibilityChange() {
            if (document.hidden) {
              this.game.pauseIfPlaying();
              return;
            }
            this.dpadOpacity.sync();
            this.renderer.scheduleResize();
          }
          handleGameUpdate(snapshot) {
            this.statusBar.set(snapshot.status);
            this.scoreBoard.update(snapshot.score);
            this.dom.pauseBtn.textContent = BUTTON_TEXT[snapshot.status] || BUTTON_TEXT.waiting;
            this.dom.restartBtn.hidden = snapshot.status === "waiting";
            this.renderer.setSnapshot(snapshot);
          }
        }
        new SnakeApp().start();
      })();
    </script>
  </body>
