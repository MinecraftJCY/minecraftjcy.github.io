<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Base64 编解码</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light dark;
        --bg: #e8ecf3;
        --text: #3c4456;
        --text-soft: #7d8698;
        --text-mute: #a8b0c0;
        --accent: #5b6fd8;
        --success: #1e9e5a;
        --shade: rgba(163, 177, 198, 0.62);
        --light: rgba(255, 255, 255, 0.92);
        --raise: 6px 6px 12px var(--shade), -6px -6px 12px var(--light);
        --raise-sm: 3px 3px 6px var(--shade), -3px -3px 6px var(--light);
        --press: inset 5px 5px 10px var(--shade), inset -5px -5px 10px var(--light);
        --press-lg: inset 8px 8px 16px var(--shade), inset -8px -8px 16px var(--light);
        --panel-h: 22rem;
        --gap: 0.875rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2b2e35;
          --text: #dfe3ec;
          --text-soft: #838b9c;
          --text-mute: #6d7585;
          --accent: #8a9af0;
          --success: #4fd68a;
          --shade: rgba(0, 0, 0, 0.55);
          --light: rgba(255, 255, 255, 0.08);
        }
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        display: flex;
        padding: 1.75rem 1.25rem 3rem;
        transition:
          background-color 0.35s ease,
          color 0.35s ease;
      }
      [hidden] {
        display: none !important;
      }
      .app {
        margin: auto;
        width: 100%;
        max-width: 42rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      .title {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-align: center;
      }
      .tabs {
        position: relative;
        display: flex;
        align-self: center;
        padding: 0.35rem;
        border-radius: 1rem;
        background: var(--bg);
        box-shadow: var(--press);
      }
      .tab-indicator {
        position: absolute;
        top: 0.35rem;
        left: 0;
        height: calc(100% - 0.7rem);
        width: 0;
        border-radius: 0.75rem;
        background: var(--bg);
        box-shadow: var(--raise-sm);
        transition:
          transform 0.38s cubic-bezier(0.4, 0, 0.2, 1),
          width 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .tab {
        position: relative;
        z-index: 1;
        border: none;
        border-radius: 0.75rem;
        padding: 0.55rem 1.75rem;
        background: transparent;
        color: var(--text-soft);
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        transition: color 0.25s ease;
      }
      .tab.active {
        color: var(--text);
      }
      .panel {
        display: none;
        flex-direction: column;
        gap: var(--gap);
      }
      .panel.active {
        display: flex;
        height: var(--panel-h);
      }
      .actions {
        flex-shrink: 0;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.8rem;
      }
      .btn {
        border: none;
        border-radius: 0.9rem;
        padding: 0.7rem 0.5rem;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        box-shadow: var(--raise);
        transition:
          box-shadow 0.2s ease,
          color 0.2s ease;
      }
      .btn:active {
        box-shadow: var(--press);
      }
      .btn-sm {
        flex-shrink: 0;
        padding: 0.55rem 0.9rem;
        font-size: 0.875rem;
        border-radius: 0.75rem;
      }
      .field {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
        border-radius: 1.25rem;
        background: var(--bg);
        box-shadow: var(--press-lg);
      }
      .field textarea {
        flex: 1;
        min-height: 0;
        width: 100%;
        padding: 1rem 1rem 2.75rem;
        border: none;
        border-radius: 1.25rem;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 0.9375rem;
        line-height: 1.6;
        outline: none;
        resize: none;
      }
      .field textarea::placeholder {
        color: var(--text-mute);
      }
      .field textarea::-webkit-scrollbar {
        width: 8px;
      }
      .field textarea::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: var(--shade);
      }
      .field .copy {
        position: absolute;
        right: 0.75rem;
        bottom: 0.75rem;
        padding: 0.4rem 0.85rem;
        border: none;
        border-radius: 999px;
        background: var(--bg);
        color: var(--text-soft);
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: var(--raise-sm);
        transition:
          box-shadow 0.2s ease,
          color 0.2s ease;
      }
      .field .copy:active {
        box-shadow: var(--press);
      }
      .field .copy.is-copied {
        color: var(--success);
      }
      .drop {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem 1.25rem;
        border-radius: 1.25rem;
        background: var(--bg);
        box-shadow: var(--press-lg);
        cursor: pointer;
        outline: none;
        transition: box-shadow 0.22s ease;
      }
      .drop.dragover {
        box-shadow:
          var(--press-lg),
          0 0 0 3px rgba(91, 111, 216, 0.28);
      }
      .drop.has-file {
        cursor: default;
      }
      .drop-empty {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .drop-empty svg {
        color: var(--accent);
        flex-shrink: 0;
      }
      .drop-empty span {
        font-size: 0.9375rem;
        font-weight: 600;
        color: var(--text);
      }
      .drop-file {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        min-width: 0;
      }
      .file-name {
        max-width: 12em;
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toast {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translate(-50%, 1rem);
        max-width: calc(100% - 2.5rem);
        padding: 0.75rem 1.25rem;
        border-radius: 999px;
        background: var(--bg);
        color: var(--text);
        font-size: 0.875rem;
        font-weight: 600;
        text-align: center;
        box-shadow: var(--raise);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
        z-index: 100;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (min-width: 768px) {
        :root {
          --panel-h: 25rem;
          --gap: 1rem;
        }
        body {
          padding: 2.25rem 1.75rem 3.5rem;
        }
        .app {
          max-width: 48rem;
          gap: 1.5rem;
        }
        .title {
          font-size: 1.75rem;
        }
        .tab {
          padding: 0.65rem 2rem;
          font-size: 1rem;
        }
        .actions {
          gap: 0.9rem;
        }
        .btn {
          padding: 0.85rem 0.5rem;
          font-size: 1rem;
        }
        .btn-sm {
          padding: 0.65rem 1.1rem;
          font-size: 0.9375rem;
        }
        .field textarea {
          padding: 1.1rem 1.1rem 3rem;
          font-size: 1rem;
        }
        .field .copy {
          padding: 0.5rem 1rem;
          font-size: 0.875rem;
        }
        .drop {
          padding: 1.25rem 1.5rem;
        }
        .drop-empty svg {
          width: 24px;
          height: 24px;
        }
        .drop-empty span {
          font-size: 1rem;
        }
        .drop-file {
          gap: 0.875rem;
        }
        .file-name {
          max-width: 14em;
          font-size: 1.125rem;
        }
        .toast {
          padding: 0.85rem 1.5rem;
          font-size: 0.9375rem;
        }
      }
      @media (max-width: 480px) {
        :root {
          --panel-h: 23rem;
        }
        .actions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .drop-file {
          gap: 0.5rem;
        }
        .file-name {
          max-width: 7em;
          font-size: 0.9375rem;
        }
        .btn-sm {
          padding: 0.45rem 0.7rem;
          font-size: 0.8125rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1 class="title">Base64 编解码</h1>
      <nav class="tabs" role="tablist">
        <span class="tab-indicator" id="tabIndicator"></span>
        <button class="tab active" type="button" role="tab" data-tab="text" aria-selected="true">文本</button>
        <button class="tab" type="button" role="tab" data-tab="file" aria-selected="false">文件</button>
      </nav>
      <section class="panel active" id="panel-text" role="tabpanel">
        <div class="actions">
          <button class="btn" id="encodeText" type="button">编码</button>
          <button class="btn" id="decodeText" type="button">解码</button>
          <button class="btn" id="swapText" type="button">交换</button>
          <button class="btn" id="clearText" type="button">清空</button>
        </div>
        <div class="field">
          <textarea id="inputText" placeholder="输入需要编码或解码的文本" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
          <button class="copy" id="copyInput" type="button">复制</button>
        </div>
        <div class="field">
          <textarea id="outputText" placeholder="结果" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
          <button class="copy" id="copyOutput" type="button">复制</button>
        </div>
      </section>
      <section class="panel" id="panel-file" role="tabpanel">
        <div class="drop" id="encodeDrop" tabindex="0">
          <div class="drop-empty">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4M12 4 7.5 8.5M12 4l4.5 4.5" />
              <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
            </svg>
            <span>编码为 Base64</span>
          </div>
          <div class="drop-file" hidden>
            <p class="file-name"></p>
            <button class="btn btn-sm" type="button" data-action="remove">移除</button>
            <button class="btn btn-sm" type="button" data-action="encode">编码并下载</button>
          </div>
          <input type="file" id="encodeFile" hidden />
        </div>
        <div class="drop" id="decodeDrop" tabindex="0">
          <div class="drop-empty">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4M12 4 7.5 8.5M12 4l4.5 4.5" />
              <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" />
            </svg>
            <span>从 Base64 解码</span>
          </div>
          <div class="drop-file" hidden>
            <p class="file-name"></p>
            <button class="btn btn-sm" type="button" data-action="remove">移除</button>
            <button class="btn btn-sm" type="button" data-action="decode">解码并下载</button>
          </div>
          <input type="file" id="decodeFile" accept=".txt,text/plain" hidden />
        </div>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      (() => {
        "use strict";
        const CHUNK = 0x8000;
        const $ = (id) => document.getElementById(id);
        const els = {
          tabs: Array.from(document.querySelectorAll(".tab")),
          panels: Array.from(document.querySelectorAll(".panel")),
          indicator: $("tabIndicator"),
          input: $("inputText"),
          output: $("outputText"),
          toast: $("toast"),
          encodeDrop: $("encodeDrop"),
          decodeDrop: $("decodeDrop"),
          encodeFile: $("encodeFile"),
          decodeFile: $("decodeFile"),
        };
        let toastTimer;
        function toast(message) {
          clearTimeout(toastTimer);
          els.toast.textContent = message;
          els.toast.classList.add("show");
          toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2200);
        }
        function moveIndicator() {
          const active = document.querySelector(".tab.active");
          if (!active) return;
          els.indicator.style.width = active.offsetWidth + "px";
          els.indicator.style.transform = `translateX(${active.offsetLeft}px)`;
        }
        function activateTab(name) {
          els.tabs.forEach((tab) => {
            const active = tab.dataset.tab === name;
            tab.classList.toggle("active", active);
            tab.setAttribute("aria-selected", String(active));
          });
          els.panels.forEach((panel) => {
            panel.classList.toggle("active", panel.id === "panel-" + name);
          });
          moveIndicator();
        }
        function encodeText(text) {
          const bytes = new TextEncoder().encode(text);
          let binary = "";
          for (let i = 0; i < bytes.length; i += CHUNK) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
          }
          return btoa(binary);
        }
        function decodeText(base64) {
          const clean = base64.replace(/[\s\r\n]+/g, "");
          const binary = atob(clean);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) {
            bytes[i] = binary.charCodeAt(i);
          }
          return new TextDecoder("utf-8", { fatal: false }).decode(bytes);
        }
        function base64ToBytes(base64) {
          const normalized = base64.replace(/-/g, "+").replace(/_/g, "/");
          const clean = normalized.replace(/[^A-Za-z0-9+/=]/g, "");
          const binary = atob(clean);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) {
            bytes[i] = binary.charCodeAt(i);
          }
          return bytes;
        }
        function download(blob, filename) {
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
        }
        async function copy(text) {
          if (!text) {
            toast("没有可复制的内容");
            return;
          }
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
            } else {
              const helper = document.createElement("textarea");
              helper.value = text;
              helper.style.cssText = "position:fixed;top:-1000px;opacity:0";
              document.body.appendChild(helper);
              helper.select();
              document.execCommand("copy");
              helper.remove();
            }
            toast("已复制");
          } catch {
            toast("复制失败");
          }
        }
        function flashCopy(button) {
          if (button.classList.contains("is-copied")) return;
          const original = button.textContent;
          button.textContent = "已复制";
          button.classList.add("is-copied");
          setTimeout(() => {
            button.textContent = original;
            button.classList.remove("is-copied");
          }, 1200);
        }
        function handleEncodeText() {
          const value = els.input.value;
          if (!value) {
            toast("请输入需要编码的文本");
            return;
          }
          try {
            els.output.value = encodeText(value);
            toast("编码完成");
          } catch {
            toast("编码失败");
          }
        }
        function handleDecodeText() {
          const value = els.input.value.trim();
          if (!value) {
            toast("请输入需要解码的 Base64");
            return;
          }
          try {
            els.output.value = decodeText(value);
            toast("解码完成");
          } catch {
            toast("解码失败，内容不是有效的 Base64");
          }
        }
        function handleSwapText() {
          const current = els.input.value;
          els.input.value = els.output.value;
          els.output.value = current;
        }
        function handleClearText() {
          els.input.value = "";
          els.output.value = "";
          els.input.focus();
        }
        function createPicker(drop, fileInput) {
          const empty = drop.querySelector(".drop-empty");
          const fileView = drop.querySelector(".drop-file");
          const nameEl = drop.querySelector(".file-name");
          const picker = { file: null };
          function show(file) {
            picker.file = file;
            nameEl.textContent = file.name;
            empty.hidden = true;
            fileView.hidden = false;
            drop.classList.add("has-file");
          }
          function clear() {
            picker.file = null;
            fileInput.value = "";
            empty.hidden = false;
            fileView.hidden = true;
            drop.classList.remove("has-file");
          }
          picker.clear = clear;
          drop.addEventListener("click", (event) => {
            if (event.target.closest(".drop-file")) return;
            if (!picker.file) fileInput.click();
          });
          drop.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              if (!picker.file) fileInput.click();
            }
          });
          fileInput.addEventListener("change", (event) => {
            const file = event.target.files && event.target.files[0];
            fileInput.value = "";
            if (file) show(file);
          });
          ["dragenter", "dragover"].forEach((type) => {
            drop.addEventListener(type, (event) => {
              event.preventDefault();
              drop.classList.add("dragover");
            });
          });
          ["dragleave", "dragend", "drop"].forEach((type) => {
            drop.addEventListener(type, (event) => {
              event.preventDefault();
              drop.classList.remove("dragover");
            });
          });
          drop.addEventListener("drop", (event) => {
            const file = event.dataTransfer && event.dataTransfer.files[0];
            if (file) show(file);
          });
          fileView.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-action]");
            if (button && button.dataset.action === "remove") clear();
          });
          return picker;
        }
        const encodePicker = createPicker(els.encodeDrop, els.encodeFile);
        const decodePicker = createPicker(els.decodeDrop, els.decodeFile);
        function encodeSelectedFile() {
          const file = encodePicker.file;
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const dataUrl = String(reader.result || "");
            const base64 = dataUrl.slice(dataUrl.indexOf(",") + 1);
            const outName = file.name + ".txt";
            download(new Blob([base64], { type: "text/plain;charset=utf-8" }), outName);
            toast("已下载 " + outName);
          };
          reader.onerror = () => toast("读取文件失败");
          reader.readAsDataURL(file);
        }
        function decodeSelectedFile() {
          const file = decodePicker.file;
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              let payload = String(reader.result || "")
                .trim()
                .replace(/[\s\r\n]+/g, "");
              const match = payload.match(/^data:([^;,]*)(;base64)?,/i);
              if (match) payload = payload.slice(match[0].length);
              if (!payload) throw new Error("empty");
              const bytes = base64ToBytes(payload);
              const outName = /\.txt$/i.test(file.name) ? file.name.slice(0, -4) : file.name || "decoded";
              download(new Blob([bytes], { type: "application/octet-stream" }), outName);
              toast("已下载 " + outName);
            } catch {
              toast("解码失败，文件内容不是有效的 Base64");
            }
          };
          reader.onerror = () => toast("读取文件失败");
          reader.readAsText(file);
        }
        els.encodeDrop.querySelector('[data-action="encode"]').addEventListener("click", encodeSelectedFile);
        els.decodeDrop.querySelector('[data-action="decode"]').addEventListener("click", decodeSelectedFile);
        els.tabs.forEach((tab) => {
          tab.addEventListener("click", () => activateTab(tab.dataset.tab));
        });
        $("encodeText").addEventListener("click", handleEncodeText);
        $("decodeText").addEventListener("click", handleDecodeText);
        $("swapText").addEventListener("click", handleSwapText);
        $("clearText").addEventListener("click", handleClearText);
        $("copyInput").addEventListener("click", async (event) => {
          await copy(els.input.value);
          flashCopy(event.currentTarget);
        });
        $("copyOutput").addEventListener("click", async (event) => {
          await copy(els.output.value);
          flashCopy(event.currentTarget);
        });
        els.input.addEventListener("keydown", (event) => {
          if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
            event.preventDefault();
            handleEncodeText();
          }
        });
        window.addEventListener("dragover", (event) => event.preventDefault());
        window.addEventListener("drop", (event) => event.preventDefault());
        window.addEventListener("resize", moveIndicator);
        requestAnimationFrame(() => {
          els.indicator.style.transition = "none";
          moveIndicator();
          requestAnimationFrame(() => {
            els.indicator.style.transition = "";
          });
        });
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(moveIndicator);
        }
      })();
    </script>
  </body>
</html>
