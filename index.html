<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>主页</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #e7e2d8;
        --sheen: rgba(255, 255, 255, 0.55);
        --paper: #fbf9f4;
        --ink: #33302a;
        --punct: #a9a091;
        --key: #1c5b8c;
        --str: #a13a2b;
        --rule: rgba(74, 62, 44, 0.16);
        --hover: rgba(28, 91, 140, 0.065);
        --grain: rgba(58, 48, 33, 0.9);
        --sheet-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), 0 1px 2px rgba(48, 38, 22, 0.05), 0 14px 30px -20px rgba(48, 38, 22, 0.4), 0 50px 90px -60px rgba(48, 38, 22, 0.55);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0d0c0b;
          --sheen: rgba(255, 255, 255, 0.03);
          --paper: #1a1917;
          --ink: #d8d3c9;
          --punct: #6c665c;
          --key: #7cbaea;
          --str: #e2947d;
          --rule: rgba(255, 255, 255, 0.1);
          --hover: rgba(124, 186, 234, 0.08);
          --grain: rgba(255, 250, 240, 0.85);
          --sheet-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 1px 2px rgba(0, 0, 0, 0.5), 0 14px 30px -20px rgba(0, 0, 0, 0.85), 0 50px 90px -60px rgba(0, 0, 0, 1);
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(18px, 4vw, 64px) clamp(14px, 3vw, 40px);
        background-color: var(--page);
        background-image: radial-gradient(120% 90% at 50% 0%, var(--sheen), transparent 62%);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .sheet {
        position: relative;
        isolation: isolate;
        width: min(920px, 100%);
        padding: clamp(26px, 4.5vw, 60px) clamp(22px, 5.5vw, 76px) clamp(22px, 3.5vw, 44px);
        background-color: var(--paper);
        border-radius: 2px;
        box-shadow: var(--sheet-shadow);
        overflow: hidden;
        animation: rise 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .sheet::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0.05;
        background-image: radial-gradient(var(--grain) 0.5px, transparent 0.6px), radial-gradient(var(--grain) 0.5px, transparent 0.6px);
        background-size:
          3px 3px,
          7px 7px;
        background-position:
          0 0,
          2px 3px;
      }
      .masthead,
      .colophon {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 14px;
        font-size: clamp(11px, 0.55vw + 9px, 14px);
        color: var(--punct);
      }
      .masthead {
        padding-bottom: 14px;
        margin-bottom: clamp(20px, 3vw, 36px);
        border-bottom: 1px solid var(--rule);
        letter-spacing: 0.2em;
      }
      .masthead__name {
        color: var(--ink);
        letter-spacing: 0.1em;
      }
      .colophon {
        margin-top: clamp(20px, 3vw, 36px);
        padding-top: 14px;
        border-top: 1px solid var(--rule);
        letter-spacing: 0.16em;
      }
      .code {
        font-size: clamp(14.5px, 1.45vw + 9.5px, 22px);
        line-height: 1.9;
        overflow-wrap: break-word;
      }
      .body {
        padding-left: 1.7em;
      }
      .item {
        display: block;
        margin-left: -0.75em;
        padding-left: 0.75em;
        margin-right: -0.5em;
        padding-right: 0.5em;
        border-radius: 3px;
        color: inherit;
        text-decoration: none;
        transition: background-color 0.16s ease;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        scroll-margin-block: 14px;
      }
      .item:active {
        background-color: var(--hover);
      }
      @media (hover: hover) {
        .item:hover {
          background-color: var(--hover);
        }
      }
      .item:focus-visible {
        background-color: var(--hover);
        outline: 2px solid var(--key);
        outline-offset: 2px;
      }
      @media (forced-colors: active) {
        .item:focus-visible {
          outline: 2px solid Highlight;
        }
      }
      .punct {
        color: var(--punct);
      }
      .key {
        color: var(--key);
      }
      .str {
        color: var(--str);
      }
      @media (min-width: 768px) {
        .sheet {
          width: min(1000px, 100%);
          padding: 66px 92px 50px;
        }
        .sheet::before {
          background-image: radial-gradient(var(--grain) 0.6px, transparent 0.7px), radial-gradient(var(--grain) 0.6px, transparent 0.7px);
          background-size:
            5px 5px,
            11px 11px;
          background-position:
            0 0,
            3px 4px;
        }
        .code {
          line-height: 2;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sheet {
          animation: none;
        }
        .item {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <header class="masthead">
        <span class="masthead__name">index.json</span>
        <span>utf-8</span>
      </header>
      <section class="code" id="code"></section>
      <footer class="colophon">
        <span id="count"></span>
        <span>end of file</span>
      </footer>
    </main>
    <script>
      const DATA = [
        {
          key: "娱乐",
          items: [
            { key: "tetris", value: "俄罗斯方块", href: "俄罗斯方块.html" },
            { key: "snake", value: "贪吃蛇", href: "贪吃蛇.html" },
            { key: "klotski", value: "数字华容道", href: "数字华容道.html" },
            { key: "game2048", value: "2048", href: "2048.html" },
            { key: "gomoku", value: "五子棋", href: "五子棋.html" },
            { key: "hanoi", value: "汉诺塔", href: "汉诺塔.html" },
            { key: "breakout", value: "打砖块", href: "打砖块.html" },
            { key: "sudoku", value: "数独", href: "数独.html" },
            { key: "lottery", value: "幸运彩票", href: "彩票.html" },
            { key: "vacuum", value: "扫地机器人", href: "扫地机器人.html" },
            { key: "match3", value: "消消乐", href: "消消乐.html" },
            { key: "agar", value: "大球吃小球", href: "大球吃小球.html" },
            { key: "starWars", value: "星际大战", href: "星际大战.html" },
            { key: "maze", value: "3D迷宫", href: "迷宫.html" },
          ],
        },
        {
          key: "工具",
          items: [
            { key: "base64", value: "Base64 编解码", href: "Base64.html" },
            { key: "qrcode", value: "二维码生成器", href: "二维码.html" },
            { key: "uuid", value: "UUID 生成器", href: "UUID.html" },
            { key: "randomString", value: "随机字符生成器", href: "随机字符.html" },
            { key: "charStats", value: "字符统计", href: "字符统计.html" },
            { key: "bccToSrt", value: "BCC 转 SRT", href: "BCC转SRT.html" },
            { key: "primes", value: "素数与因数", href: "素数.html" },
            { key: "relativity", value: "相对论效应", href: "相对论.html" },
            { key: "endPortal", value: "末地传送门定位器", href: "末地传送门.html" },
          ],
        },
        {
          key: "展示",
          items: [
            { key: "codeRain", value: "代码雨", href: "代码雨.html" },
            { key: "boids", value: "鱼群", href: "鱼群.html" },
            { key: "Love", value: "爱心", href: "爱心.html" },
            { key: "timesTable", value: "乘法口诀表", href: "乘法口诀.html" },
          ],
        },
      ];
      const el = (tag, props = {}, ...children) => {
        const node = document.createElement(tag);
        if (props.class) node.className = props.class;
        if (props.text != null) node.textContent = props.text;
        if (props.href) node.href = props.href;
        node.append(...children);
        return node;
      };
      const span = (cls, text) => el("span", { class: cls, text });
      const div = (...children) => el("div", {}, ...children);
      const block = (...children) => el("div", { class: "body" }, ...children);
      const punct = (text) => span("punct", text);
      const key = (text) => span("key", text);
      const value = (text) => span("str", text);
      const entry = (item, isLast) => el("a", { class: "item", href: item.href }, punct('"'), key(item.key), punct('": '), value(`"${item.value}"`), punct(isLast ? "" : ","));
      const section = (s, isLast) => div(div(punct('"'), key(s.key), punct('": {')), block(...s.items.map((item, i) => entry(item, i === s.items.length - 1))), div(punct(isLast ? "}" : "},")));
      const tree = (data) => div(div(punct("{")), block(...data.map((s, i) => section(s, i === data.length - 1))), div(punct("}")));
      document.getElementById("code").append(tree(DATA));
      document.getElementById("count").textContent = `${DATA.length} sections · ${DATA.reduce((n, s) => n + s.items.length, 0)} entries`;
    </script>
  </body>
</html>
