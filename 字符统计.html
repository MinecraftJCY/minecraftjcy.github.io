<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字符统计</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        color-scheme: light;
        --paper: #f6f5f1;
        --ink: #1c1b19;
        --rule: rgba(28, 27, 25, 0.16);
        --muted: rgba(28, 27, 25, 0.44);
        --faint: rgba(28, 27, 25, 0.2);
        --accent: #b4362a;
        --select-bg: #cdd6e0;
        --fs: 1.15rem;
        --lh: 2.15rem;
        --baseline: 0.35;
        --gap: 3px;
        --line-y: calc(var(--lh) / 2 + var(--fs) * var(--baseline) + var(--gap));
        --pad-x: clamp(1.1rem, 4vw, 1.75rem);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --paper: #131315;
          --ink: #eae7e0;
          --rule: rgba(234, 231, 224, 0.13);
          --muted: rgba(234, 231, 224, 0.46);
          --faint: rgba(234, 231, 224, 0.2);
          --accent: #e25b4b;
          --select-bg: #3b4550;
        }
      }
      html {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        padding: clamp(28px, 6vw, 64px) clamp(16px, 5vw, 48px);
        background: var(--paper);
        color: var(--ink);
        transition:
          background-color 0.45s ease,
          color 0.45s ease;
      }
      ::selection {
        background: var(--select-bg);
        color: var(--ink);
      }
      .sheet {
        width: 100%;
        max-width: 780px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: clamp(1.75rem, 4vw, 2.75rem);
      }
      .head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1.25rem;
        flex-wrap: wrap;
        padding: 0 var(--pad-x);
      }
      .title {
        margin: 0;
        font-size: 0.92rem;
        font-weight: 500;
        letter-spacing: 0.26em;
        white-space: nowrap;
      }
      .meta {
        display: flex;
        align-items: baseline;
        gap: 1.5rem;
      }
      .total {
        margin: 0;
        font-size: 0.84rem;
        letter-spacing: 0.12em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        transition: color 0.45s ease;
      }
      .clear {
        flex: none;
        padding: 0 0 0.22em;
        border: 0;
        border-bottom: 1px solid var(--faint);
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 0.84rem;
        letter-spacing: 0.1em;
        cursor: pointer;
        transition:
          color 0.25s ease,
          border-color 0.25s ease;
      }
      .clear:hover {
        color: var(--ink);
        border-color: var(--ink);
      }
      .clear:active {
        opacity: 0.45;
      }
      .clear:focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 3px;
      }
      .input {
        display: block;
        width: 100%;
        min-height: calc(var(--lh) * 6);
        max-height: 58vh;
        padding: var(--lh) var(--pad-x) 0;
        border: 0;
        border-radius: 0;
        background-color: transparent;
        background-image: linear-gradient(to bottom, transparent var(--line-y), var(--rule) var(--line-y), var(--rule) calc(var(--line-y) + 1px), transparent calc(var(--line-y) + 1px));
        background-size: calc(100% - 2 * var(--pad-x)) var(--lh);
        background-position: var(--pad-x) 0;
        background-repeat: repeat-y;
        background-origin: padding-box;
        background-attachment: local;
        color: inherit;
        font: inherit;
        font-size: var(--fs);
        line-height: var(--lh);
        resize: none;
        overflow-y: auto;
        outline: none;
        caret-color: var(--ink);
        scrollbar-width: thin;
        scrollbar-color: var(--faint) transparent;
        transition: color 0.45s ease;
      }
      .input::placeholder {
        color: var(--faint);
        transition: color 0.45s ease;
      }
      .input::-webkit-scrollbar {
        width: 5px;
      }
      .input::-webkit-scrollbar-track {
        background: transparent;
      }
      .input::-webkit-scrollbar-thumb {
        background: var(--faint);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
        padding: 0 var(--pad-x);
      }
      .stat {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.55rem;
        min-width: 0;
      }
      .label {
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        color: var(--muted);
        white-space: nowrap;
        transition: color 0.45s ease;
      }
      .value {
        font-size: clamp(1.4rem, 4.5vw, 2rem);
        font-weight: 300;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: clamp(24px, 6vh, 48px);
        transform: translate(-50%, 10px);
        padding: 0.6em 1.3em;
        border-radius: 2px;
        background: var(--ink);
        color: var(--paper);
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        text-indent: 0.16em;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        z-index: 10;
        transition:
          opacity 0.3s ease,
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          background-color 0.45s ease,
          color 0.45s ease;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 380px) {
        .label {
          font-size: 0.68rem;
          letter-spacing: 0.1em;
        }
        .value {
          font-size: 1.25rem;
        }
        .stats {
          gap: 0.5rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <header class="head">
        <h1 class="title">字符统计</h1>
        <div class="meta">
          <span class="total" id="total">共 0 字符</span>
          <button class="clear" id="clear" type="button">清空</button>
        </div>
      </header>
      <textarea class="input" id="input" placeholder="在此输入或粘贴文本…" spellcheck="false" aria-label="文本输入"></textarea>
      <div class="stats">
        <div class="stat">
          <span class="label">汉字</span>
          <span class="value" id="c-han">0</span>
        </div>
        <div class="stat">
          <span class="label">字母</span>
          <span class="value" id="c-alpha">0</span>
        </div>
        <div class="stat">
          <span class="label">数字</span>
          <span class="value" id="c-digit">0</span>
        </div>
        <div class="stat">
          <span class="label">其他</span>
          <span class="value" id="c-other">0</span>
        </div>
      </div>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      (function () {
        const input = document.getElementById("input");
        const totalEl = document.getElementById("total");
        const clearBtn = document.getElementById("clear");
        const toastEl = document.getElementById("toast");
        const hanEl = document.getElementById("c-han");
        const alphaEl = document.getElementById("c-alpha");
        const digitEl = document.getElementById("c-digit");
        const otherEl = document.getElementById("c-other");
        const HAN = /\p{Script=Han}/gu;
        const ALPHA = /[A-Za-z]/g;
        const DIGIT = /[0-9]/g;
        const count = (text, re) => (text.match(re) || []).length;
        const fit = () => {
          input.style.height = "auto";
          input.style.height = input.scrollHeight + "px";
        };
        const update = () => {
          const text = input.value;
          const chars = Array.from(text).length;
          const han = count(text, HAN);
          const alpha = count(text, ALPHA);
          const digit = count(text, DIGIT);
          const other = Math.max(chars - han - alpha - digit, 0);
          hanEl.textContent = han;
          alphaEl.textContent = alpha;
          digitEl.textContent = digit;
          otherEl.textContent = other;
          totalEl.textContent = "共 " + chars + " 字符";
        };
        const refresh = () => {
          fit();
          update();
        };
        let toastTimer;
        const toast = (msg) => {
          toastEl.textContent = msg;
          toastEl.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
        };
        input.addEventListener("input", refresh);
        clearBtn.addEventListener("click", () => {
          if (!input.value) return;
          input.value = "";
          refresh();
          input.focus();
          toast("已清空");
        });
        let raf;
        window.addEventListener("resize", () => {
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(fit);
        });
        refresh();
      })();
    </script>
  </body>
</html>
