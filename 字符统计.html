<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>字符统计</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        color-scheme: light;
        --bg: #e9edf3;
        --shadow-dark: #c2c8d3;
        --shadow-light: #ffffff;
        --text: #2c313a;
        --muted: #5a6270;
        --faint: #aeb6c4;
        --raise: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
        --raise-sm: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);
        --sink: inset 6px 6px 14px var(--shadow-dark), inset -6px -6px 14px var(--shadow-light);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #24272e;
          --shadow-dark: #191b20;
          --shadow-light: #2f333c;
          --text: #e2e6ee;
          --muted: #9aa2b2;
          --faint: #5c6373;
        }
      }
      html {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        padding: 48px 32px;
        background: var(--bg);
        color: var(--text);
        transition:
          background-color 0.35s ease,
          color 0.35s ease;
      }
      .app {
        margin: auto;
        width: 100%;
        max-width: 760px;
        display: flex;
        flex-direction: column;
        gap: 32px;
      }
      .title {
        margin: 0;
        text-align: center;
        font-size: 1.6rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-indent: 0.18em;
        transition: color 0.35s ease;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        padding: 26px 20px;
        border-radius: 26px;
        background: var(--bg);
        box-shadow: var(--sink);
        transition:
          box-shadow 0.28s ease,
          background-color 0.35s ease;
      }
      .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 6px 4px;
      }
      .stat-label {
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-indent: 0.08em;
        transition: color 0.35s ease;
      }
      .stat-value {
        font-size: 2rem;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
        transition: color 0.35s ease;
      }
      @keyframes valuePop {
        from {
          transform: scale(0.94);
          opacity: 0.5;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .pop {
        animation: valuePop 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      .input {
        width: 100%;
        height: 300px;
        padding: 26px 28px;
        border: none;
        outline: none;
        resize: none;
        border-radius: 26px;
        background: var(--bg);
        color: var(--text);
        font-size: 1.1rem;
        line-height: 1.8;
        box-shadow: var(--sink);
        scrollbar-width: thin;
        scrollbar-color: var(--faint) transparent;
        transition:
          box-shadow 0.28s ease,
          background-color 0.35s ease,
          color 0.35s ease;
      }
      .input::placeholder {
        color: var(--faint);
      }
      .input:focus,
      .input:focus-visible {
        outline: none;
      }
      .input::-webkit-scrollbar {
        width: 10px;
      }
      .input::-webkit-scrollbar-track {
        background: transparent;
      }
      .input::-webkit-scrollbar-thumb {
        background: var(--faint);
        background-clip: content-box;
        border: 3px solid transparent;
        border-radius: 10px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .total {
        font-size: 0.9rem;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        transition: color 0.35s ease;
      }
      .actions {
        display: flex;
        gap: 16px;
      }
      .btn {
        padding: 14px 34px;
        border: none;
        border-radius: 16px;
        background: var(--bg);
        color: var(--text);
        font-size: 1.05rem;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-indent: 0.1em;
        cursor: pointer;
        box-shadow: var(--raise-sm);
        transition:
          box-shadow 0.22s ease,
          color 0.22s ease,
          background-color 0.35s ease;
      }
      .btn:active {
        box-shadow: var(--sink);
      }
      .btn:focus-visible {
        box-shadow:
          var(--raise-sm),
          0 0 0 2px var(--faint);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 40px;
        transform: translate(-50%, 14px);
        padding: 14px 28px;
        border-radius: 16px;
        background: var(--bg);
        color: var(--text);
        font-size: 0.9rem;
        letter-spacing: 0.1em;
        text-indent: 0.1em;
        white-space: nowrap;
        box-shadow: var(--raise);
        opacity: 0;
        pointer-events: none;
        z-index: 10;
        transition:
          opacity 0.3s ease,
          transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1),
          background-color 0.35s ease,
          color 0.35s ease;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 640px) {
        body {
          padding: 32px 20px;
        }
        .app {
          gap: 22px;
        }
        .title {
          font-size: 1.3rem;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
          gap: 20px 12px;
          padding: 22px 16px;
          border-radius: 22px;
        }
        .stat-label {
          font-size: 0.8rem;
        }
        .stat-value {
          font-size: 1.6rem;
        }
        .input {
          height: 240px;
          padding: 20px;
          font-size: 16px;
          border-radius: 22px;
        }
        .actions {
          width: 100%;
        }
        .btn {
          flex: 1;
          padding: 13px 18px;
          font-size: 0.95rem;
        }
        .total {
          font-size: 0.85rem;
        }
        .toast {
          bottom: 28px;
          padding: 12px 22px;
          font-size: 0.85rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1 class="title">字符统计</h1>
      <section class="stats">
        <div class="stat">
          <span class="stat-label">汉字</span>
          <span class="stat-value" id="hanCount">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">字母</span>
          <span class="stat-value" id="alphaCount">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">数字</span>
          <span class="stat-value" id="digitCount">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">其他符号</span>
          <span class="stat-value" id="otherCount">0</span>
        </div>
      </section>
      <textarea class="input" id="textInput" placeholder="在此输入或粘贴文本…" spellcheck="false"></textarea>
      <div class="toolbar">
        <span class="total" id="totalBadge">共 0 字符</span>
        <div class="actions">
          <button class="btn" id="clearBtn" type="button">清空</button>
        </div>
      </div>
    </main>
    <div class="toast" id="toast"></div>
    <script>
      (function () {
        const byId = (id) => document.getElementById(id);
        const input = byId("textInput");
        const total = byId("totalBadge");
        const toast = byId("toast");
        const clearBtn = byId("clearBtn");
        const counters = [
          { el: byId("hanCount"), pattern: /[\u4e00-\u9fa5]/g },
          { el: byId("alphaCount"), pattern: /[a-zA-Z]/g },
          { el: byId("digitCount"), pattern: /[0-9]/g },
          { el: byId("otherCount"), pattern: null },
        ];
        const countMatches = (text, pattern) => (text.match(pattern) || []).length;
        const playPop = (el) => {
          el.classList.remove("pop");
          void el.offsetWidth;
          el.classList.add("pop");
        };
        const update = () => {
          const text = input.value;
          const han = countMatches(text, counters[0].pattern);
          const alpha = countMatches(text, counters[1].pattern);
          const digit = countMatches(text, counters[2].pattern);
          const values = [han, alpha, digit, text.length - han - alpha - digit];
          counters.forEach(({ el }, i) => {
            const next = String(values[i]);
            if (el.textContent !== next) {
              el.textContent = next;
              playPop(el);
            }
          });
          total.textContent = `共 ${text.length} 字符`;
        };
        let toastTimer;
        const showToast = (message) => {
          toast.textContent = message;
          toast.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
        };
        input.addEventListener("input", update);
        clearBtn.addEventListener("click", () => {
          if (!input.value) return;
          input.value = "";
          update();
          input.focus();
          showToast("已清空");
        });
        update();
      })();
    </script>
  </body>
</html>
